<!DOCTYPE html>
<html>
<head>
    <title>JITM · Barcode Generator</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .bc-wrap { display: grid; grid-template-columns: 300px 1fr; gap: 16px; }
        .bc-left, .bc-right { display: flex; flex-direction: column; gap: 12px; }
        
        .search-wrap { position: relative; }
        .search-results {
            position: absolute; top: 100%; left: 0; right: 0;
            background: #fff; border: 1px solid #e2e1de; border-radius: 8px;
            max-height: 280px; overflow-y: auto; z-index: 50;
            box-shadow: 0 4px 12px rgba(0,0,0,.1); display: none;
        }
        .search-results.show { display: block; }
        .search-item {
            padding: 10px 12px; cursor: pointer; border-bottom: 1px solid #f3f2ef;
        }
        .search-item:last-child { border-bottom: none; }
        .search-item:hover, .search-item.hl { background: #f0effc; }
        .search-item .si-name { font-size: 13px; font-weight: 600; color: #1a1c2e; }
        .search-item .si-detail { font-size: 11px; color: #6b7280; margin-top: 2px; }
        .search-item .si-sku { font-size: 11px; color: #3b4fe2; font-weight: 600; }
        
        .queue-list { max-height: 360px; overflow-y: auto; }
        .queue-item {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 10px; border-bottom: 1px solid #f3f2ef; font-size: 12px;
        }
        .queue-item:last-child { border-bottom: none; }
        .queue-item .qi-name { flex: 1; font-weight: 600; }
        .queue-item .qi-sku { color: #3b4fe2; font-family: monospace; }
        .queue-item .qi-copies { color: #6b7280; min-width: 36px; text-align: center; }
        .queue-item .qi-remove {
            color: #dc2626; cursor: pointer; font-size: 14px;
            padding: 2px 6px; background: none; border: none;
        }
        .queue-item .qi-remove:hover { background: #fef2f2; border-radius: 4px; }
        
        .controls {
            display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;
        }
        .controls > div { display: flex; flex-direction: column; gap: 4px; }
        .controls label { font-size: 11px; color: #6b7280; font-weight: 600; text-transform: uppercase; }
        .controls input[type=number] { width: 70px; padding: 6px 8px; border: 1px solid #e2e1de; border-radius: 4px; font-size: 13px; }
        .controls select { padding: 6px 8px; border: 1px solid #e2e1de; border-radius: 4px; font-size: 13px; }
        
        .preview-grid {
            display: grid;
            gap: 0;
            padding: 0;
            justify-content: center;
        }
        .preview-label {
            border: 1px solid #e2e1de;
            padding: 2px;
            text-align: center;
            background: #fff;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .preview-label svg {
            display: block;
            margin: 0 auto;
            max-width: 100%;
            height: auto;
        }
        .preview-label .pl-sku {
            font-size: 8px;
            font-weight: 700;
            font-family: monospace;
            margin-top: 1px;
        }
        .preview-label .pl-name {
            font-size: 6px;
            color: #6b7280;
            margin-top: 1px;
        }
        .preview-label .pl-warn {
            font-size: 6px;
            color: #d97706;
            margin-top: 1px;
            font-style: italic;
        }
        
        .print-area { display: none; }
        
        @media print {
            @page { margin: 0; }
            body * { visibility: hidden !important; }
            .print-area, .print-area * { visibility: visible !important; }
            .print-area {
                display: block !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
            }
            .print-page {
                display: grid;
                page-break-after: always;
                box-sizing: border-box;
            }
            .print-label {
                border: 1px dashed #ccc;
                padding: 2px;
                text-align: center;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                box-sizing: border-box;
            }
            .print-label svg {
                display: block;
                margin: 0 auto;
                max-width: 100%;
                height: auto;
            }
            .print-label .pl-sku {
                font-size: 8px;
                font-weight: 700;
                font-family: monospace;
                margin-top: 1px;
            }
            .print-label .pl-name {
                font-size: 6px;
                color: #333;
                margin-top: 1px;
            }
        }
    </style>
</head>
<body>
    {{sidebar|safe}}
    <div class="main">
        <div class="topbar">
            <h2>Barcode Generator</h2>
            <div class="actions">
                <span class="text-muted">{{name}}</span>
            </div>
        </div>
        <div class="content">
            <div class="bc-wrap">
                <div class="bc-left">
                    <div class="card">
                        <div class="card-body">
                            <div class="search-wrap">
                                <input id="searchInput" placeholder="Search product or SKU..." autofocus>
                                <div class="search-results" id="searchResults"></div>
                            </div>
                        </div>
                    </div>
                    <div class="card" style="flex:1">
                        <div class="card-body">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                                <h3 style="margin:0;font-size:14px">Queue</h3>
                                <button class="btn btn-ghost btn-sm" onclick="clearQueue()">Clear All</button>
                            </div>
                            <div class="queue-list" id="queueList">
                                <div style="text-align:center;color:#9ca3af;padding:20px 0;font-size:12px">
                                    Search and add products
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bc-right">
                    <div class="card">
                        <div class="card-body">
                            <div class="controls">
                                <div>
                                    <label>Copies</label>
                                    <input type="number" id="copies" value="1" min="1" max="100" onchange="renderPreview()">
                                </div>
                                <div>
                                    <label>Orientation</label>
                                    <select id="orientation" onchange="renderPreview()">
                                        <option value="landscape" selected>1.5" × 1" (Landscape)</option>
                                        <option value="portrait">1" × 1.5" (Portrait)</option>
                                    </select>
                                </div>
                                <div>
                                    <label>Gap</label>
                                    <select id="gap" onchange="renderPreview()">
                                        <option value="0">No Gap</option>
                                        <option value="2" selected>Small (2px)</option>
                                        <option value="4">Medium (4px)</option>
                                        <option value="8">Large (8px)</option>
                                    </select>
                                </div>
                                <div>
                                    <label>Barcode Type</label>
                                    <select id="barcodeType" onchange="renderPreview()">
                                        <option value="CODE128" selected>Code 128</option>
                                        <option value="CODE11">Code 11</option>
                                        <option value="ITF14">ITF-14</option>
                                        <option value="pharmacode">Pharmacode</option>
                                    </select>
                                </div>
                                <div style="margin-left:auto;display:flex;gap:8px;align-items:flex-end">
                                    <button class="btn" onclick="printPreview()">Preview Print</button>
                                    <button class="btn btn-p" onclick="printBarcodes()">Print</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="card" style="flex:1">
                        <div class="card-body" style="overflow:auto">
                            <div id="previewArea" style="text-align:center;color:#9ca3af;padding:40px 0;font-size:13px">
                                Add products to queue to preview barcodes
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="print-area" id="printArea"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script>
        var queue = [], queueId = 0, hlIdx = -1;
        
        var searchInput = document.getElementById('searchInput');
        var searchResults = document.getElementById('searchResults');
        
        searchInput.addEventListener('input', function() {
            if (this.value.length >= 1) doSearch();
            else closeSearch();
        });
        
        searchInput.addEventListener('keydown', function(e) {
            var items = searchResults.querySelectorAll('.search-item');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                hlIdx = Math.min(hlIdx + 1, items.length - 1);
                highlightItem(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                hlIdx = Math.max(hlIdx - 1, 0);
                highlightItem(items);
            } else if (e.key === 'Enter' && hlIdx >= 0 && hlIdx < items.length) {
                e.preventDefault();
                var item = items[hlIdx];
                addToQueue(item.dataset.vid, item.dataset.sku, item.dataset.name, item.dataset.variant);
            }
        });
        
        searchInput.addEventListener('blur', function() {
            setTimeout(closeSearch, 200);
        });
        
        function highlightItem(items) {
            items.forEach(function(el, i) { el.classList.toggle('hl', i === hlIdx); });
            if (items[hlIdx]) items[hlIdx].scrollIntoView({ block: 'nearest' });
        }
        
        function closeSearch() {
            searchResults.innerHTML = '';
            searchResults.classList.remove('show');
            hlIdx = -1;
        }
        
        function doSearch() {
            fetch('/api/products/search?q=' + encodeURIComponent(searchInput.value))
                .then(function(r) { return r.json(); })
                .then(function(d) { renderSearchResults(d); })
                .catch(function() { renderSearchResults([]); });
        }
        
        function renderSearchResults(list) {
            hlIdx = -1;
            if (!list.length) {
                searchResults.classList.remove('show');
                searchResults.innerHTML = '';
                return;
            }
            
            searchResults.classList.add('show');
            searchResults.innerHTML = list.map(function(p) {
                var variant = (p.size || '') + ' ' + (p.color || '');
                variant = variant.trim();
                return '<div class="search-item" data-vid="' + p.vid + '" data-sku="' + p.sku + '" ' +
                    'data-name="' + p.name + '" data-variant="' + variant + '">' +
                    '<div class="si-name">' + p.name + '</div>' +
                    '<div class="si-detail">' + (variant || 'Default variant') +
                    (p.stock ? ' · ' + p.stock + ' in stock' : '') + '</div>' +
                    '<div class="si-sku">' + p.sku + '</div>' +
                    '</div>';
            }).join('');
        }
        
        searchResults.addEventListener('click', function(e) {
            var item = e.target.closest('.search-item');
            if (!item) return;
            addToQueue(item.dataset.vid, item.dataset.sku, item.dataset.name, item.dataset.variant);
        });
        
        function addToQueue(vid, sku, name, variant) {
            var existing = queue.find(function(q) { return q.sku === sku; });
            if (existing) {
                existing.copies += parseInt(document.getElementById('copies').value) || 1;
            } else {
                queue.push({
                    id: queueId++,
                    vid: parseInt(vid),
                    sku: sku,
                    name: name,
                    variant: variant,
                    copies: parseInt(document.getElementById('copies').value) || 1
                });
            }
            closeSearch();
            searchInput.value = '';
            renderQueue();
            renderPreview();
        }
        
        function removeFromQueue(id) {
            queue = queue.filter(function(q) { return q.id !== id; });
            renderQueue();
            renderPreview();
        }
        
        function clearQueue() {
            if (queue.length && confirm('Clear all items from queue?')) {
                queue = [];
                renderQueue();
                renderPreview();
            }
        }
        
        function renderQueue() {
            var el = document.getElementById('queueList');
            if (!queue.length) {
                el.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:20px 0;font-size:12px">Search and add products</div>';
                return;
            }
            el.innerHTML = queue.map(function(q) {
                return '<div class="queue-item">' +
                    '<span class="qi-name">' + q.name + '</span>' +
                    '<span class="qi-sku">' + q.sku + '</span>' +
                    '<span class="qi-copies">x' + q.copies + '</span>' +
                    '<button class="qi-remove" onclick="removeFromQueue(' + q.id + ')">&times;</button>' +
                    '</div>';
            }).join('');
        }
        
        function prepareBarcodeData(sku, barcodeType) {
            var data = sku;
            var warning = null;
            
            if (barcodeType === 'CODE11') {
                data = sku.replace(/[^0-9-]/g, '');
                if (data !== sku) {
                    warning = 'Letters removed (CODE11: digits + hyphens only)';
                }
                if (!data) {
                    data = '0';
                    warning = 'No valid chars, using fallback';
                }
            } else if (barcodeType === 'ITF14') {
                data = sku.replace(/[^0-9]/g, '');
                if (data.length === 13) {
                    var check = calculateITF14CheckDigit(data);
                    data = data + check;
                    warning = 'Check digit added';
                } else if (data.length < 13) {
                    data = data.padStart(13, '0');
                    var check = calculateITF14CheckDigit(data);
                    data = data + check;
                    warning = 'Padded to 14 digits';
                } else if (data.length > 14) {
                    data = data.substring(0, 14);
                    warning = 'Truncated to 14 digits';
                }
                if (data.length !== 14) {
                    data = '00000000000000';
                    warning = 'Invalid length, using fallback';
                }
            } else if (barcodeType === 'pharmacode') {
                var num = parseInt(sku.replace(/[^0-9]/g, '')) || 1;
                if (num < 3) num = 3;
                if (num > 131070) num = 131070;
                data = num.toString();
                if (data !== sku) {
                    warning = 'Converted to number (3-131070)';
                }
            }
            
            return { data: data, warning: warning };
        }
        
        function calculateITF14CheckDigit(data) {
            var sum = 0;
            for (var i = 0; i < 13; i++) {
                var digit = parseInt(data[i]);
                sum += (i % 2 === 0) ? digit * 3 : digit;
            }
            var check = (10 - (sum % 10)) % 10;
            return check.toString();
        }
        
        function renderPreview() {
            var area = document.getElementById('previewArea');
            if (!queue.length) {
                area.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:40px 0;font-size:13px">Add products to queue to preview barcodes</div>';
                return;
            }
            
            var barcodeType = document.getElementById('barcodeType').value;
            var orientation = document.getElementById('orientation').value;
            var gap = document.getElementById('gap').value;
            
            // Set dimensions based on orientation
            var labelWidth = orientation === 'landscape' ? 144 : 96;
            var labelHeight = orientation === 'landscape' ? 96 : 144;
            var barcodeHeight = orientation === 'landscape' ? 38 : 57;
            
            // Preview shows a simple grid of labels
            var html = '<div class="preview-grid" style="grid-template-columns:repeat(auto-fill, ' + labelWidth + 'px);gap:' + gap + 'px">';
            
            queue.forEach(function(q) {
                var prepared = prepareBarcodeData(q.sku, barcodeType);
                for (var c = 0; c < q.copies; c++) {
                    var rotateStyle = orientation === 'portrait' ? 'transform:rotate(90deg);' : '';
                    html += '<div class="preview-label" style="width:' + labelWidth + 'px;height:' + labelHeight + 'px;' + rotateStyle + '">';
                    html += '<svg id="pv-' + q.id + '-' + c + '"></svg>';
                    html += '<div class="pl-sku">' + q.sku + '</div>';
                    if (prepared.warning) {
                        html += '<div class="pl-warn">' + prepared.warning + '</div>';
                    }
                    html += '<div class="pl-name">' + q.name + '</div>';
                    html += '</div>';
                }
            });
            
            html += '</div>';
            area.innerHTML = html;
            
            setTimeout(function() {
                queue.forEach(function(q) {
                    var prepared = prepareBarcodeData(q.sku, barcodeType);
                    for (var c = 0; c < q.copies; c++) {
                        try {
                            JsBarcode('#pv-' + q.id + '-' + c, prepared.data, {
                                format: barcodeType,
                                width: 2,
                                height: barcodeHeight,
                                fontSize: 8,
                                margin: 2,
                                textMargin: 1,
                                displayValue: false
                            });
                        } catch (e) {
                            console.error('Preview error for', q.sku, e);
                            var svg = document.getElementById('pv-' + q.id + '-' + c);
                            if (svg) {
                                svg.innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="#dc2626" font-size="12">Error</text>';
                            }
                        }
                    }
                });
            }, 100);
        }
        
        function printPreview() {
            if (!queue.length) {
                alert('No items in queue');
                return;
            }
            renderPreview();
            setTimeout(function() {
                window.print();
            }, 200);
        }
        
        function printBarcodes() {
            if (!queue.length) {
                alert('No items in queue');
                return;
            }
            
            var barcodeType = document.getElementById('barcodeType').value;
            var orientation = document.getElementById('orientation').value;
            var gap = document.getElementById('gap').value;
            
            var pa = document.getElementById('printArea');
            pa.innerHTML = '';
            
            var allLabels = [];
            queue.forEach(function(q) {
                for (var c = 0; c < q.copies; c++) {
                    allLabels.push({ sku: q.sku, name: q.name, id: q.id });
                }
            });
            
            // Set dimensions based on orientation
            var labelWidth = orientation === 'landscape' ? '1.5in' : '1in';
            var labelHeight = orientation === 'landscape' ? '1in' : '1.5in';
            var barcodeHeight = orientation === 'landscape' ? 38 : 57;
            
            // Create a single page div with CSS grid that auto-fills
            var pageDiv = document.createElement('div');
            pageDiv.className = 'print-page';
            pageDiv.style.gridTemplateColumns = 'repeat(auto-fill, ' + labelWidth + ')';
            pageDiv.style.gridAutoRows = labelHeight;
            pageDiv.style.gap = gap + 'px';
            
            allLabels.forEach(function(label, i) {
                var div = document.createElement('div');
                div.className = 'print-label';
                div.style.width = labelWidth;
                div.style.height = labelHeight;
                if (orientation === 'portrait') {
                    div.style.transform = 'rotate(90deg)';
                }
                
                var svgId = 'pl-' + i;
                var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                svg.setAttribute('id', svgId);
                div.appendChild(svg);
                
                var skuDiv = document.createElement('div');
                skuDiv.className = 'pl-sku';
                skuDiv.textContent = label.sku;
                div.appendChild(skuDiv);
                
                var nameDiv = document.createElement('div');
                nameDiv.className = 'pl-name';
                nameDiv.textContent = label.name;
                div.appendChild(nameDiv);
                
                pageDiv.appendChild(div);
            });
            
            pa.appendChild(pageDiv);
            
            setTimeout(function() {
                allLabels.forEach(function(label, i) {
                    var svgId = 'pl-' + i;
                    var prepared = prepareBarcodeData(label.sku, barcodeType);
                    
                    try {
                        JsBarcode('#' + svgId, prepared.data, {
                            format: barcodeType,
                            width: 2,
                            height: barcodeHeight,
                            fontSize: 8,
                            margin: 2,
                            textMargin: 1,
                            displayValue: false
                        });
                    } catch (e) {
                        console.error('Print error for', label.sku, e);
                    }
                });
                
                setTimeout(function() {
                    window.print();
                }, 200);
            }, 200);
        }
    </script>
</body>
</html>
