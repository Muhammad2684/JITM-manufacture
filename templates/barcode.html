<!DOCTYPE html>
<html>
<head>
    <title>JITM · Barcode Generator</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .bc-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            gap: 16px;
            min-height: calc(100vh - 140px);
            max-width: 100%;
            overflow: hidden;
        }
        .bc-left {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }
        .bc-right {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
            overflow: hidden;
        }
        .bc-search { position: relative; }
        .bc-results {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #fff;
            border: 1px solid #e2e1de;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
            z-index: 50;
            display: none;
        }
        .bc-results.show { display: block; }
        .bc-result-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid #f3f2ef;
        }
        .bc-result-item:last-child { border-bottom: none; }
        .bc-result-item:hover, .bc-result-item.hl { background: #f0effc; }
        .bc-result-item .br-name {
            font-size: 13px;
            font-weight: 600;
            color: #1a1c2e;
        }
        .bc-result-item .br-detail {
            font-size: 11px;
            color: #6b7280;
        }
        .bc-result-item .br-sku {
            font-size: 11px;
            color: #3b4fe2;
            font-weight: 600;
        }
        .queue-list { max-height: 400px; overflow-y: auto; }
        .queue-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 10px;
            border-bottom: 1px solid #f3f2ef;
            font-size: 12px;
        }
        .queue-item:last-child { border-bottom: none; }
        .queue-item .qi-name { flex: 1; font-weight: 600; }
        .queue-item .qi-sku { color: #3b4fe2; font-family: monospace; }
        .queue-item .qi-copies { color: #6b7280; min-width: 40px; text-align: center; }
        .queue-item .qi-remove {
            color: #dc2626;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 6px;
        }
        .queue-item .qi-remove:hover { background: #fef2f2; border-radius: 4px; }
        .bc-preview {
            display: grid;
            gap: 6px;
            padding: 12px;
            justify-content: center;
            max-width: 100%;
            overflow-x: auto;
        }
        .bc-preview-item {
            border: 1px solid #e2e1de;
            border-radius: 4px;
            padding: 6px;
            text-align: center;
            background: #fff;
            min-width: 0;
        }
        .bc-preview-item svg { display: block; margin: 0 auto; }
        .bc-preview-item .bp-sku {
            font-size: 10px;
            font-weight: 700;
            font-family: monospace;
            margin-top: 2px;
        }
        .bc-preview-item .bp-name {
            font-size: 8px;
            color: #6b7280;
            margin-top: 1px;
        }
        .bc-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .bc-controls label { font-size: 12px; color: #6b7280; }
        .bc-controls input[type=number] {
            width: 60px;
            padding: 6px 8px;
            border: 1px solid #e2e1de;
            border-radius: 4px;
            font-size: 13px;
        }
        .bc-controls select {
            padding: 6px 8px;
            border: 1px solid #e2e1de;
            border-radius: 4px;
            font-size: 13px;
        }
        .print-area { display: none; }
        
        @media print {
            @page {
                size: auto;
                margin: 10mm;
            }
            
            body * { 
                visibility: hidden !important;
                display: none !important;
            }
            
            .print-area {
                display: block !important;
                visibility: visible !important;
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
            }
            
            .print-area * {
                visibility: visible !important;
                display: block !important;
            }
            
            .print-grid {
                display: grid !important;
                gap: 8px !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            
            .print-label {
                border: 1px dashed #ccc !important;
                padding: 8px !important;
                text-align: center !important;
                page-break-inside: avoid !important;
                display: inline-block !important;
            }
            
            .print-label svg { 
                display: block !important; 
                margin: 0 auto !important;
                max-width: 100% !important;
                height: auto !important;
            }
            
            .print-label .pl-sku {
                font-size: 10px !important;
                font-weight: 700 !important;
                font-family: monospace !important;
                margin-top: 4px !important;
                display: block !important;
            }
            
            .print-label .pl-name {
                font-size: 8px !important;
                color: #333 !important;
                margin-top: 2px !important;
                display: block !important;
            }
        }
    </style>
</head>
<body>
    {{sidebar|safe}}
    <div class="main">
        <div class="topbar">
            <h2>Barcode Generator</h2>
            <div class="actions">
                <span class="text-muted">{{name}}</span>
            </div>
        </div>
        <div class="content" style="overflow-x: hidden; max-width: 100%;">
            <div class="bc-layout">
                <div class="bc-left">
                    <div class="card">
                        <div class="card-body">
                            <div class="bc-search">
                                <input id="bs" placeholder="Search product name or SKU..." autofocus 
                                    style="width:100%;padding:8px 12px;border:1px solid #e2e1de;border-radius:6px;font-size:13px">
                                <div class="bc-results" id="br"></div>
                            </div>
                        </div>
                    </div>
                    <div class="card" style="flex:1">
                        <div class="card-body">
                            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                                <h3 style="margin:0;font-size:14px;">Barcode Queue</h3>
                                <button class="btn btn-ghost btn-sm" onclick="clearQueue()" style="font-size:11px;">Clear All</button>
                            </div>
                            <div class="queue-list" id="queueList">
                                <div style="text-align:center;color:#9ca3af;padding:20px 0;font-size:12px;">
                                    Search and add products to queue
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bc-right">
                    <div class="card">
                        <div class="card-body">
                            <div class="bc-controls">
                                <div>
                                    <label>Copies per item:</label>
                                    <input type="number" id="copies" value="1" min="1" max="100" onchange="renderPreview()">
                                </div>
                                <div>
                                    <label>Columns:</label>
                                    <input type="number" id="cols" value="4" min="1" max="10" onchange="renderPreview()">
                                </div>
                                <div>
                                    <label>Rows:</label>
                                    <input type="number" id="rows" value="3" min="1" max="20" onchange="renderPreview()">
                                </div>
                                <div>
                                    <label>Label Size:</label>
                                    <select id="labelSize" onchange="renderPreview()">
                                        <option value="small">Small (200x80)</option>
                                        <option value="medium" selected>Medium (300x120)</option>
                                        <option value="large">Large (400x160)</option>
                                    </select>
                                </div>
                                <div>
                                    <label>Barcode Type:</label>
                                    <select id="barcodeType" onchange="renderPreview()">
                                        <option value="CODE128" selected>Code 128</option>
                                        <option value="CODE11">Code 11</option>
                                        <option value="ITF">Code 2 of 5 Interleaved</option>
                                    </select>
                                </div>
                                <button class="btn" onclick="printPreview()" style="margin-left:auto;">Preview Print</button>
                                <button class="btn btn-p" onclick="printBarcodes()">Print All</button>
                            </div>
                        </div>
                    </div>
                    <div class="card" style="flex:1; overflow: hidden;">
                        <div class="card-body" style="overflow: auto;">
                            <div id="previewArea" style="text-align:center;color:#9ca3af;padding:40px 0;font-size:13px;">
                                Add products to queue to preview barcodes
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="print-area" id="printArea"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
    <script>
        var allP = [], hlIdx = -1, queue = [], queueId = 0;
        var labelSizes = {
            small: { w: 200, h: 80, fs: 10 },
            medium: { w: 300, h: 120, fs: 12 },
            large: { w: 400, h: 160, fs: 14 }
        };
        
        document.getElementById('bs').addEventListener('input', function(e) {
            if (e.target.value.length >= 1) search();
            else closeResults();
        });
        
        document.getElementById('bs').addEventListener('keydown', function(e) {
            var items = document.querySelectorAll('.bc-result-item');
            if (e.key === 'ArrowDown') {
                e.preventDefault();
                hlIdx = Math.min(hlIdx + 1, items.length - 1);
                highlight(items);
            } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                hlIdx = Math.max(hlIdx - 1, 0);
                highlight(items);
            } else if (e.key === 'Enter' && hlIdx >= 0 && hlIdx < items.length) {
                var it = items[hlIdx];
                addToQueue(parseInt(it.dataset.vid), it.dataset.sku, it.dataset.name, it.dataset.variant);
            }
        });
        
        document.getElementById('bs').addEventListener('blur', function() {
            setTimeout(closeResults, 200);
        });
        
        function highlight(items) {
            items.forEach(function(el, i) { el.classList.toggle('hl', i === hlIdx); });
            var h = items[hlIdx];
            if (h) h.scrollIntoView({ block: 'nearest' });
        }
        
        function closeResults() {
            var r = document.getElementById('br');
            r.innerHTML = '';
            r.classList.remove('show');
            hlIdx = -1;
        }
        
        function search() {
            fetch('/api/products/search?q=' + encodeURIComponent(document.getElementById('bs').value))
                .then(function(r) { return r.json(); })
                .then(function(d) { allP = d; renderResults(d); })
                .catch(function() { allP = []; });
        }
        
        function renderResults(l) {
            var r = document.getElementById('br');
            hlIdx = -1;
            if (!l.length) { r.classList.remove('show'); r.innerHTML = ''; return; }
            
            r.classList.add('show');
            r.innerHTML = l.map(function(p, i) {
                return '<div class="bc-result-item" data-vid="' + p.vid + '" data-sku="' + p.sku + '" ' +
                    'data-name="' + p.name + '" data-variant="' + ((p.size || '') + ' ' + (p.color || '')).trim() + '">' +
                    '<div class="br-name">' + p.name + '</div>' +
                    '<div class="br-detail">' + ((p.size || '') + ' ' + (p.color || '')).trim() + 
                    (p.stock ? ' &middot; ' + p.stock + ' in stock' : '') + '</div>' +
                    '<div class="br-sku">' + p.sku + '</div>' +
                    '</div>';
            }).join('');
        }
        
        document.getElementById('br').addEventListener('click', function(e) {
            var item = e.target.closest('.bc-result-item');
            if (!item) return;
            addToQueue(parseInt(item.dataset.vid), item.dataset.sku, item.dataset.name, item.dataset.variant);
        });
        
        function addToQueue(vid, sku, name, variant) {
            var existing = queue.find(function(q) { return q.sku === sku; });
            if (existing) {
                existing.copies += parseInt(document.getElementById('copies').value) || 1;
            } else {
                queue.push({
                    id: queueId++,
                    vid: vid,
                    sku: sku,
                    name: name,
                    variant: variant,
                    copies: parseInt(document.getElementById('copies').value) || 1
                });
            }
            closeResults();
            document.getElementById('bs').value = '';
            renderQueue();
            renderPreview();
        }
        
        function removeFromQueue(id) {
            queue = queue.filter(function(q) { return q.id !== id; });
            renderQueue();
            renderPreview();
        }
        
        function clearQueue() {
            if (queue.length && confirm('Clear all items from queue?')) {
                queue = [];
                renderQueue();
                renderPreview();
            }
        }
        
        function renderQueue() {
            var el = document.getElementById('queueList');
            if (!queue.length) {
                el.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:20px 0;font-size:12px;">Search and add products to queue</div>';
                return;
            }
            el.innerHTML = queue.map(function(q) {
                return '<div class="queue-item">' +
                    '<span class="qi-name">' + q.name + '</span>' +
                    '<span class="qi-sku">' + q.sku + '</span>' +
                    '<span class="qi-copies">x' + q.copies + '</span>' +
                    '<span class="qi-remove" onclick="removeFromQueue(' + q.id + ')">&times;</span>' +
                    '</div>';
            }).join('');
        }
        
        function renderPreview() {
            var area = document.getElementById('previewArea');
            if (!queue.length) {
                area.innerHTML = '<div style="text-align:center;color:#9ca3af;padding:40px 0;font-size:13px;">Add products to queue to preview barcodes</div>';
                return;
            }
            var sz = labelSizes[document.getElementById('labelSize').value];
            var cols = parseInt(document.getElementById('cols').value) || 4;
            var barcodeHeight = Math.round(sz.h * 0.5);
            
            var html = '<div class="bc-preview" style="grid-template-columns:repeat(' + cols + ',' + sz.w + 'px);">';
            
            queue.forEach(function(q) {
                html += '<div class="bc-preview-item" style="width:' + sz.w + 'px;min-height:' + sz.h + 'px;">';
                html += '<svg id="pv-' + q.id + '"></svg>';
                html += '<div class="bp-sku">' + q.sku + '</div>';
                html += '<div class="bp-name">' + q.name + '</div>';
                html += '</div>';
            });
            
            html += '</div>';
            area.innerHTML = html;
            
            setTimeout(function() {
                var barcodeType = document.getElementById('barcodeType').value;
                queue.forEach(function(q) {
                    try {
                        JsBarcode('#pv-' + q.id, q.sku, {
                            format: barcodeType,
                            width: 2,
                            height: barcodeHeight,
                            fontSize: sz.fs,
                            margin: 8,
                            textMargin: 4,
                            displayValue: true
                        });
                    } catch (e) {
                        console.error('Barcode error for ' + q.sku, e);
                        document.getElementById('pv-' + q.id).innerHTML = '<text x="50%" y="50%" text-anchor="middle" fill="red">Error</text>';
                    }
                });
            }, 150);
        }
        
        function printPreview() {
            if (!queue.length) {
                alert('No items in queue to preview');
                return;
            }
            
            // Temporarily show print area for preview
            var pa = document.getElementById('printArea');
            var originalDisplay = pa.style.display;
            
            // Generate print content
            var sz = labelSizes[document.getElementById('labelSize').value];
            var cols = parseInt(document.getElementById('cols').value) || 4;
            var rows = parseInt(document.getElementById('rows').value) || 3;
            var barcodeType = document.getElementById('barcodeType').value;
            var barcodeHeight = Math.round(sz.h * 0.5);
            
            pa.innerHTML = '<div class="print-grid" style="grid-template-columns:repeat(' + cols + ',' + sz.w + 'px);display:grid;gap:8px;padding:20px;"></div>';
            var grid = pa.querySelector('.print-grid');
            var maxLabels = cols * rows;
            var labelCount = 0;
            var svgIds = [];
            
            queue.forEach(function(q) {
                for (var c = 0; c < q.copies && labelCount < maxLabels; c++) {
                    var div = document.createElement('div');
                    div.className = 'print-label';
                    div.style.width = sz.w + 'px';
                    div.style.height = sz.h + 'px';
                    div.style.display = 'inline-block';
                    div.style.border = '1px dashed #ccc';
                    div.style.padding = '8px';
                    div.style.textAlign = 'center';
                    
                    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    var svgId = 'preview-' + q.id + '-' + c;
                    svg.setAttribute('id', svgId);
                    div.appendChild(svg);
                    svgIds.push(svgId);
                    
                    var skuDiv = document.createElement('div');
                    skuDiv.style.fontSize = '10px';
                    skuDiv.style.fontWeight = '700';
                    skuDiv.style.fontFamily = 'monospace';
                    skuDiv.style.marginTop = '4px';
                    skuDiv.textContent = q.sku;
                    div.appendChild(skuDiv);
                    
                    var nameDiv = document.createElement('div');
                    nameDiv.style.fontSize = '8px';
                    nameDiv.style.color = '#333';
                    nameDiv.style.marginTop = '2px';
                    nameDiv.textContent = q.name;
                    div.appendChild(nameDiv);
                    
                    grid.appendChild(div);
                    labelCount++;
                }
            });
            
            // Render barcodes
            svgIds.forEach(function(svgId) {
                var parts = svgId.split('-');
                var qId = parseInt(parts[1]);
                var queueItem = queue.find(function(q) { return q.id === qId; });
                
                if (queueItem) {
                    try {
                        JsBarcode('#' + svgId, queueItem.sku, {
                            format: barcodeType,
                            width: 2,
                            height: barcodeHeight,
                            fontSize: sz.fs,
                            margin: 8,
                            textMargin: 4,
                            displayValue: false
                        });
                    } catch (e) {
                        console.error('Preview barcode error', e);
                    }
                }
            });
            
            // Show preview in a modal-like overlay
            pa.style.position = 'fixed';
            pa.style.top = '0';
            pa.style.left = '0';
            pa.style.width = '100%';
            pa.style.height = '100%';
            pa.style.backgroundColor = 'white';
            pa.style.zIndex = '9999';
            pa.style.overflow = 'auto';
            pa.style.padding = '20px';
            
            // Add close button
            var closeBtn = document.createElement('button');
            closeBtn.textContent = 'Close Preview';
            closeBtn.className = 'btn btn-p';
            closeBtn.style.position = 'fixed';
            closeBtn.style.top = '20px';
            closeBtn.style.right = '20px';
            closeBtn.style.zIndex = '10000';
            closeBtn.onclick = function() {
                pa.style.display = 'none';
                pa.innerHTML = '';
                pa.style.position = '';
                pa.style.top = '';
                pa.style.left = '';
                pa.style.width = '';
                pa.style.height = '';
                pa.style.backgroundColor = '';
                pa.style.zIndex = '';
                pa.style.overflow = '';
                pa.style.padding = '';
            };
            pa.appendChild(closeBtn);
            
            pa.style.display = 'block';
        }
        
        function printBarcodes() {
            if (!queue.length) {
                alert('No items in queue to print');
                return;
            }
            
            var sz = labelSizes[document.getElementById('labelSize').value];
            var cols = parseInt(document.getElementById('cols').value) || 4;
            var rows = parseInt(document.getElementById('rows').value) || 3;
            var pa = document.getElementById('printArea');
            var barcodeType = document.getElementById('barcodeType').value;
            var barcodeHeight = Math.round(sz.h * 0.5);
            
            pa.innerHTML = '<div class="print-grid" style="grid-template-columns:repeat(' + cols + ',' + sz.w + 'px);"></div>';
            var grid = pa.querySelector('.print-grid');
            var maxLabels = cols * rows;
            var labelCount = 0;
            var svgIds = [];
            
            queue.forEach(function(q) {
                for (var c = 0; c < q.copies && labelCount < maxLabels; c++) {
                    var div = document.createElement('div');
                    div.className = 'print-label';
                    div.style.width = sz.w + 'px';
                    div.style.height = sz.h + 'px';
                    
                    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
                    var svgId = 'pl-' + q.id + '-' + c;
                    svg.setAttribute('id', svgId);
                    div.appendChild(svg);
                    svgIds.push(svgId);
                    
                    var skuDiv = document.createElement('div');
                    skuDiv.className = 'pl-sku';
                    skuDiv.textContent = q.sku;
                    div.appendChild(skuDiv);
                    
                    var nameDiv = document.createElement('div');
                    nameDiv.className = 'pl-name';
                    nameDiv.textContent = q.name;
                    div.appendChild(nameDiv);
                    
                    grid.appendChild(div);
                    labelCount++;
                }
            });
            
            // Render all barcodes
            var renderCount = 0;
            var totalSvgs = svgIds.length;
            
            svgIds.forEach(function(svgId, index) {
                var queueItem = null;
                var parts = svgId.split('-');
                var qId = parseInt(parts[1]);
                queueItem = queue.find(function(q) { return q.id === qId; });
                
                if (queueItem) {
                    try {
                        JsBarcode('#' + svgId, queueItem.sku, {
                            format: barcodeType,
                            width: 2,
                            height: barcodeHeight,
                            fontSize: sz.fs,
                            margin: 8,
                            textMargin: 4,
                            displayValue: false
                        });
                        renderCount++;
                    } catch (e) {
                        console.error('Print barcode error for ' + queueItem.sku, e);
                    }
                }
            });
            
            // Wait for rendering to complete before printing
            setTimeout(function() {
                if (renderCount > 0) {
                    window.print();
                } else {
                    alert('Failed to render barcodes. Please try again.');
                }
            }, 300);
        }
    </script>
</body>
</html>
