<!DOCTYPE html>
<html><head><title>JITM · Billing</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"></head><body>
{{sidebar|safe}}
<div class="main">
    <div class="topbar"><h2>Billing</h2><div class="actions"><span class="text-muted">{{name}}</span></div></div>
    <div class="content">
        <div class="search"><input id="s" placeholder="Search receipt or customer..." oninput="load()"></div>
        <div class="table-wrap"><table><thead><tr><th onclick="sortCol(0)" style="cursor:pointer;user-select:none">Receipt <span id="si0"></span></th><th onclick="sortCol(1)" style="cursor:pointer;user-select:none">Date <span id="si1"></span></th><th onclick="sortCol(2)" style="cursor:pointer;user-select:none">Customer <span id="si2"></span></th><th onclick="sortCol(3)" class="text-right" style="cursor:pointer;user-select:none">Items <span id="si3"></span></th><th onclick="sortCol(4)" class="text-right" style="cursor:pointer;user-select:none">Total <span id="si4"></span></th><th onclick="sortCol(5)" style="cursor:pointer;user-select:none">Payment <span id="si5"></span></th><th onclick="sortCol(6)" style="cursor:pointer;user-select:none">Staff <span id="si6"></span></th><th onclick="sortCol(7)" style="cursor:pointer;user-select:none">Status <span id="si7"></span></th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
    </div>
</div>
<div class="modal" id="dm"><div class="mc" style="max-width:520px"><button class="mx" onclick="cl('dm')">&times;</button><div id="dc"></div></div></div>
<script>
var allSales = [], sortIdx = -1, sortDir = 1;
function load(){fetch('/api/sales?q='+encodeURIComponent(document.getElementById('s').value)).then(r=>r.json()).then(d=>{allSales=d;render(d);});}
function render(l){document.getElementById('tb').innerHTML=l.map(s=>'<tr><td style="font-weight:600">'+s.receipt+'</td><td>'+(s.created_at||'').slice(0,16)+'</td><td>'+(s.customer_name||'-')+'</td><td class="text-right">'+(s.items?s.items.length:0)+'</td><td class="text-right fw-600">Rs '+s.total.toFixed(2)+'</td><td>'+s.payment+'</td><td>'+s.staff_name+'</td><td><span class="bdg bdg-'+(s.status==='completed'?'ok':s.status==='returned'?'err':'warn')+'">'+s.status+'</span></td><td><button class="btn btn-xs btn-ghost" onclick="detail('+s.id+')">View</button></td></tr>').join('');}
function sortCol(i){if(sortIdx===i){sortDir*=-1;}else{sortIdx=i;sortDir=1;}for(let j=0;j<8;j++)document.getElementById('si'+j).textContent='';document.getElementById('si'+i).textContent=sortDir===1?' \u25B2':' \u25BC';const vals=[s=>(s.receipt||'').toLowerCase(),s=>(s.created_at||''),s=>(s.customer_name||'').toLowerCase(),s=>(s.items?s.items.length:0),s=>s.total||0,s=>(s.payment||'').toLowerCase(),s=>(s.staff_name||'').toLowerCase(),s=>(s.status||'').toLowerCase()];allSales.sort((a,b)=>{const va=vals[i](a),vb=vals[i](b);return va<vb?-sortDir:va>vb?sortDir:0;});render(allSales);}
function detail(id){fetch('/api/sales/'+id).then(r=>r.json()).then(s=>{let h='<div class="rec"><div class="rh"><h3>JITM Baby Garments</h3><p>'+s.receipt+'</p><p>'+(s.created_at||'')+'</p></div><div class="ri">';
(s.items||[]).forEach(i=>{h+='<div class="rl"><span>'+i.quantity+'x '+i.product_name+(i.variant_label?' ('+i.variant_label+')':'')+'</span><span>Rs '+i.total.toFixed(2)+'</span></div>';});
h+='</div><div class="rl"><span>Subtotal</span><span>Rs '+s.subtotal.toFixed(2)+'</span></div>';if(s.discount>0)h+='<div class="rl"><span>Discount</span><span>-Rs '+s.discount.toFixed(2)+'</span></div>';
h+='<div class="rl"><span>Tax (8%)</span><span>Rs '+s.tax.toFixed(2)+'</span></div><div class="rl" style="font-weight:700;font-size:15px"><span>TOTAL</span><span>Rs '+s.total.toFixed(2)+'</span></div>'+
'<div class="rl"><span>Payment</span><span>'+s.payment+'</span></div>'+(s.customer_name?'<div class="rl"><span>Customer</span><span>'+s.customer_name+'</span></div>':'')+
'<div class="rl"><span>Staff</span><span>'+s.staff_name+'</span></div><div class="rl"><span>Status</span><span class="bdg bdg-'+(s.status==='completed'?'ok':'err')+'">'+s.status+'</span></div></div>';
document.getElementById('dc').innerHTML=h;document.getElementById('dm').classList.add('show');});}
function cl(id){document.getElementById(id).classList.remove('show');}
window.onclick=function(e){document.querySelectorAll('.modal').forEach(m=>{if(e.target===m)m.classList.remove('show');});};
load();
</script></body></html>
