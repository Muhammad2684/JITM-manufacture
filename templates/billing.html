<!DOCTYPE html>
<html><head><title>JITM · Billing</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"></head><body>
{{sidebar|safe}}
<div class="main">
    <div class="topbar"><h2>Billing</h2><div class="actions"><span class="text-muted">{{name}}</span></div></div>
    <div class="content">
        <div class="search"><input id="s" placeholder="Search receipt or customer..." oninput="load()"></div>
        <div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Date</th><th>Customer</th><th class="text-right">Items</th><th class="text-right">Total</th><th>Payment</th><th>Staff</th><th>Status</th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
    </div>
</div>
<div class="modal" id="dm"><div class="mc" style="max-width:520px"><button class="mx" onclick="cl('dm')">&times;</button><div id="dc"></div></div></div>
<script>
load();
function load(){fetch('/api/sales?q='+encodeURIComponent(document.getElementById('s').value)).then(r=>r.json()).then(d=>render(d));}
function render(l){document.getElementById('tb').innerHTML=l.map(s=>'<tr><td style="font-weight:600">'+s.receipt+'</td><td>'+(s.created_at||'').slice(0,16)+'</td><td>'+(s.customer_name||'-')+'</td><td class="text-right">'+(s.items?s.items.length:0)+'</td><td class="text-right fw-600">$'+s.total.toFixed(2)+'</td><td>'+s.payment+'</td><td>'+s.staff_name+'</td><td><span class="bdg bdg-'+(s.status==='completed'?'ok':s.status==='returned'?'err':'warn')+'">'+s.status+'</span></td><td><button class="btn btn-xs btn-ghost" onclick="detail('+s.id+')">View</button></td></tr>').join('');}
function detail(id){fetch('/api/sales/'+id).then(r=>r.json()).then(s=>{let h='<div class="rec"><div class="rh"><h3>JITM Baby Garments</h3><p>'+s.receipt+'</p><p>'+(s.created_at||'')+'</p></div><div class="ri">';
(s.items||[]).forEach(i=>{h+='<div class="rl"><span>'+i.quantity+'x '+i.product_name+(i.variant_label?' ('+i.variant_label+')':'')+'</span><span>$'+i.total.toFixed(2)+'</span></div>';});
h+='</div><div class="rl"><span>Subtotal</span><span>$'+s.subtotal.toFixed(2)+'</span></div>';if(s.discount>0)h+='<div class="rl"><span>Discount</span><span>-$'+s.discount.toFixed(2)+'</span></div>';
h+='<div class="rl"><span>Tax (8%)</span><span>$'+s.tax.toFixed(2)+'</span></div><div class="rl" style="font-weight:700;font-size:15px"><span>TOTAL</span><span>$'+s.total.toFixed(2)+'</span></div>'+
'<div class="rl"><span>Payment</span><span>'+s.payment+'</span></div>'+(s.customer_name?'<div class="rl"><span>Customer</span><span>'+s.customer_name+'</span></div>':'')+
'<div class="rl"><span>Staff</span><span>'+s.staff_name+'</span></div><div class="rl"><span>Status</span><span class="bdg bdg-'+(s.status==='completed'?'ok':'err')+'">'+s.status+'</span></div></div>';
document.getElementById('dc').innerHTML=h;document.getElementById('dm').classList.add('show');});}
function cl(id){document.getElementById(id).classList.remove('show');}
window.onclick=function(e){document.querySelectorAll('.modal').forEach(m=>{if(e.target===m)m.classList.remove('show');});};
</script></body></html>
