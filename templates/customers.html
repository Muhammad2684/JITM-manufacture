<!DOCTYPE html>
<html><head><title>JITM · Customers</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"></head><body>
{{sidebar|safe}}
<div class="main">
    <div class="topbar"><h2>Customers</h2><div class="actions"><button class="btn btn-p btn-sm" onclick="showAdd()">+ New Customer</button><span class="text-muted">{{name}}</span></div></div>
    <div class="content">
        <div class="search"><input id="s" placeholder="Search name or phone..." oninput="load()"></div>
        <div class="cg" id="grid"></div>
    </div>
</div>
<div class="modal" id="fm"><div class="mc"><button class="mx" onclick="cl('fm')">&times;</button><h2 id="ft">Customer</h2>
<form onsubmit="save(event)"><label>Name</label><input id="cn" required><div class="form-row"><div><label>Phone</label><input id="cp"></div><div><label>Email</label><input id="ce" type="email"></div></div>
<div class="form-row"><div><label>Address</label><input id="ca"></div><div><label>Store Credit (Rs)</label><input id="cc" type="number" step="0.01" value="0"></div></div>
<div class="form-row"><div><label>Baby's Name</label><input id="cbn"></div><div><label>Birth Month</label><input id="cbm" type="month"></div></div>
<label>Notes</label><textarea id="cno" rows="2"></textarea><button class="btn btn-p" type="submit">Save</button></form></div></div>
<div class="modal" id="dmm"><div class="mc" style="max-width:640px"><button class="mx" onclick="cl('dmm')">&times;</button><div id="dc"></div></div></div>
<script>
var editing=null,custs=[];
load();
function load(){const q=document.getElementById('s').value;fetch('/api/customers?q='+encodeURIComponent(q)).then(r=>r.json()).then(d=>{custs=d;render(d);});}
function render(l){document.getElementById('grid').innerHTML=l.length?l.map(c=>'<div class="cc" onclick="detail('+c.id+')"><h3>'+c.name+'</h3><div class="cm">'+(c.phone||'')+(c.email?' | '+c.email:'')+'</div>'+
(c.baby_name||c.baby_birth?'<div class="cb">'+(c.baby_name?'Baby: '+c.baby_name:'')+(c.baby_birth?' | '+c.baby_birth:'')+'</div>':'')+
'<div class="cs"><span>Credit: <strong>Rs '+c.credit.toFixed(2)+'</strong></span><span>Spent: Rs '+c.total_spent.toFixed(2)+'</span><span>Visits: '+c.visit_count+'</span></div></div>').join(''):'<div class="empty">No customers</div>';}
function showAdd(){editing=null;document.getElementById('ft').textContent='New Customer';document.getElementById('cn').value='';document.getElementById('cp').value='';document.getElementById('ce').value='';document.getElementById('ca').value='';document.getElementById('cc').value='0';document.getElementById('cbn').value='';document.getElementById('cbm').value='';document.getElementById('cno').value='';document.getElementById('fm').classList.add('show');}
function save(e){e.preventDefault();const data={name:document.getElementById('cn').value,phone:document.getElementById('cp').value,email:document.getElementById('ce').value,address:document.getElementById('ca').value,baby_name:document.getElementById('cbn').value,baby_birth:document.getElementById('cbm').value,notes:document.getElementById('cno').value,credit:document.getElementById('cc').value};
fetch(editing?'/api/customers/'+editing:'/api/customers',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(r=>r.json()).then(()=>{cl('fm');load();});}
function detail(id){const c=custs.find(x=>x.id===id);if(!c)return;fetch('/api/customers/'+id+'/history').then(r=>r.json()).then(h=>{
let sh='',kh='';if(h.sales&&h.sales.length)sh='<table><tr><th>Receipt</th><th>Date</th><th class="text-right">Total</th><th>Status</th></tr>'+h.sales.map(s=>'<tr><td>'+s.receipt+'</td><td>'+(s.created_at||'').slice(0,10)+'</td><td class="text-right">Rs '+s.total.toFixed(2)+'</td><td><span class="bdg bdg-'+(s.status==='completed'?'ok':'err')+'">'+s.status+'</span></td></tr>').join('')+'</table>';
else sh='<p class="text-muted" style="font-size:13px">No sales</p>';
if(h.khata&&h.khata.length)kh='<table><tr><th>Date</th><th>Type</th><th class="text-right">Amount</th><th class="text-right">Balance</th><th>Note</th></tr>'+h.khata.map(k=>'<tr><td>'+(k.created_at||'').slice(0,10)+'</td><td>'+k.type+'</td><td class="text-right">Rs '+k.amount.toFixed(2)+'</td><td class="text-right">Rs '+k.balance.toFixed(2)+'</td><td>'+(k.note||'')+'</td></tr>').join('')+'</table>';
else kh='<p class="text-muted" style="font-size:13px">No entries</p>';
const baby=(c.baby_name||c.baby_birth)?'<p style="font-size:13px;color:#6b7280">'+(c.baby_name?'Baby: '+c.baby_name:'')+(c.baby_birth?' | Born: '+c.baby_birth:'')+'</p>':'';
document.getElementById('dc').innerHTML='<h2>'+c.name+'</h2><p style="font-size:13px;color:#6b7280">'+(c.phone||'')+(c.email?' | '+c.email:'')+'</p>'+baby+
'<div style="display:flex;gap:16px;margin:8px 0;font-size:13px"><span>Credit: <strong>Rs '+c.credit.toFixed(2)+'</strong></span><span>Spent: <strong>Rs '+c.total_spent.toFixed(2)+'</strong></span><span>Visits: <strong>'+c.visit_count+'</strong></span></div>'+
'<hr style="border:none;border-top:1px solid #e5e7eb;margin:12px 0"><h3 style="font-size:14px;margin-bottom:8px">Purchase History</h3>'+sh+
'<hr style="border:none;border-top:1px solid #e5e7eb;margin:12px 0"><h3 style="font-size:14px;margin-bottom:8px">Khata Ledger</h3>'+kh+
'<div style="margin-top:12px"><button class="btn btn-sm btn-p" onclick="editC('+id+')">Edit</button> <button class="btn btn-sm" onclick="cl(\'dmm\')">Close</button></div>';
document.getElementById('dmm').classList.add('show');});}
function editC(id){cl('dmm');const c=custs.find(x=>x.id===id);if(!c)return;editing=id;document.getElementById('ft').textContent='Edit '+c.name;
document.getElementById('cn').value=c.name;document.getElementById('cp').value=c.phone||'';document.getElementById('ce').value=c.email||'';document.getElementById('ca').value=c.address||'';
document.getElementById('cc').value=c.credit;document.getElementById('cbn').value=c.baby_name||'';document.getElementById('cbm').value=c.baby_birth||'';document.getElementById('cno').value=c.notes||'';
document.getElementById('fm').classList.add('show');}
function cl(id){document.getElementById(id).classList.remove('show');}
window.onclick=function(e){document.querySelectorAll('.modal').forEach(m=>{if(e.target===m)m.classList.remove('show');});};
</script></body></html>
