<!DOCTYPE html>
<html>

<head>
    <title>JITM · Inventory</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    {{sidebar|safe}}
    <div class="main">
        <div class="topbar">
            <h2>Inventory</h2>
            <div class="actions">
                {% if role == 'manager' %}<button class="btn btn-p btn-sm" onclick="showAdd()">+ New Product</button>
                <button class="btn btn-sm" onclick="showRestock()">Restock Log</button>{% endif %}
                <button class="btn btn-sm" onclick="showLow()">Low Stock</button> <button class="btn btn-sm"
                    onclick="showBarcodes()">Barcodes</button>
                <span class="text-muted">{{name}}</span>
            </div>
        </div>
        <div class="content">
            <div class="search"><input id="s" placeholder="Search products..." oninput="load()"></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortCol(0)" style="cursor:pointer;user-select:none">Product <span id="si0"></span></th>
                            <th onclick="sortCol(1)" style="cursor:pointer;user-select:none">SKU <span id="si1"></span></th>
                            <th onclick="sortCol(2)" class="text-right" style="cursor:pointer;user-select:none">Stock <span id="si2"></span></th>
                            <th onclick="sortCol(3)" style="cursor:pointer;user-select:none">Category <span id="si3"></span></th>
                            <th onclick="sortCol(4)" class="text-right" style="cursor:pointer;user-select:none">Sale Price <span id="si4"></span></th>
                            <th onclick="sortCol(5)" class="text-right" style="cursor:pointer;user-select:none">Avg Cost <span id="si5"></span></th>
                            <th onclick="sortCol(6)" class="text-right" style="cursor:pointer;user-select:none">Last P.Cost <span id="si6"></span></th>
                            <th onclick="sortCol(7)" class="text-right" style="cursor:pointer;user-select:none">Total Cost <span id="si7"></span></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tb"></tbody>
                </table>
            </div>
        </div>
    </div>
    <div class="modal" id="pm">
        <div class="mc"><button class="mx" onclick="cl('pm')">&times;</button>
            <h2 id="ft">Product</h2>
            <form onsubmit="save(event)"><label>Name</label><input id="pn" required>
                <div class="form-row">
                    <div style="flex:1"><label>SKU</label><div style="display:flex;gap:6px;align-items:center"><input id="ps" required style="flex:1"><label style="white-space:nowrap;font-size:12px;font-weight:400"><input type="checkbox" id="pa" onchange="autoSku(this.checked)"> Auto</label></div></div>
                    <div style="flex:1"><label>Barcode</label><input id="pb"></div>
                </div>
                <div class="form-row">
                    <div><label>Price (Rs)</label><input id="pp" type="number" step="0.01" required></div>
                    <div><label>Cost (Rs)</label><input id="pc" type="number" step="0.01" value="0" oninput="autoPrice()"></div>
                </div>
                <div class="form-row">
                    <div><label>Category</label><select id="pcat" onchange="categoryPicker()"></select><input id="pcat_new" style="display:none" placeholder="New category name"></div>
                    <div><label>Commission Class</label><select id="pcc" onchange="commissionPicker()"></select><input id="pcc_new" style="display:none" placeholder="New class name"></div>
                </div>
                <div class="form-row">
                    <div><label>Low Stock Alert</label><input id="pl" type="number" value="5"></div>
                </div>
                <button class="btn btn-p" type="submit">Save</button>
            </form>
        </div>
    </div>
    <div class="modal" id="vm">
        <div class="mc"><button class="mx" onclick="cl('vm')">&times;</button>
            <h2 id="vft">Add Variant</h2>
            <form onsubmit="saveV(event)">
                <div class="form-row">
                    <div><label>Size</label><input id="vsz"></div>
                    <div><label>Color</label><input id="vcl"></div>
                </div>
                <div class="form-row">
                    <div><label>SKU</label><input id="vsk" required></div>
                    <div><label>Barcode</label><input id="vbc"></div>
                </div>
                <div class="form-row">
                    <div><label>Price Override (Rs)</label><input id="vpr" type="number" step="0.01"
                            placeholder="Uses base if blank"></div>
                    <div><label>Stock</label><input id="vst" type="number" value="0"></div>
                </div>
                <button class="btn btn-p" type="submit">Add Variant</button>
            </form>
        </div>
    </div>
    <div class="modal" id="sm">
        <div class="mc"><button class="mx" onclick="cl('sm')">&times;</button>
            <h3>Update Stock</h3>
            <label>New Quantity</label><input id="stq" type="number" min="0"><label>Cost per unit (Rs)</label><input
                id="stc" type="number" step="0.01" value="0"><label>Note</label><input id="stn">
            <button class="btn btn-p" onclick="saveStock()">Update</button>
        </div>
    </div>
    <div class="modal" id="lm">
        <div class="mc"><button class="mx" onclick="cl('lm')">&times;</button>
            <h2>Low Stock</h2>
            <div id="ll"></div>
        </div>
    </div>
    <div class="modal" id="bm">
        <div class="mc" style="max-width:640px"><button class="mx" onclick="cl('bm')">&times;</button>
            <h2>Barcodes</h2>
            <div id="bl"></div>
        </div>
    </div>
    <div class="modal" id="rml">
        <div class="mc" style="max-width:700px"><button class="mx" onclick="cl('rml')">&times;</button>
            <h2>Restock Log</h2>
            <div id="rl"></div>
        </div>
    </div>
    <script type="application/json" id="sv">{{role|tojson}}</script>
    <script>
        var ROLE = JSON.parse(document.getElementById('sv').textContent);
        var editing = null, avId = null, svId = null, all = [], sortIdx = -1, sortDir = 1, catList = [], ccList = [];
        load();
        function load() {
            const q = document.getElementById('s').value;
            fetch('/api/products?q=' + encodeURIComponent(q)).then(r => r.json()).then(d => { all = d; render(d); });
            fetch('/api/categories').then(r => r.json()).then(d => { catList = d; });
            fetch('/api/commission-classes').then(r => r.json()).then(d => { ccList = d; });
        }
        function sortCol(i){
            if (sortIdx === i) { sortDir *= -1; } else { sortIdx = i; sortDir = 1; }
            for (let j = 0; j < 8; j++) document.getElementById('si' + j).textContent = '';
            document.getElementById('si' + i).textContent = sortDir === 1 ? ' \u25B2' : ' \u25BC';
            const vals = [
                p => (p.name || '').toLowerCase(),
                p => (p.sku || '').toLowerCase(),
                p => p.total_stock || 0,
                p => (p.category || '').toLowerCase(),
                p => p.base_price || 0,
                p => p.cost_price || 0,
                p => p.last_purchased_cost != null ? p.last_purchased_cost : -Infinity,
                p => (p.cost_price || 0) * (p.total_stock || 0),
            ];
            all.sort((a, b) => { const va = vals[i](a), vb = vals[i](b); return va < vb ? -sortDir : va > vb ? sortDir : 0; });
            render(all);
        }
        function render(l) {
            document.getElementById('tb').innerHTML = l.map(p => {
                let vh = ''; if (p.variants && p.variants.length) {
                    const vc = p.cost_price || 0; vh = '<tr id="v-' + p.id + '" style="display:none"><td colspan="9" style="padding:6px 14px 8px;background:#f8f7f4">' +
                        p.variants.map(v => '<div style="display:flex;gap:6px;align-items:center;padding:3px 0;font-size:12px"><span style="width:95px">' + (v.size || '-') + ' / ' + (v.color || '-') + '</span><span style="width:80px;color:#6b7280">' + v.sku + '</span><span style="width:45px;text-align:right" class="' + (v.stock <= p.low_stock ? 'bdg bdg-err' : '') + '">' + v.stock + '</span><span style="width:70px">' + (v.barcode ? '<code>' + v.barcode + '</code>' : '-') + '</span><span style="width:65px;font-weight:600;text-align:right">Rs ' + (v.price || p.base_price).toFixed(2) + '</span><span style="width:60px;text-align:right">Rs ' + vc.toFixed(2) + '</span><span style="width:65px;text-align:right;color:#6b7280">' + (p.last_purchased_cost !== null ? 'Rs ' + p.last_purchased_cost.toFixed(2) : '- -') + '</span><span style="width:65px;text-align:right;color:#374151">Rs ' + (vc * v.stock).toFixed(2) + '</span>' +
                            (ROLE == 'manager' ? '<button class="btn btn-xs" onclick="editStock(' + v.id + ')">Stock</button>' : '') + '</div>').join('') + '</td></tr>';
        }
        const arrow = p.has_variants ? '<span onclick="toggleV(' + p.id + ')" style="cursor:pointer;font-size:10px;color:#9ca3af;margin-right:6px;user-select:none" id="a-' + p.id + '">&#9654;</span> ' : '';
        const tc = p.cost_price * p.total_stock;
        const lc = p.last_purchased_cost !== null ? 'Rs ' + p.last_purchased_cost.toFixed(2) : '<span style="color:#d1d5db">&ndash;</span>';
        return '<tr><td style="font-weight:600">' + arrow + p.name + '</td><td>' + p.sku + '</td><td class="text-right">' + p.total_stock + '</td><td>' + (p.category || '-') + '</td><td class="text-right">Rs ' + p.base_price.toFixed(2) + '</td><td class="text-right">Rs ' + p.cost_price.toFixed(2) + '</td><td class="text-right">' + lc + '</td><td class="text-right">Rs ' + tc.toFixed(2) + '</td>' +
            '<td>' + (ROLE == 'manager' ? '<button class="btn btn-xs btn-ghost" onclick="edit(' + p.id + ')">Edit</button> <button class="btn btn-xs" onclick="addV(' + p.id + ')">+ Variant</button>' : '') + '</td></tr>' + vh;}).join('');}
        function toggleV(id) { const e = document.getElementById('v-' + id); const a = document.getElementById('a-' + id); if (e.style.display === 'none') { e.style.display = ''; a.innerHTML = '&#9660;'; } else { e.style.display = 'none'; a.innerHTML = '&#9654;'; } }
        function autoSku(on) {
            const inp = document.getElementById('ps');
            if (on) {
                inp.disabled = true;
                let sku;
                do {
                    const letters = String.fromCharCode(65 + Math.random() * 26, 65 + Math.random() * 26, 65 + Math.random() * 26);
                    const digits = String(Math.floor(Math.random() * 1000)).padStart(3, '0');
                    sku = letters + digits;
                } while (all.some(p => p.sku === sku || (p.variants || []).some(v => v.sku === sku)));
                inp.value = sku;
            } else {
                inp.disabled = false;
            }
        }
        function populateCategories() {
            const sel = document.getElementById('pcat');
            sel.innerHTML = '<option value="">-- Select --</option>' + catList.map(c => '<option value="' + c.name.replace(/"/g, '&quot;') + '">' + c.name + '</option>').join('') + '<option value="__new__">+ Create new category</option>';
        }
        function categoryPicker() {
            const sel = document.getElementById('pcat');
            if (sel.value === '__new__') {
                sel.style.display = 'none';
                document.getElementById('pcat_new').style.display = '';
                document.getElementById('pcat_new').value = '';
                document.getElementById('pcat_new').focus();
            }
        }
        function populateCommissionClasses() {
            const sel = document.getElementById('pcc');
            sel.innerHTML = '<option value="">-- Select --</option>' + ccList.map(c => '<option value="' + c.name.replace(/"/g, '&quot;') + '">' + c.name + '</option>').join('') + '<option value="__new__">+ Create new class</option>';
        }
        function commissionPicker() {
            const sel = document.getElementById('pcc');
            if (sel.value === '__new__') {
                sel.style.display = 'none';
                document.getElementById('pcc_new').style.display = '';
                document.getElementById('pcc_new').value = '';
                document.getElementById('pcc_new').focus();
            }
        }
        function autoPrice() {
            var cost = parseFloat(document.getElementById('pc').value) || 0;
            if (cost > 0) {
                document.getElementById('pp').value = (cost * 1.35).toFixed(2);
            }
        }
        function showAdd() {
            editing = null; document.getElementById('ft').textContent = 'New Product';
            document.getElementById('pa').checked = false; document.getElementById('ps').disabled = false; document.getElementById('ps').value = '';
            document.getElementById('pcat').style.display = ''; document.getElementById('pcat_new').style.display = 'none';
            document.getElementById('pcc').style.display = ''; document.getElementById('pcc_new').style.display = 'none';
            populateCategories(); document.getElementById('pcat').value = '';
            populateCommissionClasses(); document.getElementById('pcc').value = '';
            document.getElementById('pm').classList.add('show');
        }
        function edit(id) {
            const p = all.find(x => x.id === id); if (!p) return; editing = id; document.getElementById('ft').textContent = 'Edit ' + p.name;
            document.getElementById('pn').value = p.name; document.getElementById('ps').value = p.sku; document.getElementById('pb').value = p.barcode || '';
            document.getElementById('pp').value = p.base_price; document.getElementById('pc').value = p.cost_price;
            populateCategories();
            const sel = document.getElementById('pcat');
            sel.style.display = ''; document.getElementById('pcat_new').style.display = 'none';
            if (p.category && [...sel.options].some(o => o.value === p.category)) {
                sel.value = p.category;
            } else if (p.category) {
                sel.value = '__new__';
                document.getElementById('pcat_new').value = p.category;
                sel.style.display = 'none';
                document.getElementById('pcat_new').style.display = '';
            } else {
                sel.value = '';
            }
            populateCommissionClasses();
            const csel = document.getElementById('pcc');
            csel.style.display = ''; document.getElementById('pcc_new').style.display = 'none';
            if (p.commission_class && [...csel.options].some(o => o.value === p.commission_class)) {
                csel.value = p.commission_class;
            } else if (p.commission_class) {
                csel.value = '__new__';
                document.getElementById('pcc_new').value = p.commission_class;
                csel.style.display = 'none';
                document.getElementById('pcc_new').style.display = '';
            } else {
                csel.value = '';
            }
            document.getElementById('pl').value = p.low_stock; document.getElementById('pa').checked = false; document.getElementById('ps').disabled = true;
            document.getElementById('pm').classList.add('show');
        }
        function save(e) {
            e.preventDefault();
            const sel = document.getElementById('pcat');
            const cat = sel.value === '__new__' ? document.getElementById('pcat_new').value : sel.value;
            const csel = document.getElementById('pcc');
            const commission_class = csel.value === '__new__' ? document.getElementById('pcc_new').value : csel.value;
            const data = {
                name: document.getElementById('pn').value, sku: document.getElementById('ps').value, barcode: document.getElementById('pb').value || null,
                base_price: document.getElementById('pp').value, cost_price: document.getElementById('pc').value || 0, category: cat,
                commission_class: commission_class || null,
                low_stock: document.getElementById('pl').value || 5, has_variants: 0, stock: 0
            };
            if (cat && !catList.some(c => c.name === cat)) {
                fetch('/api/categories', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: cat}) }).then(r => r.json()).then(() => { catList.push({name: cat}); });
            }
            if (commission_class && !ccList.some(c => c.name === commission_class)) {
                fetch('/api/commission-classes', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({name: commission_class}) }).then(r => r.json()).then(() => { ccList.push({name: commission_class}); });
            }
            const url = editing ? '/api/products/' + editing : '/api/products'; fetch(url, { method: editing ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(r => r.json()).then(d => { if (d.error) { alert(d.error); return; } cl('pm'); load(); });
        }
        function addV(id) { avId = id; document.getElementById('vm').classList.add('show'); }
        function saveV(e) {
            e.preventDefault(); const data = {
                product_id: avId, size: document.getElementById('vsz').value, color: document.getElementById('vcl').value,
                sku: document.getElementById('vsk').value, barcode: document.getElementById('vbc').value || null, price: document.getElementById('vpr').value || null, stock: document.getElementById('vst').value || 0
            };
            fetch('/api/variants', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).then(r => r.json()).then(d => {
                if (d.error) { alert(d.error); return; } cl('vm'); load();
                document.getElementById('vsz').value = ''; document.getElementById('vcl').value = ''; document.getElementById('vsk').value = ''; document.getElementById('vbc').value = ''; document.getElementById('vpr').value = ''; document.getElementById('vst').value = '0';
            });
        }
        function editStock(id) { svId = id; document.getElementById('stq').value = ''; document.getElementById('stc').value = '0'; document.getElementById('stn').value = ''; document.getElementById('sm').classList.add('show'); }
        function saveStock() {
            const qty = parseInt(document.getElementById('stq').value); if (isNaN(qty) || qty < 0) { f('Enter valid stock', 'err'); return; }
            fetch('/api/variants/' + svId + '/stock', { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ stock: qty, cost: document.getElementById('stc').value || 0, note: document.getElementById('stn').value }) })
                .then(r => r.json()).then(() => { cl('sm'); load(); f('Stock updated', 'ok'); });
        }
        function showLow() {
            fetch('/api/products/low-stock').then(r => r.json()).then(d => {
                let h = ''; if (!d.length) h = '<div class="empty">All well-stocked!</div>'; else d.forEach(p => { h += '<h4 style="margin:8px 0 4px">' + p.product.name + '</h4>'; p.variants.forEach(v => { h += '<div style="font-size:13px;padding:2px 0"><span class="bdg bdg-err">' + v.stock + '</span> ' + v.sku + ' ' + (v.size || '') + ' ' + (v.color || '') + '</div>'; }); });
                document.getElementById('ll').innerHTML = h; document.getElementById('lm').classList.add('show');
            });
        }
        function showBarcodes() {
            fetch('/api/barcodes').then(r => r.json()).then(d => {
                document.getElementById('bl').innerHTML = d.length ? '<table><tr><th>Product</th><th>Variant</th><th>SKU</th><th>Barcode</th><th class="text-right">Price</th></tr>' +
                    d.map(v => '<tr><td>' + v.product_name + '</td><td>' + (v.size || '') + ' ' + (v.color || '') + '</td><td>' + v.sku + '</td><td><code>' + (v.barcode || '-') + '</code></td><td class="text-right">Rs ' + (v.price || v.base_price).toFixed(2) + '</td></tr>').join('') + '</table>' : '<div class="empty">No barcodes</div>'; document.getElementById('bm').classList.add('show');
            });
        }
        function showRestock() {
            fetch('/api/restock-log').then(r => r.json()).then(d => {
                document.getElementById('rl').innerHTML = d.length ? '<table><tr><th>Date</th><th>Product</th><th>SKU</th><th>Added</th><th class="text-right">Cost</th><th>Staff</th><th>Note</th></tr>' +
                    d.map(r => '<tr><td>' + (r.created_at || '').slice(0, 10) + '</td><td>' + r.product_name + '</td><td>' + r.sku + '</td><td>' + r.qty_added + '</td><td class="text-right">Rs ' + (r.cost || 0).toFixed(2) + '</td><td>' + (r.staff_name || '') + '</td><td>' + (r.note || '') + '</td></tr>').join('') + '</table>' : '<div class="empty">No restock history</div>'; document.getElementById('rml').classList.add('show');
            });
        }
        function f(m, t) { const e = document.getElementById('flash'); e.innerHTML = '<div class="fl fl-' + t + '">' + m + '</div>'; setTimeout(() => { const f = e.querySelector('.fl'); if (f) { f.style.opacity = '0'; setTimeout(() => f.remove(), 300); } }, 3000); }
        function cl(id) { document.getElementById(id).classList.remove('show'); }
        window.onclick = function (e) { document.querySelectorAll('.modal').forEach(m => { if (e.target === m) m.classList.remove('show'); }); };
    </script>
</body>

</html>
