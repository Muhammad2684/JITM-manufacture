<!DOCTYPE html>
<html><head><title>JITM · Ledger</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"></head><body>
{{sidebar|safe}}
<div class="main">
    <div class="topbar"><h2>Khata · Ledger</h2><div class="actions"><span class="text-muted">{{name}}</span></div></div>
    <div class="tabs"><button class="tab active" onclick="switchTab('customer')" id="tc">Customers</button><button class="tab" onclick="switchTab('supplier')" id="ts">Suppliers</button></div>
    <div class="content">
        <div class="search"><input id="s" placeholder="Search..." oninput="load()"></div>
        <div class="kg" id="kg"></div>
    </div>
</div>
<div class="modal" id="km"><div class="mc" style="max-width:540px"><button class="mx" onclick="cl('km')">&times;</button><div id="kc"></div></div></div>
<style>
.tabs{display:flex;gap:0;border-bottom:1px solid #e2e1de;padding:0 32px;background:#fff}
.tab{padding:10px 20px;border:none;background:transparent;font-size:12px;font-weight:500;color:#6b7280;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;text-transform:uppercase;letter-spacing:.04em}
.tab:hover{color:#1e293b}
.tab.active{color:#3b4fe2;border-bottom-color:#3b4fe2}
</style>
<script>
var tab='customer';
function switchTab(t){tab=t;
document.getElementById('tc').className='tab'+(t==='customer'?' active':'');
document.getElementById('ts').className='tab'+(t==='supplier'?' active':'');
load();}
load();
function load(){
const url=tab==='customer'?'/api/khata/ledger':'/api/suppliers/ledger';
fetch(url).then(r=>r.json()).then(d=>{
const q=document.getElementById('s').value.toLowerCase();
const f=q?d.filter(c=>c.name.toLowerCase().includes(q)):d;
const key=tab==='customer'?'balance':'balance';
document.getElementById('kg').innerHTML=f.length?f.map(c=>'<div class="kc" onclick="detail('+c.id+')"><div><h3>'+c.name+'</h3><div class="km">'+(c.phone||'')+'</div></div><div style="text-align:right"><div class="bal">Rs '+c[key].toFixed(2)+'</div><div style="font-size:11px;color:#9ca3af">Balance</div></div></div>').join(''):'<div class="empty">No entries</div>';});}
function detail(id){
const url=tab==='customer'?'/api/khata/'+id:'/api/suppliers/'+id+'/khata';
fetch(url).then(r=>r.json()).then(d=>{
let h='<h2>'+d.customer.name+'</h2><p style="font-size:22px;font-weight:700;margin:8px 0;color:#4f46e5">Rs '+d.customer.balance.toFixed(2)+'</p>';
if(tab==='customer')h+='<div style="display:flex;gap:8px;margin:12px 0"><button class="btn btn-sm btn-s" onclick="ae('+id+',\'payment\')">+ Payment</button> <button class="btn btn-sm btn-w" onclick="ae('+id+',\'credit\')">+ Credit</button></div>';
else h+='<div style="display:flex;gap:8px;margin:12px 0"><button class="btn btn-sm btn-s" onclick="ae('+id+',\'payment\')">+ Payment</button> <button class="btn btn-sm btn-w" onclick="ae('+id+',\'credit\')">+ Credit</button></div>';
h+='<hr style="border:none;border-top:1px solid #e5e7eb;margin:8px 0"><h3 style="font-size:14px;margin-bottom:8px">History</h3>';
if(d.entries&&d.entries.length){h+='<table><tr><th>Date</th><th>Type</th><th class="text-right">Amount</th><th class="text-right">Balance</th><th>Staff</th><th>Note</th></tr>'+
d.entries.map(e=>'<tr><td>'+(e.created_at||'').slice(0,10)+'</td><td><span class="bdg bdg-'+(e.type==='credit'?'warn':'ok')+'">'+e.type+'</span></td><td class="text-right">Rs '+e.amount.toFixed(2)+'</td><td class="text-right">Rs '+e.balance.toFixed(2)+'</td><td>'+(e.staff_name||'')+'</td><td>'+(e.note||'')+'</td></tr>').join('')+'</table>';}
else h+='<p class="text-muted" style="font-size:13px">No entries</p>';
document.getElementById('kc').innerHTML=h;document.getElementById('km').classList.add('show');});}
var eid=0;
function ae(id,type){eid=id;const amt=prompt('Amount (Rs):');if(!amt||isNaN(amt))return;const note=prompt('Note:')||'';
const ep=tab==='customer'?'/api/khata':'/api/suppliers/khata';
const bid=tab==='customer'?id:id;
fetch(ep,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:bid,type,amount:parseFloat(amt),note})}).then(r=>r.json()).then(d=>{if(d.ok){detail(id);load();}});}
function cl(id){document.getElementById(id).classList.remove('show');}
window.onclick=function(e){document.querySelectorAll('.modal').forEach(m=>{if(e.target===m)m.classList.remove('show');});};
</script></body></html>
