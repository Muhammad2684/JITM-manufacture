<!DOCTYPE html>
<html><head><title>JITM · Khata</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"></head><body>
{{sidebar|safe}}
<div class="main">
    <div class="topbar"><h2>Khata · Customer Ledger</h2><div class="actions"><span class="text-muted">{{name}}</span></div></div>
    <div class="content">
        <div class="search"><input id="s" placeholder="Search customer..." oninput="load()"></div>
        <div class="kg" id="kg"></div>
    </div>
</div>
<div class="modal" id="km"><div class="mc" style="max-width:540px"><button class="mx" onclick="cl('km')">&times;</button><div id="kc"></div></div></div>
<script>
load();
function load(){fetch('/api/khata/ledger').then(r=>r.json()).then(d=>{const q=document.getElementById('s').value.toLowerCase();const f=q?d.filter(c=>c.name.toLowerCase().includes(q)):d;
document.getElementById('kg').innerHTML=f.length?f.map(c=>'<div class="kc" onclick="detail('+c.id+')"><div><h3>'+c.name+'</h3><div class="km">'+(c.phone||'')+'</div></div><div style="text-align:right"><div class="bal">$'+c.balance.toFixed(2)+'</div><div style="font-size:11px;color:#9ca3af">Balance</div></div></div>').join(''):'<div class="empty">No customers</div>';});}
function detail(id){fetch('/api/khata/'+id).then(r=>r.json()).then(d=>{let h='<h2>'+d.customer.name+'</h2><p style="font-size:22px;font-weight:700;margin:8px 0;color:#4f46e5">$'+d.customer.credit.toFixed(2)+'</p>'+
'<div style="display:flex;gap:8px;margin:12px 0"><button class="btn btn-sm btn-s" onclick="ae('+id+',\'payment\')">+ Payment</button> <button class="btn btn-sm btn-w" onclick="ae('+id+',\'credit\')">+ Credit</button></div>'+
'<hr style="border:none;border-top:1px solid #e5e7eb;margin:8px 0"><h3 style="font-size:14px;margin-bottom:8px">History</h3>';
if(d.entries&&d.entries.length){h+='<table><tr><th>Date</th><th>Type</th><th class="text-right">Amount</th><th class="text-right">Balance</th><th>Staff</th><th>Note</th></tr>'+
d.entries.map(e=>'<tr><td>'+(e.created_at||'').slice(0,10)+'</td><td><span class="bdg bdg-'+(e.type==='credit'?'warn':'ok')+'">'+e.type+'</span></td><td class="text-right">$'+e.amount.toFixed(2)+'</td><td class="text-right">$'+e.balance.toFixed(2)+'</td><td>'+(e.staff_name||'')+'</td><td>'+(e.note||'')+'</td></tr>').join('')+'</table>';}
else h+='<p class="text-muted" style="font-size:13px">No entries</p>';
document.getElementById('kc').innerHTML=h;document.getElementById('km').classList.add('show');});}
var eid=0;
function ae(id,type){eid=id;const amt=prompt('Amount ($):');if(!amt||isNaN(amt))return;const note=prompt('Note:')||'';
fetch('/api/khata',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:id,type,amount:parseFloat(amt),note})}).then(r=>r.json()).then(d=>{if(d.ok){detail(id);load();}});}
function cl(id){document.getElementById(id).classList.remove('show');}
window.onclick=function(e){document.querySelectorAll('.modal').forEach(m=>{if(e.target===m)m.classList.remove('show');});};
</script></body></html>
