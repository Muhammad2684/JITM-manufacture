<!DOCTYPE html>
<html><head><title>JITM POS - Login</title><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f5f6f8; display:flex; justify-content:center; align-items:center; min-height:100vh; }
.card { background:#fcfbf8; padding:40px; border-radius:10px; width:380px; border:1px solid #e2e1de; }
h1 { font-size:26px; color:#1e293b; margin-bottom:2px; }
h1 span { color:#3b4fe2; }
p { color:#6b7280; margin-bottom:24px; font-size:13px; }
input { width:100%; padding:10px 14px; border:1px solid #e2e1de; border-radius:6px; font-size:14px; margin-bottom:12px; }
input:focus { outline:none; border-color:#3b4fe2; box-shadow:0 0 0 3px rgba(59,79,226,.08); }
button { width:100%; padding:10px; background:#3b4fe2; color:#fff; border:none; border-radius:6px; font-size:14px; font-weight:600; cursor:pointer; }
button:hover { background:#3244c9; }
.hint { margin-top:16px; font-size:12px; color:#9ca3af; text-align:center; }
</style></head><body>
<div class="card">
    <h1><span>JITM</span> POS</h1>
    <p>Sign in to your account</p>
    <form method="POST">
        <input type="text" name="username" placeholder="Username" required autofocus>
        <input type="password" name="password" placeholder="Password" required>
        <button type="submit">Sign In</button>
    </form>
    <div class="hint">admin / admin123</div>
</div></body></html>
