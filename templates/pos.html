<!DOCTYPE html>
<html>

<head>
    <title>JITM · POS</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .main {
            margin-left: 0 !important
        }

        .pg {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            z-index: 50;
            background: #fff;
            border: 1px solid #e2e1de;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
            margin-top: 4px
        }

        .pd-item {
            padding: 10px 14px;
            cursor: pointer;
            border-bottom: 1px solid #f3f2ef;
            display: flex;
            flex-wrap: wrap;
            gap: 4px
        }

        .pd-item:last-child {
            border-bottom: none
        }

        .pd-item.hl {
            background: #f0effc
        }

        .pd-name {
            font-size: 13px;
            font-weight: 600;
            color: #1a1c2e;
            width: 100%
        }

        .pd-detail {
            font-size: 11px;
            color: #6b7280
        }

        .pd-price {
            font-size: 13px;
            font-weight: 700;
            color: #3b4fe2;
            margin-left: auto
        }

        .ct {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px
        }

        .ct th {
            padding: 6px 4px;
            text-align: left;
            font-size: 10px;
            color: #6b7280;
            font-weight: 600;
            text-transform: uppercase;
            border-bottom: 1px solid #e2e1de;
            white-space: nowrap;
            position: sticky;
            top: 0;
            background: #fcfbf8
        }

        .ct td {
            padding: 6px 4px;
            border-bottom: 1px solid #f3f2ef;
            vertical-align: middle
        }

        .ct td:first-child,
        .ct th:first-child {
            padding-left: 0
        }

        .ct td:last-child,
        .ct th:last-child {
            padding-right: 0;
            text-align: right
        }

        .ct select,
        .ct input {
            background: #fcfbf8;
            border: 1px solid #e2e1de;
            border-radius: 4px
        }

        .ct input[type=number] {
            -moz-appearance: textfield
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="topbar">
            <h2>Point of Sale</h2>
            <div class="actions"><span class="text-muted">{{name}}</span></div>
        </div>
        <div class="flash" id="flash"></div>
        <div class="pos">
            <div class="pos-left">
                <div class="card">
                    <div class="card-body" style="overflow:visible">
                        <div class="search" style="margin-bottom:-3px;position:relative">
                            <div style="display:flex;gap:6px"><input id="s"
                                    placeholder="Search name, SKU, or scan barcode..." autofocus style="flex:1"><button
                                    tabindex="-1" class="btn btn-sm btn-p" id="scBtn" onclick="toggleScanner()">Scanner On</button>
                            </div>
                            <div class="pg" id="prods"></div>
                        </div>
                    </div>
                </div>
                <div class="card" style="flex:1;overflow:hidden;display:flex;flex-direction:column">
                    <div class="card-header">
                        <h3>Sale Items</h3><span id="cnt" class="text-muted"></span>
                    </div>
                    <div class="card-body cart" id="cart" style="overflow:auto;flex:1">
                        <div class="cart-empty">Add items to begin</div>
                    </div>
                </div>
            </div>
            <div class="pos-right">
                <div class="card">
                    <div class="card-body">
                        <div style="display:flex;flex-direction:column;gap:6px">
                            <div style="display:flex;gap:6px;align-items:center">
                                <input id="cPhone" placeholder="Phone number..." style="flex:1" oninput="fmtPhone(this);findCust()">
                                <label
                                    style="font-size:11px;color:#6b7280;white-space:nowrap;display:flex;align-items:center;gap:4px;cursor:pointer">
                                    <input type="checkbox" id="walkIn" checked onchange="toggleWalkIn()"> Walk In
                                </label>
                            </div>
                            <div style="display:flex;gap:6px">
                                <select id="cTitle"
                                    style="width:74px;flex-shrink:0;padding:5px 8px;border:1px solid #e2e1de;border-radius:4px;font-size:12px;background:#fcfbf8">
                                    <option value="Mrs" selected>Mrs</option>
                                    <option value="Mr">Mr</option>
                                </select>
                                <input id="cName" placeholder="Customer name..." style="flex:1">
                            </div>
                            <div id="sc" style="font-size:12px;color:#3b4fe2"></div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body totals">
                        <div class="tr"><span>Subtotal</span><span id="sub">Rs 0.00</span></div>
                        <div class="tr"><span>Addons %</span><span><input id="discPct" type="number" min="0" step="0.1"
                                    placeholder="0" oninput="calc()"> %</span></div>
                        <div class="tr"><span>ㅤ </span><span><input id="discAmt" type="number" min="0" step="0.01"
                                    placeholder="0" oninput="calc()"> Rs</span></div>
                        <div class="tr gt"><span>TOTAL</span><span id="tot">Rs 0.00</span></div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body" style="padding-bottom:8px">
                        <div
                            style="display:grid;grid-template-columns:72px 1fr;gap:5px;align-items:center;font-size:12px">
                            <span
                                style="font-size:10px;text-transform:uppercase;color:#6b7280;font-weight:600">Method</span>
                            <span
                                style="font-size:10px;text-transform:uppercase;color:#6b7280;font-weight:600">Amount</span>
                            <span>Cash</span>
                            <input id="am-cash" type="number" step="0.01" min="0" oninput="calcSplit()"
                                style="width:100%;padding:5px 8px;border:1px solid #e2e1de;border-radius:4px;font-size:12px">
                            <span>JB</span>
                            <input id="am-jb" type="number" step="0.01" min="0" oninput="calcSplit()"
                                style="width:100%;padding:5px 8px;border:1px solid #e2e1de;border-radius:4px;font-size:12px">
                            <span>AHD</span>
                            <input id="am-ahd" type="number" step="0.01" min="0" oninput="calcSplit()"
                                style="width:100%;padding:5px 8px;border:1px solid #e2e1de;border-radius:4px;font-size:12px">
                            <span>Z</span>
                            <input id="am-z" type="number" step="0.01" min="0" oninput="calcSplit()"
                                style="width:100%;padding:5px 8px;border:1px solid #e2e1de;border-radius:4px;font-size:12px">
                            <span>Credit</span>
                            <input id="am-credit" type="number" step="0.01" min="0" oninput="calcSplit()"
                                style="width:100%;padding:5px 8px;border:1px solid #e2e1de;border-radius:4px;font-size:12px">
                        </div>
                        <div
                            style="display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:8px;border-top:1px solid #e2e1de;font-size:13px">
                            <span style="color:#6b7280">Applied: <span id="appliedTotal">0.00</span> / <span
                                    id="totDisp">0.00</span></span>
                            <span id="splitStatus" style="font-weight:700;padding:4px 10px;border-radius:6px">Enter
                                amounts</span>
                        </div>
                    </div>
                </div>
                <button class="btn btn-s btn-lg" id="chg" onclick="pay(true)" style="justify-content:center">Charge Rs
                    0.00</button>
                <button class="btn btn-lg" id="completeBtn" onclick="pay()" style="justify-content:center;margin-top:-6px">Complete</button>
                <div style="display:flex;gap:6px">
                    <button class="btn btn-ghost btn-sm" onclick="cycleMode()" id="modeBtn">Sale</button>
                    <button class="btn btn-ghost btn-sm" id="clearBtn" onclick="clearCart()">Clear</button>
                </div>
                <input id="notes" placeholder="Notes..." style="padding:6px 10px;font-size:12px">
            </div>
        </div>
    </div>

    <div class="modal" id="rm">
        <div class="mc" style="max-width:380px;scrollbar-width:none"><button class="mx" onclick="cl('rm')">&times;</button>
            <div id="rp">
                <div class="rec" id="rc"></div>
            </div>
            <style>#rm .mc::-webkit-scrollbar{display:none}</style>
<div class="ra"><button class="btn btn-p btn-sm" onclick="printReceiptModal()">Print</button> <button
                     class="btn btn-sm" onclick="cl('rm')">Done</button></div>
        </div>
    </div>
    <div class="modal" id="em">
        <div class="mc" style="max-width:360px;padding:0;border-radius:12px;text-align:center">
            <div class="card-body">
                <p id="em-msg" style="font-size:15px;color:#dc2626;padding:20px 0;margin:0"></p>
            </div>
            <div style="padding:0 20px 16px"><button class="btn btn-p btn-sm" onclick="cl('em')"
                    style="min-width:80px">OK</button></div>
        </div>
    </div>
    <script>
        var cart = [], isR = false, selC = null, walkIn = true, allP = [], hlIdx = -1, scMode = true, staffList = [], lastStaff = null, scanning = false;
        toggleWalkIn();

        document.getElementById('s').addEventListener('input', function (e) {
            if (e.target.value.length >= 1) search(); else closeDropdown();
        });
        document.getElementById('s').addEventListener('keydown', function (e) {
            var prods = document.getElementById('prods'), items = prods.querySelectorAll('.pd-item');
            if (e.key === 'ArrowDown') { e.preventDefault(); hlIdx = Math.min(hlIdx + 1, items.length - 1); highlight(items); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); hlIdx = Math.max(hlIdx - 1, 0); highlight(items); }
            else if (e.key === 'Enter') {
                if (scMode) { scanBarcode(e.target.value); }
                else if (items.length) { var idx = hlIdx >= 0 ? hlIdx : 0; var it = items[idx]; add(parseInt(it.dataset.vid), parseFloat(it.dataset.price)); }
                else if (e.target.value.length >= 1) search();
            }
        });
        document.getElementById('s').addEventListener('blur', function () { setTimeout(closeDropdown, 200) });
        document.getElementById('discPct').addEventListener('input', calc);
        document.getElementById('discAmt').addEventListener('input', calc);

        function focusSelect(el) { el.focus(); el.showPicker(); }
        var navIds = ['s', 'discPct', 'discAmt', 'am-cash', 'am-jb', 'am-ahd', 'am-z', 'am-credit', 'chg', 'completeBtn'];
        var amtIds = ['am-cash', 'am-jb', 'am-ahd', 'am-z', 'am-credit'];
        function lastCartEl(tr) { var a = tr.querySelectorAll('select,input'); return a[a.length - 1]; }
        function navNext() { var sel = document.querySelector('#cart select'); if (sel) { focusSelect(sel); return; } document.getElementById('discPct').focus(); }
        function navPrevToCart() { var rows = document.querySelectorAll('#cart tbody tr'); if (rows.length) { lastCartEl(rows[rows.length - 1]).focus(); return; } document.getElementById('s').focus(); }
        document.getElementById('cName').addEventListener('keydown', function (e) { if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); document.getElementById('s').focus(); } });
        document.getElementById('s').addEventListener('keydown', function (e) { if (e.key !== 'Tab') return; e.preventDefault(); if (e.shiftKey) { document.getElementById('completeBtn').focus(); return; } navNext(); });
        document.getElementById('discPct').addEventListener('keydown', function (e) { if (e.key !== 'Tab') return; e.preventDefault(); if (e.shiftKey) { navPrevToCart(); return; } document.getElementById('discAmt').focus(); });
        document.getElementById('discAmt').addEventListener('keydown', function (e) { if (e.key !== 'Tab') return; e.preventDefault(); if (e.shiftKey) { document.getElementById('discPct').focus(); return; } document.getElementById('am-cash').focus(); });
        amtIds.forEach(function (id, i) { document.getElementById(id).addEventListener('keydown', function (e) { if (e.key !== 'Tab') return; e.preventDefault(); if (e.shiftKey) { document.getElementById(i ? amtIds[i - 1] : 'discAmt').focus(); } else { document.getElementById(i < amtIds.length - 1 ? amtIds[i + 1] : 'chg').focus(); } }); });
        document.getElementById('chg').addEventListener('keydown', function (e) { if (e.key !== 'Tab') return; e.preventDefault(); if (e.shiftKey) { document.getElementById('am-credit').focus(); return; } document.getElementById('completeBtn').focus(); });
        document.getElementById('completeBtn').addEventListener('keydown', function (e) { if (e.key !== 'Tab') return; e.preventDefault(); if (e.shiftKey) { document.getElementById('chg').focus(); return; } document.getElementById('s').focus(); });
        document.getElementById('cart').addEventListener('keydown', function (e) {
            if (e.key !== 'Tab') return;
            var tr = e.target.closest('tr');
            if (!tr) return;
            e.preventDefault();
            var els = Array.prototype.slice.call(tr.querySelectorAll('select,input'));
            if (e.shiftKey) {
                var i = els.indexOf(e.target) - 1;
                if (i >= 0) { els[i].focus(); return; }
                var prev = tr.previousElementSibling;
                if (prev) { lastCartEl(prev).focus(); return; }
                document.getElementById('s').focus();
                return;
            }
            var j = els.indexOf(e.target) + 1;
            if (j < els.length) { els[j].focus(); return; }
            var nxt = tr.nextElementSibling;
            if (nxt) { var nf = nxt.querySelector('select'); if (nf) { focusSelect(nf); return; } }
            document.getElementById('discPct').focus();
        });
        document.addEventListener('keydown', function (e) {
            if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
            var id = e.target.id, tr = e.target.closest('tr');
            if (tr && tr.closest('#cart')) {
                e.preventDefault();
                var els = Array.prototype.slice.call(tr.querySelectorAll('select,input')), i = els.indexOf(e.target);
                if (e.key === 'ArrowDown') {
                    var nx = els[i + 1];
                    if (nx) { nx.focus(); return; }
                    var nr = tr.nextElementSibling;
                    if (nr) { var nf = nr.querySelector('select'); if (nf) { nf.focus(); return; } }
                    document.getElementById('discPct').focus();
                } else {
                    var pv = els[i - 1];
                    if (pv) { pv.focus(); return; }
                    var pr = tr.previousElementSibling;
                    if (pr) { lastCartEl(pr).focus(); return; }
                    document.getElementById('s').focus();
                }
                return;
            }
            if (id === 's') {
                if (document.querySelectorAll('#prods .pd-item').length) return;
                e.preventDefault();
                if (e.key === 'ArrowDown') { navNext(); } else { document.getElementById('completeBtn').focus(); }
                return;
            }
            if (id === 'discPct' && e.key === 'ArrowUp') {
                e.preventDefault();
                navPrevToCart();
                return;
            }
            var idx = navIds.indexOf(id);
            if (idx === -1) return;
            e.preventDefault();
            var ni = (idx + (e.key === 'ArrowDown' ? 1 : -1) + navIds.length) % navIds.length;
            document.getElementById(navIds[ni]).focus();
        });

        function highlight(items) { items.forEach(function (el, i) { el.classList.toggle('hl', i === hlIdx) }); var h = items[hlIdx]; if (h) h.scrollIntoView({ block: 'nearest' }); }
        function closeDropdown() { var g = document.getElementById('prods'); g.innerHTML = ''; g.style.display = 'none'; hlIdx = -1; }
        function toggleScanner() { scMode = !scMode; var b = document.getElementById('scBtn'); b.textContent = scMode ? 'Scanner On' : 'Scanner'; b.className = scMode ? 'btn btn-sm btn-p' : 'btn btn-sm'; if (scMode) document.getElementById('s').focus(); }
        var searchTimer = null;
        function scanBarcode(code) {
            if (!code) return;
            scanning = true;
            if (searchTimer) { clearTimeout(searchTimer); searchTimer = null; }
            fetch('/api/products/search?q=' + encodeURIComponent(code)).then(function (r) { return r.json() }).then(function (d) {
                scanning = false;
                if (!d.length) { f('No product found'); return; }
                allP = d;
                var exact = d.filter(function(p){ return p.sku === code || p.barcode === code; });
                if (exact.length) { closeDropdown(); add(exact[0].vid, exact[0].price); }
                else if (d.length === 1) { closeDropdown(); add(d[0].vid, d[0].price); }
                else { renderP(d); }
            }).catch(function () { scanning = false; f('Search failed'); });
        }
        function search() {
            if (searchTimer) clearTimeout(searchTimer);
            searchTimer = setTimeout(function () {
                var v = document.getElementById('s').value;
                if (!v) { closeDropdown(); return; }
                fetch('/api/products/search?q=' + encodeURIComponent(v)).then(function (r) { if (!r.ok) throw Error(r.status); return r.json() }).then(function (d) { if (scanning || document.getElementById('s').value !== v) return; allP = d; renderP(d) }).catch(function () { allP = []; f('Search failed'); });
            }, scMode ? 0 : 200);
        }
        function renderP(l) {
            var g = document.getElementById('prods'); hlIdx = -1; if (!l.length) { g.style.display = 'none'; g.innerHTML = ''; return; }
            g.style.display = 'block'; g.innerHTML = l.map(function (p, i) { var pr = p.price || 0; return '<div class="pd-item" data-vid="' + p.vid + '" data-price="' + pr + '"><div class="pd-name">' + p.name + '</div><div class="pd-detail">' + (p.size || '') + ' ' + (p.color || '') + ' | ' + p.sku + ' &middot; ' + p.stock + ' in stock</div><div class="pd-price">Rs ' + pr.toFixed(2) + '</div></div>'; }).join('');
        }
        document.getElementById('prods').addEventListener('click', function (e) {
            var item = e.target.closest('.pd-item'); if (!item) return;
            add(parseInt(item.dataset.vid), parseFloat(item.dataset.price));
        });
        function add(vid, pr) {
            if (vid == null || isNaN(vid)) return;
            var e = cart.find(function (x) { return x.vid === vid }); if (e && !isR) { e.qty++; renderC(); closeDropdown(); document.getElementById('s').value = ''; document.getElementById('s').focus(); return; }
            var p = allP.find(function (x) { return x.vid === vid }); if (!p) { f('Product not found'); return; }

            cart.push({ vid: vid, pname: p.name, sku: p.sku, variant: (p.size || '') + ' ' + (p.color || ''), price: pr || p.price, qty: 1, disc: 0, staff: lastStaff, isReturn: false }); renderC();
            closeDropdown(); document.getElementById('s').value = ''; document.getElementById('s').focus();
        }
        function imgPH(n) { return '<div style="width:32px;height:32px;background:#e2e1de;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#6b7280;font-weight:600;flex-shrink:0">' + (n.charAt(0).toUpperCase() || '?') + '</div>'; }
        function renderC() {
            const el = document.getElementById('cart'), cnt = document.getElementById('cnt'); let n = 0, h = '';
            if (isR) h += '<div class="rb">RETURN MODE</div>';
            if (!cart.length) { el.innerHTML = h + '<div class="cart-empty">Add items to begin</div>'; cnt.textContent = ''; calc(); return; }
            h += '<table class="ct"><thead><tr><th></th><th>SKU</th><th>Staff</th><th>ㅤ</th><th>Product</th><th>Price</th><th>Qty</th><th>Net Total</th><th></th></tr></thead><tbody>';
            cart.forEach(function (c, i) {
                n += Math.abs(c.qty); var net = c.qty * c.price * (1 - (c.disc || 0) / 100);
                var sopts = staffList.map(function (s) { return '<option value="' + s.id + '"' + (s.id == c.staff ? ' selected' : '') + '>' + (s.nickname || s.name) + '</option>'; }).join('');
                var isReturnItem = c.isReturn === true;
                var rowStyle = isReturnItem ? 'background:#fef2f2;' : '';
                var qtyLabel = isReturnItem ? ' (Return)' : '';
                var returnToggle = isR ? '' : '';
                h += '<tr style="' + rowStyle + '"><td>' + imgPH(c.pname) + '</td><td style="font-size:10px;color:#6b7280">' + (c.sku || '-') + '</td>'
                    + '<td><select onchange="setStaff(' + i + ',this.value)" style="font-size:10px;padding:2px;max-width:80px">' + sopts + returnToggle + '</select></td>'
                    + '<td><input type="number" value="' + (c.disc || 0) + '" min="0" max="100" step="0.1" onfocus="this.select()" onchange="setDisc(' + i + ',this)" style="width:40px;font-size:11px;padding:2px"></td>'
                    + '<td style="font-size:12px;font-weight:600">' + c.pname + (c.variant ? ' <span style="color:#6b7280;font-size:10px">(' + c.variant + ')</span>' : '') + qtyLabel + '</td><td style="font-size:11px">Rs ' + c.price.toFixed(2) + '</td>'
                    + '<td><input type="number" value="' + Math.abs(c.qty) + '" min="1" onfocus="this.select()" onchange="uq(' + i + ',this)" style="width:40px;font-size:11px;padding:2px"></td>'
                    + '<td class="ncell" style="font-size:11px;font-weight:600">' + (isReturnItem ? '-' : '') + 'Rs ' + Math.abs(net).toFixed(2) + '</td>'
                    + '<td><button class="rm" onclick="ri(' + i + ')">&times;</button></td></tr>';
            });
            h += '</tbody></table>'; el.innerHTML = h; cnt.textContent = n + ' items'; calc();
        }
        function uq(i, el) { var v = parseInt(el.value); if (!v || v === 0) { cart.splice(i, 1); renderC(); return; } cart[i].qty = v; updateRowNet(el.closest('tr'), cart[i]); updateCnt(); calc(); }
        function updateRowNet(tr, c) { var cell = tr.querySelector('.ncell'); if (cell) cell.textContent = (c.isReturn ? '-' : '') + 'Rs ' + Math.abs(c.qty * c.price * (1 - (c.disc || 0) / 100)).toFixed(2); }
        function updateCnt() { var n = cart.reduce(function (s, c) { return s + Math.abs(c.qty); }, 0); document.getElementById('cnt').textContent = n + ' items'; }
        function setDisc(i, el) { if (!cart[i]) return; cart[i].disc = parseFloat(el.value) || 0; updateRowNet(el.closest('tr'), cart[i]); calc(); }
        function toggleReturnItem(i, checked) { if (cart[i]) { cart[i].isReturn = checked; } renderC(); }
        function ri(i) { cart.splice(i, 1); renderC(); }
        function setStaff(i, v) { if (cart[i]) { cart[i].staff = v ? parseInt(v) : null; lastStaff = cart[i].staff; } }
        function clearCart() {
            if (!cart.length) return; if (!confirm('Clear?')) return; cart = []; isR = false; selC = null;
            document.getElementById('sc').innerHTML = ''; document.getElementById('cPhone').value = ''; document.getElementById('cName').value = ''; document.getElementById('cName').readOnly = false; document.getElementById('walkIn').checked = true; toggleWalkIn(); document.getElementById('notes').value = '';
            document.getElementById('discPct').value = ''; document.getElementById('discAmt').value = ''; document.getElementById('am-cash').value = ''; document.getElementById('am-jb').value = ''; document.getElementById('am-ahd').value = ''; document.getElementById('am-z').value = ''; document.getElementById('am-credit').value = ''; document.getElementById('appliedTotal').textContent = '0.00'; document.getElementById('totDisp').textContent = '0.00'; document.getElementById('splitStatus').textContent = 'Enter amounts'; document.getElementById('splitStatus').style.color = '#6b7280'; document.getElementById('splitStatus').style.background = 'transparent';
            updateModeButton(); renderC(); search();
        }
        function cycleMode() {
            isR = !isR;
            updateModeButton();
            renderC();
        }
        function updateModeButton() {
            const b = document.getElementById('modeBtn');
            if (isR) {
                b.textContent = 'Return';
                b.className = 'btn btn-d btn-sm';
            } else {
                b.textContent = 'Sale';
                b.className = 'btn btn-ghost btn-sm';
            }
        }
        function calc() {
            let sub = 0;
            cart.forEach(function (c) {
                let itemTotal = c.qty * c.price * (1 - (c.disc || 0) / 100);
                sub += itemTotal;
            });
            const pct = parseFloat(document.getElementById('discPct').value) || 0;
