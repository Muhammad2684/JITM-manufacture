<!DOCTYPE html>
<html><head><title>JITM · POS</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"><style>.main{margin-left:0!important}
.pg{display:none;position:absolute;top:100%;left:0;right:0;z-index:50;background:#fff;border:1px solid #e2e1de;border-radius:8px;max-height:300px;overflow-y:auto;box-shadow:0 4px 12px rgba(0,0,0,.1);margin-top:4px}
.pd-item{padding:10px 14px;cursor:pointer;border-bottom:1px solid #f3f2ef;display:flex;flex-wrap:wrap;gap:4px}
.pd-item:last-child{border-bottom:none}
.pd-item.hl{background:#f0effc}
.pd-name{font-size:13px;font-weight:600;color:#1a1c2e;width:100%}
.pd-detail{font-size:11px;color:#6b7280}
.pd-price{font-size:13px;font-weight:700;color:#3b4fe2;margin-left:auto}
.ct{width:100%;border-collapse:collapse;font-size:12px}
.ct th{padding:6px 4px;text-align:left;font-size:10px;color:#6b7280;font-weight:600;text-transform:uppercase;border-bottom:1px solid #e2e1de;white-space:nowrap;position:sticky;top:0;background:#fcfbf8}
.ct td{padding:6px 4px;border-bottom:1px solid #f3f2ef;vertical-align:middle}
.ct td:first-child,.ct th:first-child{padding-left:0}
.ct td:last-child,.ct th:last-child{padding-right:0;text-align:right}
.ct select,.ct input{background:#fcfbf8;border:1px solid #e2e1de;border-radius:4px}
.ct input[type=number]{-moz-appearance:textfield}
</style></head><body>
<div class="main">
    <div class="topbar"><h2>Point of Sale</h2><div class="actions"><span class="text-muted">{{name}}</span></div></div>
    <div class="flash" id="flash"></div>
    <div class="pos">
        <div class="pos-left">
            <div class="card"><div class="card-body" style="overflow:visible">
                <div class="search" style="margin-bottom:8px;position:relative"><div style="display:flex;gap:6px"><input id="s" placeholder="Search name, SKU, or scan barcode..." autofocus style="flex:1"><button class="btn btn-sm btn-p" id="scBtn" onclick="toggleScanner()">Scanner On</button></div><div class="pg" id="prods"></div></div>
            </div></div>
            <div class="card" style="flex:1;overflow:hidden;display:flex;flex-direction:column"><div class="card-header"><h3>Sale Items</h3><span id="cnt" class="text-muted"></span></div>
                <div class="card-body cart" id="cart" style="overflow:auto;flex:1"><div class="cart-empty">Add items to begin</div></div>
            </div>
        </div>
        <div class="pos-right">
            <div class="card"><div class="card-body">
                <div style="display:flex;flex-direction:column;gap:6px">
                    <div style="display:flex;gap:6px;align-items:center">
                        <input id="cPhone" placeholder="Phone number..." style="flex:1" oninput="findCust()">
                        <label style="font-size:11px;color:#6b7280;white-space:nowrap;display:flex;align-items:center;gap:4px;cursor:pointer">
                            <input type="checkbox" id="walkIn" onchange="toggleWalkIn()"> Walk In
                        </label>
                    </div>
                    <input id="cName" placeholder="Customer name...">
                    <div id="sc" style="font-size:12px;color:#3b4fe2"></div>
                </div>
            </div></div>
            <div class="card"><div class="card-body totals">
                <div class="tr"><span>Subtotal</span><span id="sub">Rs 0.00</span></div>
                <div class="tr"><span>Discount</span><span><input id="disc" type="number" min="0" max="100" step="0.1" placeholder="%" oninput="calc()"> %</span></div>
                <div class="tr gt"><span>TOTAL</span><span id="tot">Rs 0.00</span></div>
            </div></div>
            <div class="card" id="cashCard" style="display:none"><div class="card-body" style="display:flex;gap:8px;align-items:flex-end">
                <div style="flex:1"><label style="font-size:10px;text-transform:uppercase;color:#6b7280;font-weight:600;display:block;margin-bottom:4px">Cash Received</label><input id="cashRec" type="number" step="0.01" min="0" oninput="calc()" style="width:100%;padding:7px 10px;border:1px solid #e2e1de;border-radius:6px;font-size:13px"></div>
                <div style="flex:1"><label style="font-size:10px;text-transform:uppercase;color:#6b7280;font-weight:600;display:block;margin-bottom:4px">Change</label><div id="changeDisplay" style="padding:7px 10px;font-size:14px;font-weight:700;color:#16a34a;background:#f3faf7;border:1px solid #bbf7d0;border-radius:6px">Rs 0.00</div></div>
            </div></div>
            <div class="card"><div class="card-body">
                <div class="pm"><button class="active" onclick="sp('cash',this)">Cash</button><button onclick="sp('credit',this)">Store Credit</button><button onclick="sp('bl',this)">BL</button><button onclick="sp('jl',this)">JL</button><button onclick="sp('z',this)">Z</button></div>
            </div></div>
            <button class="btn btn-s btn-lg" id="chg" onclick="pay()" style="justify-content:center">Charge Rs 0.00</button>
            <div style="display:flex;gap:6px">
                <button class="btn btn-ghost btn-sm" onclick="toggleReturn()" id="rtn">Return</button>
                <button class="btn btn-ghost btn-sm" onclick="toggleExchange()" id="exc">Exchange</button>
                <button class="btn btn-ghost btn-sm" onclick="clearCart()">Clear</button>
            </div>
            <input id="notes" placeholder="Notes..." style="padding:6px 10px;font-size:12px">
        </div>
    </div>
</div>
<div class="modal" id="rm"><div class="mc" style="max-width:380px"><button class="mx" onclick="cl('rm')">&times;</button><div id="rp"><div class="rec" id="rc"></div></div><div class="ra"><button class="btn btn-p btn-sm" onclick="window.print()">Print</button><button class="btn btn-sm" onclick="cl('rm')">Done</button></div></div></div>
<div class="modal" id="em"><div class="mc" style="max-width:360px;padding:0;border-radius:12px;text-align:center"><div class="card-body"><p id="em-msg" style="font-size:15px;color:#dc2626;padding:20px 0;margin:0"></p></div><div style="padding:0 20px 16px"><button class="btn btn-p btn-sm" onclick="cl('em')" style="min-width:80px">OK</button></div></div></div>
<script>
var cart=[],pm='cash',isR=false,isE=false,selC=null,walkIn=false,allP=[],hlIdx=-1,scMode=true,staffList=[],lastStaff=null;

document.getElementById('s').addEventListener('input',function(e){
    if(e.target.value.length>=1)search();else closeDropdown();
});
document.getElementById('s').addEventListener('keydown',function(e){
    var prods=document.getElementById('prods'),items=prods.querySelectorAll('.pd-item');
    if(e.key==='ArrowDown'){e.preventDefault();hlIdx=Math.min(hlIdx+1,items.length-1);highlight(items);}
    else if(e.key==='ArrowUp'){e.preventDefault();hlIdx=Math.max(hlIdx-1,0);highlight(items);}
    else if(e.key==='Enter'){
        if(scMode){scanBarcode(e.target.value);}
        else if(hlIdx>=0&&hlIdx<items.length){var it=items[hlIdx];add(parseInt(it.dataset.vid),parseFloat(it.dataset.price));}
        else if(e.target.value.length>=1)search();
    }
});
document.getElementById('s').addEventListener('blur',function(){setTimeout(closeDropdown,200)});
document.getElementById('disc').addEventListener('input',calc);

function highlight(items){items.forEach(function(el,i){el.classList.toggle('hl',i===hlIdx)});var h=items[hlIdx];if(h)h.scrollIntoView({block:'nearest'});}
function closeDropdown(){var g=document.getElementById('prods');g.innerHTML='';g.style.display='none';hlIdx=-1;}
function toggleScanner(){scMode=!scMode;var b=document.getElementById('scBtn');b.textContent=scMode?'Scanner On':'Scanner';b.className=scMode?'btn btn-sm btn-p':'btn btn-sm';if(scMode)document.getElementById('s').focus();}
function scanBarcode(code){if(!code)return;
fetch('/api/products/search?q='+encodeURIComponent(code)).then(function(r){return r.json()}).then(function(d){
if(d.length===1){closeDropdown();add(d[0].vid,d[0].price);}
else if(d.length>1){allP=d;renderP(d);f('Multiple products found');}
else{f('No product found');}
}).catch(function(){f('Search failed');});}
function search(){fetch('/api/products/search?q='+encodeURIComponent(document.getElementById('s').value)).then(function(r){return r.json()}).then(function(d){allP=d;renderP(d)}).catch(function(){allP=[];});}
function renderP(l){var g=document.getElementById('prods');hlIdx=-1;if(!l.length){g.style.display='none';g.innerHTML='';return;}
g.style.display='block';g.innerHTML=l.map(function(p,i){return'<div class="pd-item" data-vid="'+p.vid+'" data-price="'+p.price+'"><div class="pd-name">'+p.name+'</div><div class="pd-detail">'+(p.size||'')+' '+(p.color||'')+' | '+p.sku+' &middot; '+p.stock+' in stock</div><div class="pd-price">Rs '+p.price.toFixed(2)+'</div></div>';}).join('');}
document.getElementById('prods').addEventListener('click',function(e){
    var item=e.target.closest('.pd-item');if(!item)return;
    add(parseInt(item.dataset.vid),parseFloat(item.dataset.price));
});
function add(vid,pr){if(vid==null||isNaN(vid))return;
var e=cart.find(function(x){return x.vid===vid});if(e&&!isR&&!isE){e.qty++;renderC();closeDropdown();document.getElementById('s').value='';document.getElementById('s').focus();return;}
var p=allP.find(function(x){return x.vid===vid});if(!p){f('Product not found');return;}

cart.push({vid:vid,pname:p.name,sku:p.sku,variant:(p.size||'')+' '+(p.color||''),price:pr||p.price,qty:1,disc:0,staff:lastStaff});renderC();
closeDropdown();document.getElementById('s').value='';document.getElementById('s').focus();}
function imgPH(n){return'<div style="width:32px;height:32px;background:#e2e1de;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;color:#6b7280;font-weight:600;flex-shrink:0">'+(n.charAt(0).toUpperCase()||'?')+'</div>';}
function renderC(){const el=document.getElementById('cart'),cnt=document.getElementById('cnt');let n=0,h='';
if(isR)h+='<div class="rb">RETURN MODE</div>';if(isE)h+='<div class="rb" style="background:#fffbeb;color:#b45309;border:1px solid #fde68a">EXCHANGE MODE (10% deduction)</div>';
if(!cart.length){el.innerHTML=h+'<div class="cart-empty">Add items to begin</div>';cnt.textContent='';calc();return;}
h+='<table class="ct"><thead><tr><th></th><th>SKU</th><th>Staff</th><th>Disc%</th><th>Product</th><th>Price</th><th>Qty</th><th>Net Total</th><th></th></tr></thead><tbody>';
cart.forEach(function(c,i){
n+=Math.abs(c.qty);var net=c.qty*c.price*(1-(c.disc||0)/100);
var sopts=staffList.map(function(s){return'<option value="'+s.id+'"'+(s.id==c.staff?' selected':'')+'>'+s.name+'</option>';}).join('');
h+='<tr><td>'+imgPH(c.pname)+'</td><td style="font-size:10px;color:#6b7280">'+(c.sku||'-')+'</td>'
+'<td><select onchange="setStaff('+i+',this.value)" style="font-size:10px;padding:2px;max-width:80px">'+sopts+'</select></td>'
+'<td><input type="number" value="'+(c.disc||0)+'" min="0" max="100" step="0.1" onchange="setDisc('+i+',this.value)" style="width:40px;font-size:11px;padding:2px"></td>'
+'<td style="font-size:12px;font-weight:600">'+c.pname+(c.variant?' <span style="color:#6b7280;font-size:10px">('+c.variant+')</span>':'')+'</td><td style="font-size:11px">Rs '+c.price.toFixed(2)+'</td>'
+'<td><input type="number" value="'+c.qty+'" min="'+(isR||isE?-99:1)+'" onchange="uq('+i+',this.value)" style="width:40px;font-size:11px;padding:2px"></td>'
+'<td style="font-size:11px;font-weight:600">Rs '+net.toFixed(2)+'</td>'
+'<td><button class="rm" onclick="ri('+i+')">&times;</button></td></tr>';});
h+='</tbody></table>';el.innerHTML=h;cnt.textContent=n+' items';calc();}
function uq(i,v){v=parseInt(v);if(!v||v===0){cart.splice(i,1);}else{cart[i].qty=v;}renderC();}
function ri(i){cart.splice(i,1);renderC();}
function setStaff(i,v){if(cart[i]){cart[i].staff=v?parseInt(v):null;lastStaff=cart[i].staff;}}
function setDisc(i,v){if(cart[i]){cart[i].disc=parseFloat(v)||0;renderC();}}
function clearCart(){if(!cart.length)return;if(!confirm('Clear?'))return;cart=[];isR=false;isE=false;selC=null;walkIn=false;
document.getElementById('sc').innerHTML='';document.getElementById('cPhone').value='';document.getElementById('cName').value='';document.getElementById('cName').readOnly=false;document.getElementById('cName').disabled=false;document.getElementById('cPhone').disabled=false;document.getElementById('walkIn').checked=false;document.getElementById('notes').value='';
document.getElementById('disc').value='';document.getElementById('rtn').textContent='Return';document.getElementById('rtn').className='btn btn-ghost btn-sm';
document.getElementById('exc').textContent='Exchange';document.getElementById('exc').className='btn btn-ghost btn-sm';renderC();search();}
function toggleReturn(){isR=!isR;if(isR)isE=false;const b=document.getElementById('rtn');
b.textContent=isR?'Sale':'Return';b.className=isR?'btn btn-d btn-sm':'btn btn-ghost btn-sm';renderC();}
function toggleExchange(){isE=!isE;if(isE)isR=false;const b=document.getElementById('exc');
b.textContent=isE?'Sale':'Exchange';b.className=isE?'btn btn-w btn-sm':'btn btn-ghost btn-sm';renderC();}
function calc(){const sub=cart.reduce(function(s,c){return s+c.qty*c.price*(1-(c.disc||0)/100);},0);const dp=parseFloat(document.getElementById('disc').value)||0;
const d=sub*dp/100;const tot=Math.max(0,sub-d);
document.getElementById('sub').textContent='Rs '+sub.toFixed(2);
document.getElementById('tot').textContent='Rs '+tot.toFixed(2);
var cashRec=parseFloat(document.getElementById('cashRec').value)||0;
var chg=Math.max(0,cashRec-tot);
document.getElementById('changeDisplay').textContent='Rs '+chg.toFixed(2);
var btn=document.getElementById('chg');
if(pm==='cash'&&cashRec>0){btn.textContent=(isR?'Refund ':(isE?'Exchange ':'Charge '))+'Rs '+tot.toFixed(2)+' \u2022 Change Rs '+chg.toFixed(2);}
else{btn.textContent=(isR?'Refund ':(isE?'Exchange ':'Charge '))+'Rs '+tot.toFixed(2);}}
function sp(m,b){pm=m;document.querySelectorAll('.pm button').forEach(x=>x.classList.remove('active'));b.classList.add('active');
document.getElementById('cashCard').style.display=m==='cash'?'':'none';calc();}
function pay(){if(!cart.length){f('Cart empty');return;}
var cnm=document.getElementById('cName').value.trim(),cph=document.getElementById('cPhone').value.trim();
if(!walkIn&&!selC&&!cnm){f('Please select or add a customer');return;}
const items=cart.map(c=>({variant_id:c.vid,quantity:isR||isE?-Math.abs(c.qty):c.qty,price:c.price}));
const btn=document.getElementById('chg');btn.disabled=true;btn.textContent='Processing...';
fetch('/api/sale',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({items,payment:pm,discount:parseFloat(document.getElementById('disc').value)||0,
is_return:isR,is_exchange:isE,customer_id:selC?selC.id:null,customer_name:walkIn?'Walk In':(document.getElementById('cName').value.trim()||(selC?selC.name:'')),customer_phone:document.getElementById('cPhone').value.trim(),walk_in:walkIn,notes:document.getElementById('notes').value})})
.then(r=>r.json()).then(d=>{if(d.error){f(d.error);btn.disabled=false;btn.textContent='Charge Rs 0.00';return;}
showR(d);cart=[];isR=false;isE=false;selC=null;walkIn=false;document.getElementById('sc').innerHTML='';document.getElementById('cPhone').value='';document.getElementById('cName').value='';document.getElementById('cName').readOnly=false;document.getElementById('cName').disabled=false;document.getElementById('cPhone').disabled=false;document.getElementById('walkIn').checked=false;
    document.getElementById('notes').value='';document.getElementById('disc').value='';document.getElementById('cashRec').value='';document.getElementById('changeDisplay').textContent='Rs 0.00';document.getElementById('cashCard').style.display='none';document.getElementById('rtn').textContent='Return';document.getElementById('rtn').className='btn btn-ghost btn-sm';
document.getElementById('exc').textContent='Exchange';document.getElementById('exc').className='btn btn-ghost btn-sm';renderC();btn.disabled=false;document.getElementById('s').value='';closeDropdown();document.getElementById('s').focus();})
.catch(()=>{f('Sale failed');btn.disabled=false;});}
function showR(d){let h='<div class="rh"><h3>JITM Baby Garments</h3><p>'+new Date().toLocaleString()+'</p><p style="font-size:11px">'+d.receipt+'</p></div><div class="ri">';
d.items.forEach(i=>{h+='<div class="rl"><span>'+i.quantity+'x '+i.product_name+(i.variant_label?' ('+i.variant_label+')':'')+'</span><span>Rs '+i.total.toFixed(2)+'</span></div>';});
h+='</div><div class="rl"><span>Subtotal</span><span>Rs '+d.subtotal.toFixed(2)+'</span></div>';
if(d.discount>0)h+='<div class="rl"><span>Discount</span><span>-Rs '+d.discount.toFixed(2)+'</span></div>';
h+='<div class="rl" style="font-weight:700;font-size:15px"><span>TOTAL</span><span>Rs '+d.total.toFixed(2)+'</span></div>'+
'<div class="rl"><span>Paid: '+d.payment+'</span></div>'+(d.customer_name?'<div class="rl"><span>Customer: '+d.customer_name+'</span></div>':'')+
'<div class="rl"><span>Staff: '+d.staff_name+'</span></div>'+(d.is_return?'<div class="rl" style="color:#dc2626">RETURN</div>':'')+(d.is_exchange?'<div class="rl" style="color:#d97706">EXCHANGE</div>':'')+
'<div style="text-align:center;margin-top:12px;font-size:11px;color:#9ca3af">Thank you!<br>Returns within 30 days</div>';
document.getElementById('rc').innerHTML=h;document.getElementById('rm').classList.add('show');}
function findCust(){var ph=document.getElementById('cPhone').value.trim();if(ph.length<3){selC=null;document.getElementById('sc').innerHTML='';return;}
fetch('/api/customers?q='+encodeURIComponent(ph)).then(r=>r.json()).then(function(list){var match=list.find(function(c){return c.phone===ph;});if(match){selC={id:match.id,name:match.name,phone:match.phone};document.getElementById('cName').value=match.name;document.getElementById('cName').readOnly=true;document.getElementById('sc').innerHTML='Customer: '+match.name+' | Credit: Rs '+match.credit.toFixed(2);}else{selC=null;document.getElementById('cName').readOnly=false;document.getElementById('sc').innerHTML='<span style=\"color:#6b7280\">New customer</span>';}});}
function toggleWalkIn(){walkIn=document.getElementById('walkIn').checked;document.getElementById('cPhone').disabled=walkIn;document.getElementById('cName').disabled=walkIn;if(walkIn){document.getElementById('cName').value='';document.getElementById('sc').innerHTML='Walk In Customer';selC=null;}else{document.getElementById('sc').innerHTML='';}}
function f(m){document.getElementById('em-msg').textContent=m;document.getElementById('em').classList.add('show');}
function cl(id){document.getElementById(id).classList.remove('show');}
window.onclick=function(e){document.querySelectorAll('.modal').forEach(m=>{if(e.target===m)m.classList.remove('show');});};
document.getElementById('s').focus();
document.addEventListener('keydown',function(e){var t=(e.target||{}).tagName;if(t==='INPUT'||t==='TEXTAREA'||t==='SELECT')return;if(document.querySelector('.modal.show'))return;document.getElementById('s').focus();});
fetch('/api/staff').then(function(r){return r.json()}).then(function(d){staffList=d;renderC();});
</script></body></html>
