<!DOCTYPE html>
<html>
<head>
    <title>JITM · Purchase Invoices</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .bdg {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .bdg-ok { background: #d4edda; color: #155724; }
        .bdg-warn { background: #fff3cd; color: #856404; }
        .bdg-err { background: #f8d7da; color: #721c24; }
        .bdg-over { background: #cfe2ff; color: #084298; }
        .bdg-due-soon { background: #fff3cd; color: #856404; }
        .bdg-due-ok { background: #d4edda; color: #155724; }
        .bdg-due-late { background: #f8d7da; color: #721c24; }
        .bdg-due-na { background: #e2e3e5; color: #6c757d; }
        .text-right { text-align: right; }
        .due-cell {
            font-size: 12px;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    {{sidebar|safe}}
    <div class="main">
        <div class="topbar">
            <h2>Purchase Invoices</h2>
            <div class="actions">
                {% if role == 'manager' %}
                    <a class="btn btn-p btn-sm" href="/purchase-invoices/create" target="_blank">+ Add Invoice</a>
                {% endif %}
                <span class="text-muted">{{name}}</span>
            </div>
        </div>
        <div class="content">
            <div class="search">
                <input id="s" placeholder="Search invoices..." oninput="load(1)">
                <input type="date" id="df" onchange="load(1)" style="width:140px">
                <input type="date" id="dt" onchange="load(1)" style="width:140px">
                <button class="btn btn-sm" onclick="clearDates()">Clear</button>
            </div>
            <div class="pagination" id="pagination-top"></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortCol(0)" style="cursor:pointer;user-select:none"># <span id="si0"></span></th>
                            <th onclick="sortCol(1)" style="cursor:pointer;user-select:none">Invoice No. <span id="si1"></span></th>
                            <th onclick="sortCol(2)" style="cursor:pointer;user-select:none">Issue Date <span id="si2"></span></th>
                            <th onclick="sortCol(3)" style="cursor:pointer;user-select:none">Supplier <span id="si3"></span></th>
                            <th onclick="sortCol(4)" class="text-right" style="cursor:pointer;user-select:none">Invoice Amount <span id="si4"></span></th>
                            <th onclick="sortCol(5)" class="text-right" style="cursor:pointer;user-select:none">Balance Due <span id="si5"></span></th>
                            <th onclick="sortCol(6)" style="cursor:pointer;user-select:none">Status <span id="si6"></span></th>
                            <th onclick="sortCol(7)" style="cursor:pointer;user-select:none">Due <span id="si7"></span></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tb"></tbody>
                    <tfoot id="tf" style="font-weight:600;font-size:13px;border-top:2px solid #d1d5db"></tfoot>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
            <div style="margin-top:12px;text-align:right">
                <button class="btn btn-sm btn-print" onclick="printTable()">Print</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="am">
        <div class="mc">
            <button class="mx" onclick="cl('am')">&times;</button>
            <h2>Add Purchase Invoice</h2>
            <form onsubmit="savePI(event)">
                <label>Invoice No.</label>
                <input id="pin" required>
                <label>Issue Date</label>
                <input id="pid" type="date">
                <label>Due Date</label>
                <input id="pdd" type="date">
                <label>Supplier</label>
                <select id="pis">
                    <option value="">-- Select --</option>
                </select>
                <label>Invoice Amount (Rs)</label>
                <input id="pia" type="number" step="0.01" min="0" value="0" oninput="calcBalance()">
                <label>Balance Due (Rs)</label>
                <input id="pbd" type="number" step="0.01" min="0" value="0">
                <label>Status</label>
                <select id="pst">
                    <option value="Unpaid">Unpaid</option>
                    <option value="Partial">Partial</option>
                    <option value="Paid">Paid</option>
                    <option value="Overpaid">Overpaid</option>
                </select>
                <button class="btn btn-p" type="submit">Save</button>
            </form>
        </div>
    </div>
    
    <div class="modal" id="em">
        <div class="mc">
            <button class="mx" onclick="cl('em')">&times;</button>
            <h2>Edit Purchase Invoice</h2>
            <form onsubmit="editPI(event)">
                <label>Invoice No.</label>
                <input id="ein" required>
                <label>Issue Date</label>
                <input id="eid" type="date">
                <label>Due Date</label>
                <input id="edd" type="date">
                <label>Supplier</label>
                <select id="eis">
                    <option value="">-- Select --</option>
                </select>
                <label>Invoice Amount (Rs)</label>
                <input id="eia" type="number" step="0.01" min="0" value="0" oninput="calcEditBalance()">
                <label>Balance Due (Rs)</label>
                <input id="ebd" type="number" step="0.01" min="0" value="0">
                <label>Status</label>
                <select id="est">
                    <option value="Unpaid">Unpaid</option>
                    <option value="Partial">Partial</option>
                    <option value="Paid">Paid</option>
                    <option value="Overpaid">Overpaid</option>
                </select>
                <button class="btn btn-p" type="submit">Update</button>
            </form>
        </div>
    </div>
    
    <script>
        var piList = [], sortIdx = -1, sortDir = 1, editId = null, suppliers = [], currentPage = 1, totalPages = 1, perPage = 50, showAll = false;
        
        function statusBadge(s) {
            if (s === 'Paid') return '<span class="bdg bdg-ok">Paid</span>';
            if (s === 'Partial') return '<span class="bdg bdg-warn">Partial</span>';
            if (s === 'Overpaid') return '<span class="bdg bdg-over">Overpaid</span>';
            return '<span class="bdg bdg-err">Unpaid</span>';
        }
        
        function overpaidAmount(p) {
            if (p.status !== 'Overpaid') return 0;
            return (p.invoice_amount || 0) - (p.balance_due || 0);
        }
        
        function statusCell(p) {
            var html = statusBadge(p.status);
            if (p.status === 'Overpaid') {
                html += '<div style="font-size:11px;color:#084298;margin-top:2px">+Rs ' + overpaidAmount(p).toFixed(2) + '</div>';
            }
            return html;
        }
        
        function dueInfo(p) {
            if (!p.due_date) return '<span class="due-cell bdg-due-na">No due date</span>';
            var due = new Date(p.due_date);
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var diff = Math.round((due - today) / (1000 * 60 * 60 * 24));
            
            if (diff > 0) {
                var cls = diff <= 7 ? 'bdg-due-soon' : 'bdg-due-ok';
                return '<span class="due-cell ' + cls + '">' + diff + ' day' + (diff === 1 ? '' : 's') + ' left</span>';
            }
            if (diff === 0) return '<span class="due-cell bdg-due-soon">Due today</span>';
            
            var late = Math.abs(diff);
            return '<span class="due-cell bdg-due-late">' + late + ' day' + (late === 1 ? '' : 's') + ' overdue</span>';
        }
        
        function load(page) {
            var q = document.getElementById('s').value.toLowerCase();
            var df = document.getElementById('df').value;
            var dt = document.getElementById('dt').value;
            currentPage = page || 1;
            var url = '/api/purchase-invoices?page=' + currentPage + '&per_page=' + (showAll ? 100000 : perPage);
            if (df) url += '&date_from=' + df;
            if (dt) url += '&date_to=' + dt;
            fetch(url)
                .then(r => r.json())
                .then(d => {
                    piList = d.items || [];
                    totalPages = d.total_pages || 1;
                    render(piList.filter(function(p) {
                        return !q || 
                            (p.invoice_no || '').toLowerCase().includes(q) ||
                            (p.supplier_name || '').toLowerCase().includes(q) ||
                            (p.status || '').toLowerCase().includes(q);
                    }));
                    renderPagination();
                });
        }
        
        function clearDates() {
            document.getElementById('df').value = '';
            document.getElementById('dt').value = '';
            load(1);
        }
        
        function toggleShowAll() {
            showAll = !showAll;
            currentPage = 1;
            load();
        }
        function goToPage(p) {
            p = parseInt(p);
            if (p >= 1 && p <= totalPages) load(p);
        }
        function renderPagination() {
            var html = '';
            if (totalPages > 1) {
                html += '<button class="btn btn-sm" onclick="load(1)"' + (currentPage <= 1 ? ' disabled' : '') + '>« First</button>';
                html += '<button class="btn btn-sm" onclick="load(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '>← Prev</button>';
                html += '<input type="number" id="pg" value="' + currentPage + '" min="1" max="' + totalPages + '" onchange="goToPage(this.value)" style="width:50px;text-align:center;padding:2px 4px;font-size:13px;border:1px solid #ddd;border-radius:4px">';
                html += '<span style="margin:0 4px;color:#6b7280;font-size:13px">/ ' + totalPages + '</span>';
                html += '<button class="btn btn-sm" onclick="load(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>Next →</button>';
                html += '<button class="btn btn-sm" onclick="load(' + totalPages + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>Last »</button>';
            }
            html += ' <button class="btn btn-sm" onclick="toggleShowAll()">' + (showAll ? 'Paginated' : 'Show All') + '</button>';
            document.getElementById('pagination').innerHTML = html;
            document.getElementById('pagination-top').innerHTML = html;
        }
        
        function render(l) {
            document.getElementById('tb').innerHTML = l.map((p, i) => 
                '<tr>' +
                '<td style="color:#6b7280;font-size:12px">' + ((currentPage - 1) * perPage + i + 1) + '</td>' +
                '<td style="font-weight:600">' + p.invoice_no + '</td>' +
                '<td>' + (p.issue_date || '') + '</td>' +
                '<td>' + (p.supplier_name ? '<a href="/ledger/supplier/' + p.supplier_id + '" style="text-decoration:none;color:inherit">' + p.supplier_name + '</a>' : '-') + '</td>' +
                '<td class="text-right">Rs ' + (p.invoice_amount || 0).toFixed(2) + '</td>' +
                '<td class="text-right">Rs ' + (p.balance_due || 0).toFixed(2) + '</td>' +
                '<td>' + statusCell(p) + '</td>' +
                '<td>' + dueInfo(p) + '</td>' +
                '<td>' +
                '<button class="btn btn-xs btn-ghost" onclick="viewPI(' + p.id + ')">View</button>' +
                '<button class="btn btn-xs btn-ghost" onclick="window.open(\'/inventory/barcode?invoice_id=' + p.id + '\',\'_blank\')">Barcodes</button>' +
                ({{role|tojson}} == 'manager' ? 
                    '<button class="btn btn-xs btn-ghost" onclick="window.open(\'/purchase-invoices/create?id=' + p.id + '\',\'_blank\')">Edit</button>' +
                    '<button class="btn btn-xs btn-ghost" onclick="del(' + p.id + ')">Delete</button>' : '') +
                '</td>' +
                '</tr>'
            ).join('');
            
            var ta = 0, td = 0;
            l.forEach(function(p) {
                ta += p.invoice_amount || 0;
                td += p.balance_due || 0;
            });
            
            document.getElementById('tf').innerHTML = 
                '<tr>' +
                '<td colspan="4" class="text-right" style="padding:6px 8px">Total</td>' +
                '<td class="text-right" style="padding:6px 8px">Rs ' + ta.toFixed(2) + '</td>' +
                '<td class="text-right" style="padding:6px 8px">Rs ' + td.toFixed(2) + '</td>' +
                '<td></td>' +
                '<td></td>' +
                '<td></td>' +
                '</tr>';
        }
        
        function sortCol(i) {
            if (sortIdx === i) { sortDir *= -1; } else { sortIdx = i; sortDir = 1; }
            for (let j = 0; j < 8; j++) document.getElementById('si' + j).textContent = '';
            document.getElementById('si' + i).textContent = sortDir === 1 ? ' ▲' : ' ▼';
            
            const vals = [
                () => 0,
                p => (p.invoice_no || '').toLowerCase(),
                p => (p.issue_date || ''),
                p => (p.supplier_name || '').toLowerCase(),
                p => p.invoice_amount || 0,
                p => p.balance_due || 0,
                p => (p.status || '').toLowerCase(),
                p => {
                    if (!p.due_date) return 99999;
                    return (new Date(p.due_date) - new Date()) / (1000 * 60 * 60 * 24);
                }
            ];
            
            piList.sort((a, b) => {
                const va = vals[i](a), vb = vals[i](b);
                return va < vb ? -sortDir : va > vb ? sortDir : 0;
            });
            
            var q = document.getElementById('s').value.toLowerCase();
            render(piList.filter(function(p) {
                return !q || 
                    (p.invoice_no || '').toLowerCase().includes(q) ||
                    (p.supplier_name || '').toLowerCase().includes(q) ||
                    (p.status || '').toLowerCase().includes(q);
            }));
        }
        
        function loadSuppliers(selId) {
            fetch('/api/suppliers')
                .then(r => r.json())
                .then(d => {
                    suppliers = d.items || d;
                    const opts = '<option value="">-- Select --</option>' + suppliers.map(s => 
                        '<option value="' + s.id + '">' + s.name + '</option>'
                    ).join('');
                    document.getElementById(selId).innerHTML = opts;
                });
        }
        
        function calcBalance() {
            var amt = parseFloat(document.getElementById('pia').value) || 0;
            document.getElementById('pbd').value = amt.toFixed(2);
        }
        
        function calcEditBalance() {
            var amt = parseFloat(document.getElementById('eia').value) || 0;
            document.getElementById('ebd').value = amt.toFixed(2);
        }
        
        function showAdd() {
            document.getElementById('am').classList.add('show');
            document.getElementById('pin').value = '';
            document.getElementById('pid').value = new Date().toISOString().slice(0, 10);
            document.getElementById('pdd').value = '';
            document.getElementById('pia').value = '0';
            document.getElementById('pbd').value = '0.00';
            document.getElementById('pst').value = 'Unpaid';
            loadSuppliers('pis');
        }
        
        function savePI(e) {
            e.preventDefault();
            const invoice_no = document.getElementById('pin').value.trim();
            if (!invoice_no) return;
            
            fetch('/api/purchase-invoices', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    invoice_no: invoice_no,
                    issue_date: document.getElementById('pid').value,
                    due_date: document.getElementById('pdd').value,
                    supplier_id: document.getElementById('pis').value || null,
                    invoice_amount: document.getElementById('pia').value || 0,
                    balance_due: document.getElementById('pbd').value || 0,
                    status: document.getElementById('pst').value
                })
            })
            .then(r => r.json())
            .then(d => {
                if (d.error) { alert(d.error); return; }
                cl('am');
                load();
            });
        }
        
        function showEdit(id) {
            const p = piList.find(x => x.id === id);
            if (!p) return;
            editId = id;
            document.getElementById('ein').value = p.invoice_no;
            document.getElementById('eid').value = p.issue_date;
            document.getElementById('edd').value = p.due_date || '';
            document.getElementById('eia').value = p.invoice_amount;
            document.getElementById('ebd').value = p.balance_due;
            document.getElementById('est').value = p.status;
            loadSuppliers('eis');
            
            var sel = document.getElementById('eis');
            setTimeout(function() {
                if (p.supplier_id && [...sel.options].some(o => o.value == String(p.supplier_id))) {
                    sel.value = p.supplier_id;
                }
            }, 100);
            
            document.getElementById('em').classList.add('show');
        }
        
        function editPI(e) {
            e.preventDefault();
            const invoice_no = document.getElementById('ein').value.trim();
            if (!invoice_no) return;
            
            fetch('/api/purchase-invoices/' + editId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    invoice_no: invoice_no,
                    issue_date: document.getElementById('eid').value,
                    due_date: document.getElementById('edd').value,
                    supplier_id: document.getElementById('eis').value || null,
                    invoice_amount: document.getElementById('eia').value || 0,
                    balance_due: document.getElementById('ebd').value || 0,
                    status: document.getElementById('est').value
                })
            })
            .then(r => r.json())
            .then(d => {
                if (d.error) { alert(d.error); return; }
                cl('em');
                load();
            });
        }
        
        function del(id) {
            if (!confirm('Delete this purchase invoice?')) return;
            fetch('/api/purchase-invoices/' + id, { method: 'DELETE' })
                .then(r => r.json())
                .then(() => load());
        }
        
        function viewPI(id) {
            window.location = '/purchase-invoices/' + id;
        }
        
        load();
        
        function cl(id) {
            document.getElementById(id).classList.remove('show');
        }
        
        window.onclick = function(e) {
            document.querySelectorAll('.modal').forEach(m => {
                if (e.target === m) m.classList.remove('show');
            });
        };
        
        function printTable() {
            document.body.classList.add('printing');
            window.print();
        }
        
        window.addEventListener('afterprint', function() {
            document.body.classList.remove('printing');
        });
    </script>
</body>
</html>
