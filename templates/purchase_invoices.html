<!DOCTYPE html>
<html>
<head>
    <title>JITM · Purchase Invoices</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .sup-pg { display: none; position: absolute; top: 100%; left: 0; right: 0; z-index: 50; background: #fff; border: 1px solid #e2e1de; border-radius: 8px; max-height: 300px; overflow-y: auto; box-shadow: 0 4px 12px rgba(0, 0, 0, .1); margin-top: 4px; }
        .sup-item { padding: 10px 14px; cursor: pointer; border-bottom: 1px solid #f3f2ef; }
        .sup-item:last-child { border-bottom: none; }
        .sup-item.hl { background: #f0effc; }
        .sup-name { font-size: 13px; font-weight: 600; color: #1a1c2e; }
        .sup-detail { font-size: 11px; color: #6b7280; }
        .bdg {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .bdg-ok { background: #d4edda; color: #155724; }
        .bdg-warn { background: #fff3cd; color: #856404; }
        .bdg-err { background: #f8d7da; color: #721c24; }
        .bdg-over { background: #cfe2ff; color: #084298; }
        .bdg-due-soon { background: #fff3cd; color: #856404; }
        .bdg-due-ok { background: #d4edda; color: #155724; }
        .bdg-due-late { background: #f8d7da; color: #721c24; }
        .bdg-due-na { background: #e2e3e5; color: #6c757d; }
        .text-right { text-align: right; }
        .due-cell {
            font-size: 12px;
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .party-field { display: none; }
    </style>
</head>
<body>
    {{sidebar|safe}}
    <div class="main">
        <div class="topbar">
            <h2>Purchase Invoices</h2>
            <div class="actions">
                {% if role == 'manager' or role == 'owner' %}
                    <a class="btn btn-p btn-sm" href="/purchase-invoices/create" target="_blank">+ Add Invoice</a>
                {% endif %}
                <span class="text-muted">{{name}}</span>
            </div>
        </div>
        <div class="content">
            <div class="search">
                <input id="s" placeholder="Search invoices..." oninput="load(1)">
                <input type="date" id="df" onchange="load(1)" style="width:140px">
                <input type="date" id="dt" onchange="load(1)" style="width:140px">
                <button class="btn btn-sm" onclick="clearDates()">Clear</button>
            </div>
            <div class="pagination" id="pagination-top"></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortCol(0)" style="cursor:pointer;user-select:none"># <span id="si0"></span></th>
                            <th onclick="sortCol(1)" style="cursor:pointer;user-select:none">Invoice No. <span id="si1"></span></th>
                            <th onclick="sortCol(2)" style="cursor:pointer;user-select:none">Issue Date <span id="si2"></span></th>
                            <th onclick="sortCol(3)" style="cursor:pointer;user-select:none">Supplier <span id="si3"></span></th>
                            <th onclick="sortCol(4)" class="text-right" style="cursor:pointer;user-select:none">Invoice Amount <span id="si4"></span></th>
                            <th onclick="sortCol(5)" class="text-right" style="cursor:pointer;user-select:none">Balance Due <span id="si5"></span></th>
                            <th onclick="sortCol(6)" style="cursor:pointer;user-select:none">Status <span id="si6"></span></th>
                            <th onclick="sortCol(7)" style="cursor:pointer;user-select:none">Due <span id="si7"></span></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tb"></tbody>
                    <tfoot id="tf" style="font-weight:600;font-size:13px;border-top:2px solid #d1d5db"></tfoot>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
            <div style="margin-top:12px;text-align:right">
                <button class="btn btn-sm btn-print" onclick="printTable()">Print</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="am">
        <div class="mc">
            <button class="mx" onclick="cl('am')">&times;</button>
            <h2>Add Purchase Invoice</h2>
            <form onsubmit="savePI(event)">
                <label>Invoice No.</label>
                <input id="pin" required>
                <label>Issue Date</label>
                <input id="pid" type="date" onchange="recalcDueDate('pid','pdd','pddb')">
                <label>Due Date</label>
                <input id="pdd" type="date">
                <input id="pddb" type="number" min="0" placeholder="Due by (days)" oninput="recalcDueDate('pid','pdd','pddb')">
                <label>Supplier</label>
                <div style="position:relative">
                    <input type="text" id="pis_search" placeholder="Search supplier..." autocomplete="off" oninput="supSearch('pis')" onfocus="supSearch('pis')" onkeydown="supKey('pis',event)" onblur="setTimeout(function(){supClose('pis')},200)">
                    <div class="sup-pg" id="pis_list"></div>
                    <input type="hidden" id="pis">
                </div>
                <label>Invoice Amount (Rs)</label>
                <input id="pia" type="number" step="0.01" min="0" value="0" oninput="calcBalance()">
                <label>Balance Due (Rs)</label>
                <input id="pbd" type="number" step="0.01" min="0" value="0">
                <label>Status</label>
                <select id="pst">
                    <option value="Unpaid">Unpaid</option>
                    <option value="Partial">Partial</option>
                    <option value="Paid">Paid</option>
                    <option value="Overpaid">Overpaid</option>
                </select>
                <button class="btn btn-p" type="submit">Save</button>
            </form>
        </div>
    </div>
    
    <div class="modal" id="em">
        <div class="mc">
            <button class="mx" onclick="cl('em')">&times;</button>
            <h2>Edit Purchase Invoice</h2>
            <form onsubmit="editPI(event)">
                <label>Invoice No.</label>
                <input id="ein" required>
                <label>Issue Date</label>
                <input id="eid" type="date" onchange="recalcDueDate('eid','edd','eddb')">
                <label>Due Date</label>
                <input id="edd" type="date">
                <input id="eddb" type="number" min="0" placeholder="Due by (days)" oninput="recalcDueDate('eid','edd','eddb')">
                <label>Supplier</label>
                <div style="position:relative">
                    <input type="text" id="eis_search" placeholder="Search supplier..." autocomplete="off" oninput="supSearch('eis')" onfocus="supSearch('eis')" onkeydown="supKey('eis',event)" onblur="setTimeout(function(){supClose('eis')},200)">
                    <div class="sup-pg" id="eis_list"></div>
                    <input type="hidden" id="eis">
                </div>
                <label>Invoice Amount (Rs)</label>
                <input id="eia" type="number" step="0.01" min="0" value="0" oninput="calcEditBalance()">
                <label>Balance Due (Rs)</label>
                <input id="ebd" type="number" step="0.01" min="0" value="0">
                <label>Status</label>
                <select id="est">
                    <option value="Unpaid">Unpaid</option>
                    <option value="Partial">Partial</option>
                    <option value="Paid">Paid</option>
                    <option value="Overpaid">Overpaid</option>
                </select>
                <button class="btn btn-p" type="submit">Update</button>
            </form>
        </div>
    </div>

    <div class="modal" id="paym">
        <div class="mc">
            <button class="mx" onclick="cl('paym')">&times;</button>
            <h2>Pay Purchase Invoice</h2>
            <form onsubmit="paySave(event)">
                <label>Date</label>
                <input id="payd" type="date">
                <label>Account</label>
                <select class="dd" id="paya"></select>
                <label>Paid To</label>
                <select id="paypt" onchange="payToggleParty()">
                    <option value="supplier">Supplier</option>
                    <option value="expense">Expenses</option>
                    <option value="other">Other</option>
                </select>
                <div id="payparty_select" class="party-field">
                    <label>Supplier</label>
                    <select class="dd" id="payparty" onchange="loadPayInvoices()"></select>
                </div>
                <div id="payinv_select" class="party-field">
                    <label>Invoice</label>
                    <select class="dd" id="payinv"><option value="">-- Auto-apply to oldest --</option></select>
                </div>
                <div id="payexpense_select" class="party-field">
                    <label>Expense Category</label>
                    <select class="dd" id="payexp"></select>
                </div>
                <div id="paydesc_field" class="party-field">
                    <label>Description</label>
                    <input id="paydesc">
                </div>
                <label>Amount (Rs)</label>
                <input id="payam" type="number" step="0.01" min="0" required>
                <button class="btn btn-p" type="submit">Save Payment</button>
            </form>
        </div>
    </div>
    
    <script>
        var piList = [], sortIdx = -1, sortDir = 1, editId = null, suppliers = [], currentPage = 1, totalPages = 1, perPage = 50, showAll = false;
        
        function statusBadge(s) {
            if (s === 'Paid') return '<span class="bdg bdg-ok">Paid</span>';
            if (s === 'Partial') return '<span class="bdg bdg-warn">Partial</span>';
            if (s === 'Overpaid') return '<span class="bdg bdg-over">Overpaid</span>';
            return '<span class="bdg bdg-err">Unpaid</span>';
        }
        
        function overpaidAmount(p) {
            if (p.status !== 'Overpaid') return 0;
            return (p.invoice_amount || 0) - (p.balance_due || 0);
        }
        
        function statusCell(p) {
            var html = statusBadge(p.status);
            if (p.status === 'Overpaid') {
                html += '<div style="font-size:11px;color:#084298;margin-top:2px">+Rs ' + overpaidAmount(p).toFixed(2) + '</div>';
            }
            return html;
        }
        
        function dueInfo(p) {
            if (!p.due_date) return '<span class="due-cell bdg-due-na">No due date</span>';
            var due = new Date(p.due_date);
            var today = new Date();
            today.setHours(0, 0, 0, 0);
            var diff = Math.round((due - today) / (1000 * 60 * 60 * 24));
            
            if (diff > 0) {
                var cls = diff <= 7 ? 'bdg-due-soon' : 'bdg-due-ok';
                return '<span class="due-cell ' + cls + '">' + diff + ' day' + (diff === 1 ? '' : 's') + ' left</span>';
            }
            if (diff === 0) return '<span class="due-cell bdg-due-soon">Due today</span>';
            
            var late = Math.abs(diff);
            return '<span class="due-cell bdg-due-late">' + late + ' day' + (late === 1 ? '' : 's') + ' overdue</span>';
        }
        
        function load(page) {
            var q = document.getElementById('s').value.toLowerCase();
            var df = document.getElementById('df').value;
            var dt = document.getElementById('dt').value;
            currentPage = page || 1;
            var url = '/api/purchase-invoices?page=' + currentPage + '&per_page=' + (showAll ? 100000 : perPage);
            if (df) url += '&date_from=' + df;
            if (dt) url += '&date_to=' + dt;
            fetch(url)
                .then(r => r.json())
                .then(d => {
                    piList = d.items || [];
                    totalPages = d.total_pages || 1;
                    render(piList.filter(function(p) {
                        return !q || 
                            (p.invoice_no || '').toLowerCase().includes(q) ||
                            (p.supplier_name || '').toLowerCase().includes(q) ||
                            (p.status || '').toLowerCase().includes(q);
                    }));
                    renderPagination();
                });
        }
        
        function clearDates() {
            document.getElementById('df').value = '';
            document.getElementById('dt').value = '';
            load(1);
        }
        
        function toggleShowAll() {
            showAll = !showAll;
            currentPage = 1;
            load();
        }
        function goToPage(p) {
            p = parseInt(p);
            if (p >= 1 && p <= totalPages) load(p);
        }
        function renderPagination() {
            var html = '';
            if (totalPages > 1) {
                html += '<button class="btn btn-sm" onclick="load(1)"' + (currentPage <= 1 ? ' disabled' : '') + '>« First</button>';
                html += '<button class="btn btn-sm" onclick="load(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '>← Prev</button>';
                html += '<input type="number" id="pg" value="' + currentPage + '" min="1" max="' + totalPages + '" onchange="goToPage(this.value)" style="width:50px;text-align:center;padding:2px 4px;font-size:13px;border:1px solid #ddd;border-radius:4px">';
                html += '<span style="margin:0 4px;color:#6b7280;font-size:13px">/ ' + totalPages + '</span>';
                html += '<button class="btn btn-sm" onclick="load(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>Next →</button>';
                html += '<button class="btn btn-sm" onclick="load(' + totalPages + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>Last »</button>';
            }
            html += ' <button class="btn btn-sm" onclick="toggleShowAll()">' + (showAll ? 'Paginated' : 'Show All') + '</button>';
            document.getElementById('pagination').innerHTML = html;
            document.getElementById('pagination-top').innerHTML = html;
        }
        
        function render(l) {
            document.getElementById('tb').innerHTML = l.map((p, i) => 
                '<tr>' +
                '<td style="color:#6b7280;font-size:12px">' + ((currentPage - 1) * perPage + i + 1) + '</td>' +
                '<td style="font-weight:600">' + p.invoice_no + '</td>' +
                '<td>' + (p.issue_date || '') + '</td>' +
                '<td>' + (p.supplier_name ? '<a href="/ledger/supplier/' + p.supplier_id + '" style="text-decoration:none;color:inherit">' + p.supplier_name + '</a>' : '-') + '</td>' +
                '<td class="text-right">Rs ' + (p.invoice_amount || 0).toFixed(2) + '</td>' +
                '<td class="text-right">Rs ' + (p.balance_due || 0).toFixed(2) + '</td>' +
                '<td>' + statusCell(p) + '</td>' +
                '<td>' + dueInfo(p) + '</td>' +
                '<td>' +
                '<button class="btn btn-xs btn-ghost" onclick="viewPI(' + p.id + ')">View</button>' +
                (p.balance_due > 0 && p.supplier_id && ({{role|tojson}} == 'manager' || {{role|tojson}} == 'owner') ?
                    '<button class="btn btn-xs btn-ghost" onclick="payPI(' + p.id + ',' + p.supplier_id + ')">Pay</button>' : '') +
                '<button class="btn btn-xs btn-ghost" onclick="window.open(\'/inventory/barcode?invoice_id=' + p.id + '\',\'_blank\')">Barcodes</button>' +
                ({{role|tojson}} == 'manager' || {{role|tojson}} == 'owner' ? 
                    '<button class="btn btn-xs btn-ghost" onclick="window.open(\'/purchase-invoices/create?id=' + p.id + '\',\'_blank\')">Edit</button>' +
                    '<button class="btn btn-xs btn-ghost" onclick="del(' + p.id + ')">Delete</button>' : '') +
                '</td>' +
                '</tr>'
            ).join('');
            
            var ta = 0, td = 0;
            l.forEach(function(p) {
                ta += p.invoice_amount || 0;
                td += p.balance_due || 0;
            });
            
            document.getElementById('tf').innerHTML = 
                '<tr>' +
                '<td colspan="4" class="text-right" style="padding:6px 8px">Total</td>' +
                '<td class="text-right" style="padding:6px 8px">Rs ' + ta.toFixed(2) + '</td>' +
                '<td class="text-right" style="padding:6px 8px">Rs ' + td.toFixed(2) + '</td>' +
                '<td></td>' +
                '<td></td>' +
                '<td></td>' +
                '</tr>';
        }
        
        function sortCol(i) {
            if (sortIdx === i) { sortDir *= -1; } else { sortIdx = i; sortDir = 1; }
            for (let j = 0; j < 8; j++) document.getElementById('si' + j).textContent = '';
            document.getElementById('si' + i).textContent = sortDir === 1 ? ' ▲' : ' ▼';
            
            const vals = [
                () => 0,
                p => (p.invoice_no || '').toLowerCase(),
                p => (p.issue_date || ''),
                p => (p.supplier_name || '').toLowerCase(),
                p => p.invoice_amount || 0,
                p => p.balance_due || 0,
                p => (p.status || '').toLowerCase(),
                p => {
                    if (!p.due_date) return 99999;
                    return (new Date(p.due_date) - new Date()) / (1000 * 60 * 60 * 24);
                }
            ];
            
            piList.sort((a, b) => {
                const va = vals[i](a), vb = vals[i](b);
                return va < vb ? -sortDir : va > vb ? sortDir : 0;
            });
            
            var q = document.getElementById('s').value.toLowerCase();
            render(piList.filter(function(p) {
                return !q || 
                    (p.invoice_no || '').toLowerCase().includes(q) ||
                    (p.supplier_name || '').toLowerCase().includes(q) ||
                    (p.status || '').toLowerCase().includes(q);
            }));
        }
        
        function loadSuppliers(selId) {
            fetch('/api/suppliers')
                .then(r => r.json())
                .then(d => {
                    suppliers = d.items || d;
                    const opts = '<option value="">-- Select --</option>' + suppliers.map(s => 
                        '<option value="' + s.id + '">' + s.name + ' — Rs ' + parseFloat(s.balance || 0).toFixed(2) + '</option>'
                    ).join('');
                    document.getElementById(selId).innerHTML = opts;
                });
        }
        
        function recalcDueDate(issueId, dueId, byId) {
            var days = document.getElementById(byId).value;
            var iv = document.getElementById(issueId).value;
            if (!days || !iv) return;
            var d = new Date(iv + 'T00:00:00');
            d.setDate(d.getDate() + parseInt(days));
            var fmt = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
            document.getElementById(dueId).value = fmt;
        }
        
        var supHl = { pis: -1, eis: -1 };
        function supSearch(selId) {
            var q = document.getElementById(selId + '_search').value.toLowerCase().trim();
            var list = q ? suppliers.filter(function(s){ return s.name.toLowerCase().indexOf(q) !== -1 || String(s.phone || '').toLowerCase().indexOf(q) !== -1; }) : suppliers;
            var g = document.getElementById(selId + '_list'); supHl[selId] = -1;
            if (!list.length) { g.style.display = 'none'; g.innerHTML = ''; return; }
            g.style.display = 'block';
            g.innerHTML = list.map(function(s){
                return '<div class="sup-item" data-id="' + s.id + '" onmousedown="event.preventDefault();pickSup(\'' + selId + '\',' + s.id + ')"><div class="sup-name">' + s.name + '</div><div class="sup-detail">' + (s.phone ? s.phone + ' &middot; ' : '') + 'Balance: Rs ' + parseFloat(s.balance || 0).toFixed(2) + '</div></div>';
            }).join('');
            supHl[selId] = 0;
            highlightSup(selId);
        }
        function highlightSup(selId) {
            var its = document.querySelectorAll('#' + selId + '_list .sup-item');
            for (var i = 0; i < its.length; i++) its[i].classList.toggle('hl', i === supHl[selId]);
        }
        function supKey(selId, e) {
            var its = document.querySelectorAll('#' + selId + '_list .sup-item');
            if (e.key === 'ArrowDown' && its.length) { e.preventDefault(); supHl[selId] = (supHl[selId] + 1) % its.length; highlightSup(selId); }
            else if (e.key === 'ArrowUp' && its.length) { e.preventDefault(); supHl[selId] = (supHl[selId] - 1 + its.length) % its.length; highlightSup(selId); }
            else if (e.key === 'Enter') { e.preventDefault(); if (its.length) pickSup(selId, parseInt(its[Math.max(supHl[selId], 0)].dataset.id)); }
            else if (e.key === 'Escape') { supClose(selId); }
        }
        function pickSup(selId, id) {
            var s = suppliers.find(function(x){ return x.id === id; });
            if (!s) return;
            document.getElementById(selId).value = s.id;
            document.getElementById(selId + '_search').value = s.name;
            supClose(selId);
            var by = selId === 'pis' ? 'pddb' : 'eddb';
            applySupDueDays(selId, by);
        }
        function supClose(selId) {
            var g = document.getElementById(selId + '_list');
            g.style.display = 'none'; g.innerHTML = ''; supHl[selId] = -1;
        }
        
        function applySupDueDays(selId, byId) {
            var sup = suppliers.find(function(s) { return String(s.id) === document.getElementById(selId).value; });
            var db = document.getElementById(byId);
            if (sup && parseInt(sup.due_days || 0) > 0 && !db.value) {
                db.value = sup.due_days;
                var pairs = { pis: ['pid', 'pdd', 'pddb'], eis: ['eid', 'edd', 'eddb'] };
                var p = pairs[selId];
                if (p) recalcDueDate(p[0], p[1], p[2]);
            }
        }
        
        function calcBalance() {
            var amt = parseFloat(document.getElementById('pia').value) || 0;
            document.getElementById('pbd').value = amt.toFixed(2);
        }
        
        function calcEditBalance() {
            var amt = parseFloat(document.getElementById('eia').value) || 0;
            document.getElementById('ebd').value = amt.toFixed(2);
        }
        
        function showAdd() {
            document.getElementById('am').classList.add('show');
            document.getElementById('pin').value = '';
            document.getElementById('pid').value = new Date().toISOString().slice(0, 10);
            document.getElementById('pdd').value = '';
            document.getElementById('pddb').value = '';
            document.getElementById('pis').value = '';
            document.getElementById('pis_search').value = '';
            document.getElementById('pia').value = '0';
            document.getElementById('pbd').value = '0.00';
            document.getElementById('pst').value = 'Unpaid';
            loadSuppliers('pis');
        }
        
        function savePI(e) {
            e.preventDefault();
            const invoice_no = document.getElementById('pin').value.trim();
            if (!invoice_no) return;
            
            fetch('/api/purchase-invoices', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    invoice_no: invoice_no,
                    issue_date: document.getElementById('pid').value,
                    due_date: document.getElementById('pdd').value,
                    supplier_id: document.getElementById('pis').value || null,
                    invoice_amount: document.getElementById('pia').value || 0,
                    balance_due: document.getElementById('pbd').value || 0,
                    status: document.getElementById('pst').value
                })
            })
            .then(r => r.json())
            .then(d => {
                if (d.error) { alert(d.error); return; }
                cl('am');
                load();
            });
        }
        
        function showEdit(id) {
            const p = piList.find(x => x.id === id);
            if (!p) return;
            editId = id;
            document.getElementById('ein').value = p.invoice_no;
            document.getElementById('eid').value = p.issue_date;
            document.getElementById('edd').value = p.due_date || '';
            document.getElementById('eddb').value = '';
            document.getElementById('eia').value = p.invoice_amount;
            document.getElementById('ebd').value = p.balance_due;
            document.getElementById('est').value = p.status;
            loadSuppliers('eis');
            document.getElementById('eis_search').value = p.supplier_name || '';
            document.getElementById('eis').value = p.supplier_id || '';
            
            document.getElementById('em').classList.add('show');
        }
        
        function editPI(e) {
            e.preventDefault();
            const invoice_no = document.getElementById('ein').value.trim();
            if (!invoice_no) return;
            
            fetch('/api/purchase-invoices/' + editId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    invoice_no: invoice_no,
                    issue_date: document.getElementById('eid').value,
                    due_date: document.getElementById('edd').value,
                    supplier_id: document.getElementById('eis').value || null,
                    invoice_amount: document.getElementById('eia').value || 0,
                    balance_due: document.getElementById('ebd').value || 0,
                    status: document.getElementById('est').value
                })
            })
            .then(r => r.json())
            .then(d => {
                if (d.error) { alert(d.error); return; }
                cl('em');
                load();
            });
        }
        
        function del(id) {
            if (!confirm('Delete this purchase invoice?')) return;
            fetch('/api/purchase-invoices/' + id, { method: 'DELETE' })
                .then(r => r.json())
                .then(() => load());
        }
        
        function viewPI(id) {
            window.location = '/purchase-invoices/' + id;
        }
        
        function payPI(id, supplierId) {
            payOpen(id, supplierId);
        }
        
        var payAccts = [], paySuppliers = [], payExpCats = [], paySelInvoiceId = null;
        
        function loadPayAccounts() {
            fetch('/api/accounts?per_page=10000').then(r => r.json()).then(function(d) {
                payAccts = d.items || d;
                document.getElementById('paya').innerHTML = payAccts.map(function(a) {
                    return '<option value="' + a.id + '">' + a.name + ' (' + a.type + ')</option>';
                }).join('');
            });
        }
        function loadPaySuppliers() {
            fetch('/api/suppliers?per_page=10000').then(r => r.json()).then(function(d) {
                paySuppliers = d.items || d;
            });
        }
        function loadPayExpenseCategories() {
            if (payExpCats.length) return;
            fetch('/api/expense-categories').then(r => r.json()).then(function(d) {
                payExpCats = d || [];
                document.getElementById('payexp').innerHTML = payExpCats.map(function(c) {
                    return '<option value="' + c.name + '">' + c.name + ' (Rs ' + c.total.toFixed(2) + ')</option>';
                }).join('');
            });
        }
        function getPayPartyId(value) {
            if (!value) return null;
            var parts = value.split('_');
            return { type: parts[0] === 'c' ? 'customer' : 'supplier', id: parseInt(parts[1], 10) };
        }
        function payToggleParty() {
            var value = document.getElementById('paypt').value;
            var partyField = document.getElementById('payparty_select');
            var invField = document.getElementById('payinv_select');
            var expField = document.getElementById('payexpense_select');
            var descField = document.getElementById('paydesc_field');
            partyField.style.display = 'none';
            invField.style.display = 'none';
            expField.style.display = 'none';
            descField.style.display = 'none';
            if (value === 'other') {
                descField.style.display = 'block';
            } else if (value === 'expense') {
                expField.style.display = 'block';
                loadPayExpenseCategories();
            } else {
                partyField.style.display = 'block';
                invField.style.display = 'block';
                loadPayInvoices();
            }
        }
        function loadPayInvoices() {
            var partyValue = document.getElementById('payparty').value;
            if (!partyValue) { document.getElementById('payinv_select').style.display = 'none'; return; }
            var party = getPayPartyId(partyValue);
            if (party.type !== 'supplier') return;
            document.getElementById('payinv_select').style.display = 'block';
            fetch('/api/suppliers/' + party.id + '/invoices').then(r => r.json()).then(function(invoices) {
                var sel = document.getElementById('payinv');
                sel.innerHTML = '<option value="">-- Auto-apply to oldest --</option>' + invoices.map(function(inv) {
                    var label = inv.invoice_no || inv.receipt;
                    var amount = inv.balance_due || inv.outstanding || 0;
                    return '<option value="p_' + inv.id + '">' + label + ' (Rs ' + amount.toFixed(2) + ')</option>';
                }).join('');
                if (paySelInvoiceId) sel.value = 'p_' + paySelInvoiceId;
            });
        }
        function payOpen(invoiceId, supplierId) {
            paySelInvoiceId = invoiceId;
            document.getElementById('paym').classList.add('show');
            document.getElementById('payd').value = new Date().toISOString().slice(0, 10);
            document.getElementById('paya').value = payAccts.length ? payAccts[0].id : '';
            document.getElementById('paypt').value = 'supplier';
            var partySel = document.getElementById('payparty');
            partySel.innerHTML = paySuppliers.map(function(s) {
                return '<option value="s_' + s.id + '">' + s.name + '</option>';
            }).join('');
            partySel.value = 's_' + supplierId;
            document.getElementById('paydesc').value = '';
            document.getElementById('payam').value = '';
            payToggleParty();
        }
        function paySave(event) {
            event.preventDefault();
            var amount = parseFloat(document.getElementById('payam').value);
            if (!amount || amount <= 0) return alert('Amount must be positive');
            var partyValue = document.getElementById('paypt').value;
            var data = {
                type: 'payment',
                account_id: parseInt(document.getElementById('paya').value, 10) || 0,
                amount: amount,
                date: document.getElementById('payd').value || new Date().toISOString().slice(0, 10),
                description: document.getElementById('paydesc').value,
                party_type: partyValue
            };
            if (partyValue === 'supplier') {
                var party = getPayPartyId(document.getElementById('payparty').value);
                if (party) { data.party_type = 'supplier'; data.party_id = party.id; }
                var invoiceValue = document.getElementById('payinv').value;
                if (invoiceValue) { data.reference_type = 'purchase'; data.reference_id = parseInt(invoiceValue.split('_')[1], 10); }
            } else if (partyValue === 'expense') {
                var expenseValue = document.getElementById('payexp').value;
                if (!expenseValue) return alert('Select an expense category');
                data.expense_category = expenseValue;
            }
            fetch('/api/transactions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(function(res) {
                if (res.error) { alert(res.error); return; }
                cl('paym');
                load();
            });
        }
        
        load();
        loadPayAccounts();
        loadPaySuppliers();
        
        function cl(id) {
            document.getElementById(id).classList.remove('show');
        }
        
        
        function printTable() {
            document.body.classList.add('printing');
            window.print();
        }
        
        window.addEventListener('afterprint', function() {
            document.body.classList.remove('printing');
        });
    </script>
</body>
</html>
