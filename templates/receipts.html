<!DOCTYPE html>
<html>
<head><title>JITM · Receipts</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css">
<style>.text-right{text-align:right}.text-muted{color:#888;font-size:13px}.actions{display:flex;gap:8px;align-items:center}.btn-xs{padding:4px 10px;font-size:12px}.btn-ghost{background:none;border:1px solid #ddd;cursor:pointer;border-radius:6px}.btn-ghost:hover{background:#f0f0f0}.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;align-items:center;justify-content:center}.modal.show{display:flex}.mc{background:#fff;border-radius:12px;padding:24px;width:420px;max-width:90vw;position:relative;max-height:90vh;overflow-y:auto}.mx{position:absolute;top:12px;right:16px;background:none;border:none;font-size:22px;cursor:pointer}.mc label{display:block;font-size:13px;font-weight:600;margin-top:12px;margin-bottom:4px}.mc input,.mc select{width:100%;padding:8px 10px;border:1px solid #ddd;border-radius:6px;font-size:14px;box-sizing:border-box}.mc .btn{margin-top:16px;width:100%}.bdg{display:inline-block;padding:2px 8px;border-radius:4px;font-size:11px;font-weight:600}.bdg-rec{background:#d4edda;color:#155724}.bdg-pay{background:#f8d7da;color:#721c24}.search{max-width:300px;margin-bottom:12px}.search input{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px}.party-field{display:none}
</style></head>
<body>
{{sidebar|safe}}
<div class="main">
    <div class="topbar"><h2>Receipts</h2><div class="actions">{% if role=='manager' %}<button class="btn btn-p btn-sm" onclick="showAdd()">+ Add Receipt</button>{% endif %}<span class="text-muted">{{name}}</span></div></div>
    <div class="content">
        <div class="search"><input id="s" placeholder="Search receipts..." oninput="load()"></div>
        <div class="table-wrap"><table><thead><tr><th onclick="sortCol(0)" style="cursor:pointer;user-select:none"># <span id="si0"></span></th><th onclick="sortCol(1)" style="cursor:pointer;user-select:none">Date <span id="si1"></span></th><th onclick="sortCol(2)" style="cursor:pointer;user-select:none">Received From <span id="si2"></span></th><th onclick="sortCol(3)" style="cursor:pointer;user-select:none">Account <span id="si3"></span></th><th onclick="sortCol(4)" style="cursor:pointer;user-select:none">Ref Invoice <span id="si4"></span></th><th onclick="sortCol(5)" style="cursor:pointer;user-select:none">Description <span id="si5"></span></th><th onclick="sortCol(6)" class="text-right" style="cursor:pointer;user-select:none">Amount <span id="si6"></span></th><th></th></tr></thead><tbody id="tb"></tbody></table></div>
        <div style="margin-top:12px;text-align:right"><button class="btn btn-sm btn-print" onclick="printTable()">Print</button></div>
    </div>
</div>
<div class="modal" id="am"><div class="mc"><button class="mx" onclick="cl('am')">&times;</button><h2>Add Receipt</h2>
<form onsubmit="save(event)">
<label>Date</label><input id="ad" type="date">
<label>Account</label><select id="aa"></select>
<label>Received From</label><select id="apt" onchange="toggleParty()"><option value="customer">Customer</option><option value="supplier">Supplier</option><option value="other">Other</option></select>
<div id="party_select" class="party-field"><label>Customer</label><select id="aparty" onchange="loadInvoices()"></select></div>
<div id="inv_select" class="party-field"><label>Invoice</label><select id="ainv"><option value="">-- Auto-apply to oldest --</option></select></div>
<div id="desc_field"><label>Description</label><input id="adesc"></div>
<label>Amount (Rs)</label><input id="aam" type="number" step="0.01" min="0" required>
<button class="btn btn-p" type="submit">Save</button>
</form></div></div>
<div class="modal" id="em"><div class="mc"><button class="mx" onclick="cl('em')">&times;</button><h2>Edit Receipt</h2>
<form onsubmit="edit(event)">
<label>Date</label><input id="ed" type="date">
<label>Account</label><select id="ea"></select>
<label>Received From</label><select id="ept" onchange="togglePartyE()"><option value="customer">Customer</option><option value="supplier">Supplier</option><option value="other">Other</option></select>
<div id="eparty_select" class="party-field"><label>Customer / Supplier</label><select id="eparty" onchange="loadInvoicesE()"></select></div>
<div id="einv_select" class="party-field"><label>Invoice</label><select id="einv"><option value="">-- Auto-apply to oldest --</option></select></div>
<div id="edesc_field"><label>Description</label><input id="edesc"></div>
<label>Amount (Rs)</label><input id="eam" type="number" step="0.01" min="0" required>
<button class="btn btn-p" type="submit">Update</button>
</form></div></div>
<script>
var list = [], sortIdx = -1, sortDir = 1, editId = null, accts = [], customers = [], suppliers = [];
function load(){var q=document.getElementById('s').value.toLowerCase();fetch('/api/transactions?type=receipt').then(r=>r.json()).then(d=>{list=d;render(d.filter(function(x){return!q||(x.date||'').includes(q)||(x.party_name||'').toLowerCase().includes(q)||(x.account_name||'').toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q)||(x.reference_label||'').toLowerCase().includes(q);}));});}
function render(l){
    document.getElementById('tb').innerHTML=l.map(function(x,i){var p=x.party_name||(x.party_type==='other'?'Other':x.party_type);var plink='';if(x.party_type==='customer'||x.party_type==='supplier'){plink='<a href="/ledger/'+x.party_type+'/'+x.party_id+'" style="text-decoration:none;color:inherit">'+p+'</a>';}else{plink=p;}return'<tr><td style="color:#6b7280;font-size:12px">'+(i+1)+'</td><td>'+x.date+'</td><td>'+plink+'</td><td>'+x.account_name+'</td><td>'+(x.reference_label||'')+'</td><td>'+(x.description||'')+'</td><td class="text-right"><span class="bdg bdg-rec">Rs '+x.amount.toFixed(2)+'</span></td><td>'+({{role|tojson}}=='manager'?'<button class="btn btn-xs btn-ghost" onclick="showEdit('+x.id+')">Edit</button><button class="btn btn-xs btn-ghost" onclick="del('+x.id+')">Delete</button>':'')+'</td></tr>';}).join('');
}
function sortCol(i){if(sortIdx===i){sortDir*=-1;}else{sortIdx=i;sortDir=1;}for(let j=0;j<7;j++)document.getElementById('si'+j).textContent='';document.getElementById('si'+i).textContent=sortDir===1?' \u25B2':' \u25BC';const vals=[()=>0,x=>x.date,x=>x.party_name||x.party_type,x=>x.account_name.toLowerCase(),x=>x.reference_label||'',x=>(x.description||'').toLowerCase(),x=>x.amount];list.sort((a,b)=>{var va=vals[i](a),vb=vals[i](b);return va<vb?-sortDir:va>vb?sortDir:0;});var q=document.getElementById('s').value.toLowerCase();render(list.filter(function(x){return!q||(x.date||'').includes(q)||(x.party_name||'').toLowerCase().includes(q)||(x.account_name||'').toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q)||(x.reference_label||'').toLowerCase().includes(q);}));}
function loadAccts(){fetch('/api/accounts').then(r=>r.json()).then(d=>{accts=d;var o=d.map(function(a){return'<option value="'+a.id+'">'+a.name+' ('+a.type+')</option>';}).join('');document.getElementById('aa').innerHTML=o;document.getElementById('ea').innerHTML=o;});}
function loadParties(){fetch('/api/customers').then(r=>r.json()).then(function(d){customers=d;var o=d.map(function(c){return'<option value="c_'+c.id+'">'+c.name+'</option>';}).join('');document.getElementById('aparty').innerHTML=o;});fetch('/api/suppliers').then(r=>r.json()).then(function(d){suppliers=d;});}
function toggleParty(){var v=document.getElementById('apt').value;if(v==='other'){document.getElementById('party_select').style.display='none';document.getElementById('inv_select').style.display='none';document.getElementById('desc_field').style.display='block';}else{document.getElementById('party_select').style.display='block';document.getElementById('desc_field').style.display='none';rebuildPartySelect(v,'aparty','c_');loadInvoices();}}
function rebuildPartySelect(type,selId,prefix){var sel=document.getElementById(selId);if(type==='customer'){sel.innerHTML=customers.map(function(c){return'<option value="c_'+c.id+'">'+c.name+'</option>';}).join('');}else{sel.innerHTML=suppliers.map(function(s){return'<option value="s_'+s.id+'">'+s.name+'</option>';}).join('');}sel.onchange=type==='customer'?loadInvoices:loadInvoices;}
function getPartyId(val){if(!val)return null;var parts=val.split('_');return{type:parts[0]==='c'?'customer':'supplier',id:parseInt(parts[1])};}
function loadInvoices(){var v=document.getElementById('apt').value;var partyEl=document.getElementById('aparty');var pv=partyEl.value;if(v==='other'||!pv){document.getElementById('inv_select').style.display='none';return;}document.getElementById('inv_select').style.display='block';var pi=getPartyId(pv);var url=pi.type==='customer'?'/api/customers/'+pi.id+'/invoices':'/api/suppliers/'+pi.id+'/invoices';fetch(url).then(r=>r.json()).then(function(invs){var sel=document.getElementById('ainv');sel.innerHTML='<option value="">-- Auto-apply to oldest --</option>'+invs.map(function(inv){var label=inv.receipt||inv.invoice_no;var amt=inv.outstanding||inv.balance_due;return'<option value="'+(pi.type==='customer'?'s_':'p_')+inv.id+'">'+label+' (Rs '+amt.toFixed(2)+')</option>';}).join('');});}
function togglePartyE(){var v=document.getElementById('ept').value;if(v==='other'){document.getElementById('eparty_select').style.display='none';document.getElementById('einv_select').style.display='none';document.getElementById('edesc_field').style.display='block';}else{document.getElementById('eparty_select').style.display='block';document.getElementById('edesc_field').style.display='none';rebuildPartySelect(v,'eparty','c_');loadInvoicesE();}}
function rebuildPartySelectE(type,selId,prefix){var sel=document.getElementById(selId);if(type==='customer'){sel.innerHTML=customers.map(function(c){return'<option value="c_'+c.id+'">'+c.name+'</option>';}).join('');}else{sel.innerHTML=suppliers.map(function(s){return'<option value="s_'+s.id+'">'+s.name+'</option>';}).join('');}sel.onchange=type==='customer'?loadInvoicesE:loadInvoicesE;}
function loadInvoicesE(){var v=document.getElementById('ept').value;var partyEl=document.getElementById('eparty');var pv=partyEl.value;if(v==='other'||!pv){document.getElementById('einv_select').style.display='none';return;}document.getElementById('einv_select').style.display='block';var pi=getPartyId(pv);var url=pi.type==='customer'?'/api/customers/'+pi.id+'/invoices':'/api/suppliers/'+pi.id+'/invoices';fetch(url).then(r=>r.json()).then(function(invs){var sel=document.getElementById('einv');sel.innerHTML='<option value="">-- Auto-apply to oldest --</option>'+invs.map(function(inv){var label=inv.receipt||inv.invoice_no;var amt=inv.outstanding||inv.balance_due;return'<option value="'+(pi.type==='customer'?'s_':'p_')+inv.id+'">'+label+' (Rs '+amt.toFixed(2)+')</option>';}).join('');});}
function showAdd(){document.getElementById('am').classList.add('show');document.getElementById('ad').value=new Date().toISOString().slice(0,10);document.getElementById('aa').value=accts.length?accts[0].id:'';document.getElementById('apt').value='customer';document.getElementById('aam').value='';document.getElementById('adesc').value='';toggleParty();}
function getFormData(prefix){var pt=document.getElementById(prefix+'pt').value;var descEl=document.getElementById(prefix+'desc');var aid=parseInt(document.getElementById(prefix+'a').value)||0;var amt=parseFloat(document.getElementById(prefix+'am').value)||0;var data={type:'receipt',account_id:aid,amount:amt,date:document.getElementById(prefix+'d').value||new Date().toISOString().slice(0,10),description:descEl?descEl.value:'',party_type:pt};if(pt!=='other'){var pv=document.getElementById(prefix+'party').value;if(pv){var pi=getPartyId(pv);data.party_type=pi.type;data.party_id=pi.id;}var iv=document.getElementById(prefix+'inv').value;if(iv){var parts=iv.split('_');data.reference_type=parts[0]==='s'?'sale':'purchase';data.reference_id=parseInt(parts[1]);}}return data;}
function save(e){e.preventDefault();var amt=parseFloat(document.getElementById('aam').value);if(!amt||amt<=0)return alert('Amount must be positive');var data=getFormData('a');fetch('/api/transactions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(r=>r.json()).then(function(d){if(d.error){alert(d.error);return;}cl('am');load();});}
function showEdit(id){var x=list.find(function(o){return o.id===id;});if(!x)return;editId=id;document.getElementById('ed').value=x.date;document.getElementById('ea').value=x.account_id;document.getElementById('eam').value=x.amount;document.getElementById('edesc').value=x.description||'';document.getElementById('ept').value=x.party_type;togglePartyE();if(x.party_type!=='other'){var sel=document.getElementById('eparty');sel.value=(x.party_type==='customer'?'c_':'s_')+x.party_id;loadInvoicesE();if(x.reference_type&&x.reference_id){document.getElementById('einv').value=(x.reference_type==='sale'?'s_':'p_')+x.reference_id;}}document.getElementById('em').classList.add('show');}
function edit(e){e.preventDefault();var amt=parseFloat(document.getElementById('eam').value);if(!amt||amt<=0)return alert('Amount must be positive');var data=getFormData('e');fetch('/api/transactions/'+editId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(r=>r.json()).then(function(d){if(d.error){alert(d.error);return;}cl('em');load();});}
function del(id){if(!confirm('Delete this receipt?'))return;fetch('/api/transactions/'+id,{method:'DELETE'}).then(r=>r.json()).then(function(){load();});}
load();loadAccts();loadParties();
function cl(id){document.getElementById(id).classList.remove('show');}
window.onclick=function(e){var ms=document.querySelectorAll('.modal');ms.forEach(function(m){if(e.target===m)m.classList.remove('show');});};
function printTable(){document.body.classList.add('printing');window.print();}
window.addEventListener('afterprint',function(){document.body.classList.remove('printing');});
</script>
</body>
</html>
