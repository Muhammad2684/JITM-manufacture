<!DOCTYPE html>
<html>
<head>
    <title>JITM · Reports</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {{sidebar|safe}}
    <div class="main">
        <div class="topbar">
            <h2>Supplier Balance Report</h2>
            <div class="actions">
                <span class="text-muted">{{name}}</span>
            </div>
        </div>
        <div class="content">
            <div class="search">
                <input id="s" placeholder="Search..." oninput="load()">
            </div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortCol(0)" style="cursor:pointer;user-select:none"># <span id="si0"></span></th>
                            <th onclick="sortCol(1)" style="cursor:pointer;user-select:none">Supplier <span id="si1"></span></th>
                            <th onclick="sortCol(2)" style="cursor:pointer;user-select:none">Phone <span id="si2"></span></th>
                            <th onclick="sortCol(3)" style="cursor:pointer;user-select:none">Balance <span id="si3"></span></th>
                            <th onclick="sortCol(4)" style="cursor:pointer;user-select:none">Stock Cost <span id="si4"></span></th>
                        </tr>
                    </thead>
                    <tbody id="tb"></tbody>
                    <tfoot id="tf" style="font-weight:600;font-size:13px;border-top:2px solid #d1d5db"></tfoot>
                </table>
            </div>
        </div>
    </div>
    <script>
        var list = [], sortIdx = -1, sortDir = 1;
        function load() {
            fetch('/api/reports/supplier-balances').then(r=>r.json()).then(d=>{
                list = d;
                applyFilter();
            });
        }
        function applyFilter() {
            var q = document.getElementById('s').value.toLowerCase();
            var filtered = list.filter(function(item) {
                return !q ||
                    (item.name || '').toLowerCase().includes(q) ||
                    (item.phone || '').toLowerCase().includes(q);
            });
            render(filtered);
        }
        function render(l) {
            document.getElementById('tb').innerHTML = l.map(function(item, i) {
                return '<tr>' +
                    '<td style="color:#6b7280;font-size:12px">' + (i + 1) + '</td>' +
                    '<td style="font-weight:600"><a href="/ledger/supplier/' + item.id + '" style="text-decoration:none;color:inherit">' + item.name + '</a></td>' +
                    '<td>' + (item.phone || '-') + '</td>' +
                    '<td>Rs ' + item.balance.toFixed(2) + '</td>' +
                    '<td>Rs ' + item.stock_cost.toFixed(2) + '</td>' +
                    '</tr>';
            }).join('');
            var bal = 0, cost = 0;
            l.forEach(function(item) { bal += item.balance || 0; cost += item.stock_cost || 0; });
            document.getElementById('tf').innerHTML =
                '<tr>' +
                '<td colspan="3" class="text-right" style="padding:6px 8px">Total</td>' +
                '<td style="padding:6px 8px;font-weight:700">Rs ' + bal.toFixed(2) + '</td>' +
                '<td style="padding:6px 8px;font-weight:700">Rs ' + cost.toFixed(2) + '</td>' +
                '</tr>';
        }
        function sortCol(i) {
            if (sortIdx === i) { sortDir *= -1; } else { sortIdx = i; sortDir = 1; }
            for (let j = 0; j < 5; j++) document.getElementById('si' + j).textContent = '';
            document.getElementById('si' + i).textContent = sortDir === 1 ? ' ▲' : ' ▼';
            const vals = [
                () => 0,
                s => (s.name || '').toLowerCase(),
                s => (s.phone || '').toLowerCase(),
                s => s.balance || 0,
                s => s.stock_cost || 0
            ];
            list.sort(function(a, b) {
                var va = vals[i](a), vb = vals[i](b);
                return va < vb ? -sortDir : va > vb ? sortDir : 0;
            });
            applyFilter();
        }
        load();
    </script>
</body>
</html>
