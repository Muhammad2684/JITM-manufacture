<!DOCTYPE html>
<html>

<head>
    <title>JITM · Sales Invoices</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    {{sidebar|safe}}
    <div class="main">
        <div class="topbar">
            <h2>Sales Invoices</h2>
            <div class="actions"><a class="btn btn-p btn-sm" href="/sales-invoices/create" target="_blank">+ Add
                    Invoice</a><span class="text-muted">{{name}}</span></div>
        </div>
        <div class="content">
            <div class="search">
                <input id="s" placeholder="Search receipt or customer..." oninput="load(1)">
                <input type="date" id="df" onchange="load(1)" style="width:140px">
                <input type="date" id="dt" onchange="load(1)" style="width:140px">
                <button class="btn btn-sm" onclick="clearDates()">Clear</button>
            </div>
            <div class="pagination" id="pagination-top"></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortCol(0)" style="cursor:pointer;user-select:none"># <span id="si0"></span>
                            </th>
                            <th onclick="sortCol(1)" style="cursor:pointer;user-select:none">Receipt <span
                                    id="si1"></span></th>
                            <th onclick="sortCol(2)" style="cursor:pointer;user-select:none">Date <span id="si2"></span>
                            </th>
                            <th onclick="sortCol(3)" style="cursor:pointer;user-select:none">Customer <span
                                    id="si3"></span></th>
                            <th onclick="sortCol(4)" class="text-right" style="cursor:pointer;user-select:none">Items
                                <span id="si4"></span>
                            </th>
                            <th onclick="sortCol(5)" class="text-right" style="cursor:pointer;user-select:none">Total
                                <span id="si5"></span>
                            </th>
                            <th onclick="sortCol(6)" style="cursor:pointer;user-select:none">Payment <span
                                    id="si6"></span></th>
                            <th onclick="sortCol(7)" style="cursor:pointer;user-select:none">Staff <span
                                    id="si7"></span></th>
                            <th onclick="sortCol(8)" style="cursor:pointer;user-select:none">Status <span
                                    id="si8"></span></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tb"></tbody>
                    <tfoot id="tf" style="font-weight:600;font-size:13px;border-top:2px solid #d1d5db"></tfoot>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
            <div style="margin-top:12px;text-align:right"><button class="btn btn-sm btn-print"
                    onclick="printTable()">Print</button></div>
        </div>
    </div>
    <div class="modal" id="dm">
        <div class="mc" style="max-width:520px"><button class="mx" onclick="cl('dm')">&times;</button>
            <div id="dc"></div>
        </div>
    </div>
    <div class="modal" id="rm">
        <div class="mc" style="max-width:380px;scrollbar-width:none"><button class="mx" onclick="cl('rm')">&times;</button>
            <div id="rp">
                <div class="rec" id="rc"></div>
            </div>
            <style>#rm .mc::-webkit-scrollbar{display:none}</style>
<div class="ra"><button class="btn btn-p btn-sm" onclick="printReceiptModal()">Print</button> <button
                     class="btn btn-sm" onclick="cl('rm')">Done</button></div>
        </div>
    </div>
    <script>
        var allSales = [], sortIdx = -1, sortDir = 1, currentPage = 1, totalPages = 1, perPage = 50, showAll = false;
        function statusBadge(s) {
            if (s === 'Paid') return '<span class="bdg bdg-ok">Paid</span>';
            if (s === 'Partial') return '<span class="bdg bdg-warn">Partial</span>';
            if (s === 'Overpaid') return '<span class="bdg bdg-over">Overpaid</span>';
            if (s === 'returned') return '<span class="bdg bdg-err">Returned</span>';
            return '<span class="bdg bdg-err">Unpaid</span>';
        }
        function overpaidAmount(s) { if (s.status !== 'Overpaid') return 0; return (s.total || 0) - (s.paid || 0); }
        function statusCell(s) {
            var html = statusBadge(s.status);
            if (s.status === 'Overpaid' && overpaidAmount(s) > 0) html += '<div style="font-size:11px;color:#084298;margin-top:2px">+Rs ' + overpaidAmount(s).toFixed(2) + '</div>';
            if (s.status === 'Partial') html += '<div style="font-size:11px;color:#856404;margin-top:2px">Rs ' + ((s.total || 0) - (s.paid || 0)).toFixed(2) + ' due</div>';
            return html;
        }
        function dueInfo(s) {
            if (!s.due_date) return '<span style="color:#d1d5db;font-size:11px">—</span>';
            var due = new Date(s.due_date); var today = new Date(); today.setHours(0, 0, 0, 0);
            var diff = Math.round((due - today) / (1000 * 60 * 60 * 24));
            if (diff > 0) { var cls = diff <= 7 ? 'style="color:#856404"' : 'style="color:#16a34a"'; return '<span style="font-size:11px" ' + cls + '>' + diff + 'd left</span>'; }
            if (diff === 0) return '<span style="font-size:11px;color:#856404">Due today</span>';
            return '<span style="font-size:11px;color:#dc2626">' + Math.abs(diff) + 'd overdue</span>';
        }
        function load(page) {
            var q = document.getElementById('s').value;
            var df = document.getElementById('df').value;
            var dt = document.getElementById('dt').value;
            currentPage = page || 1;
            var url = '/api/sales?q=' + encodeURIComponent(q) + '&page=' + currentPage + '&per_page=' + (showAll ? 100000 : perPage);
            if (df) url += '&date_from=' + df;
            if (dt) url += '&date_to=' + dt;
            fetch(url)
                .then(function (r) { return r.json(); })
                .then(function (d) { 
                    allSales = d.items || []; 
                    totalPages = d.total_pages || 1;
                    render(allSales); 
                    renderPagination();
                })
                .catch(function (e) { });
        }
        function clearDates() {
            document.getElementById('df').value = '';
            document.getElementById('dt').value = '';
            load(1);
        }
        function toggleShowAll() {
            showAll = !showAll;
            currentPage = 1;
            load();
        }
        function goToPage(p) {
            p = parseInt(p);
            if (p >= 1 && p <= totalPages) load(p);
        }
        function renderPagination() {
            var html = '';
            if (totalPages > 1) {
                html += '<button class="btn btn-sm" onclick="load(1)"' + (currentPage <= 1 ? ' disabled' : '') + '>« First</button>';
                html += '<button class="btn btn-sm" onclick="load(' + (currentPage - 1) + ')"' + (currentPage <= 1 ? ' disabled' : '') + '>← Prev</button>';
                html += '<input type="number" id="pg" value="' + currentPage + '" min="1" max="' + totalPages + '" onchange="goToPage(this.value)" style="width:50px;text-align:center;padding:2px 4px;font-size:13px;border:1px solid #ddd;border-radius:4px">';
                html += '<span style="margin:0 4px;color:#6b7280;font-size:13px">/ ' + totalPages + '</span>';
                html += '<button class="btn btn-sm" onclick="load(' + (currentPage + 1) + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>Next →</button>';
                html += '<button class="btn btn-sm" onclick="load(' + totalPages + ')"' + (currentPage >= totalPages ? ' disabled' : '') + '>Last »</button>';
            }
            html += ' <button class="btn btn-sm" onclick="toggleShowAll()">' + (showAll ? 'Paginated' : 'Show All') + '</button>';
            document.getElementById('pagination').innerHTML = html;
            document.getElementById('pagination-top').innerHTML = html;
        }
        function render(l) {
            try {
                document.getElementById('tb').innerHTML = l.map(function (s, i) {
                    return '<tr><td style="color:#6b7280;font-size:12px">' + ((currentPage - 1) * perPage + i + 1) + '</td><td style="font-weight:600">' + (s.receipt || '') + '</td>'
                        + '<td>' + ((s.created_at || '')).slice(0, 16) + '</td>'
                        + '<td>' + (s.customer_name ? '<a href="/ledger/customer/' + s.customer_id + '" style="text-decoration:none;color:inherit">' + s.customer_name + '</a>' : '-') + '</td>'
                        + '<td class="text-right">' + ((s.items && s.items.length) || 0) + '</td>'
                        + '<td class="text-right fw-600">Rs ' + (s.total || 0).toFixed(2) + '</td>'
                        + '<td>' + (s.payment || '') + '</td>'
                        + '<td>' + (s.staff_name || '') + '</td>'
                        + '<td>' + statusCell(s) + '</td>'
                        + '<td><button class="btn btn-xs btn-ghost" onclick="printReceipt(' + s.id + ')">Print</button> <button class="btn btn-xs btn-ghost" onclick="editSale(' + s.id + ')">Edit</button> <button class="btn btn-xs btn-ghost" onclick="viewSale(' + s.id + ')">View</button> <button class="btn btn-xs btn-ghost" onclick="del(' + s.id + ')" style="color:#dc2626">Delete</button></td></tr>';
                }).join('');
                var tot = 0; l.forEach(function (s) { tot += s.total || 0; });
                document.getElementById('tf').innerHTML = '<tr><td colspan="5" class="text-right" style="padding:6px 8px">Total</td><td class="text-right" style="padding:6px 8px;font-weight:700">Rs ' + tot.toFixed(2) + '</td><td></td><td></td><td></td><td></td></tr>';
            } catch (e) {
            }
        }
        function editSale(id) { window.open('/sales-invoices/create?id=' + id, '_blank'); }
        function viewSale(id) { window.location = '/sales-invoices/' + id; }
        function sortCol(i) { if (sortIdx === i) { sortDir *= -1; } else { sortIdx = i; sortDir = 1; } for (let j = 0; j < 9; j++)document.getElementById('si' + j).textContent = ''; document.getElementById('si' + i).textContent = sortDir === 1 ? ' \u25B2' : ' \u25BC'; const vals = [() => 0, s => (s.receipt || '').toLowerCase(), s => (s.created_at || ''), s => (s.customer_name || '').toLowerCase(), s => (s.items ? s.items.length : 0), s => s.total || 0, s => (s.payment || '').toLowerCase(), s => (s.staff_name || '').toLowerCase(), s => (s.status || '').toLowerCase()]; allSales.sort((a, b) => { const va = vals[i](a), vb = vals[i](b); return va < vb ? -sortDir : va > vb ? sortDir : 0; }); render(allSales); }
        function detail(id) { fetch('/api/sales/' + id).then(r => r.json()).then(s => { let h = '<div class="rec"><div class="rh"><h3>JITM Baby Garments</h3><p>' + s.receipt + '</p><p>' + (s.created_at || '') + '</p></div><div class="ri">'; (s.items || []).forEach(i => { h += '<div class="rl"><span>' + i.quantity + 'x ' + i.product_name + (i.variant_label ? ' (' + i.variant_label + ')' : '') + '</span><span>Rs ' + i.total.toFixed(2) + '</span></div>'; }); h += '</div><div class="rl"><span>Subtotal</span><span>Rs ' + s.subtotal.toFixed(2) + '</span></div>'; if (s.discount > 0) h += '<div class="rl"><span>Discount</span><span>-Rs ' + s.discount.toFixed(2) + '</span></div>'; h += '<div class="rl" style="font-weight:700;font-size:15px"><span>TOTAL</span><span>Rs ' + s.total.toFixed(2) + '</span></div><div class="rl"><span>Payment</span><span>' + s.payment + '</span></div>' + (s.customer_name ? '<div class="rl"><span>Customer</span><span>' + s.customer_name + '</span></div>' : '') + '<div class="rl"><span>Staff</span><span>' + s.staff_name + '</span></div><div class="rl"><span>Status</span>' + statusBadge(s.status) + '</div>' + (s.due_date ? '<div class="rl"><span>Due Date</span><span>' + s.due_date + '</span></div>' : '') + '<div class="rl"><span>Paid</span><span>Rs ' + (s.paid || 0).toFixed(2) + '</span></div></div>'; document.getElementById('dc').innerHTML = h; document.getElementById('dm').classList.add('show'); }); }
        function cl(id) { document.getElementById(id).classList.remove('show'); }
        function del(id) { if (!confirm('Delete this sales invoice? Stock will be restored.')) return; fetch('/api/sales-invoices/' + id, { method: 'DELETE' }).then(r => r.json()).then(function (d) { if (d.error) { alert(d.error); return; } load(); }).catch(function () { alert('Delete failed'); }); }
        function fmt(n) { return n.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
        function printReceipt(id) { fetch('/api/sales/' + id).then(r => r.json()).then(function (d) { showR(d); }); }
        function showR(d) { var totQty = d.items.reduce(function (s, i) { return s + Math.abs(i.quantity); }, 0); var crAmt = 0; var trAmt = 0; var cashAmt = 0; d.payments.forEach(function (p) { if (p.method === 'credit') crAmt = p.amount; else if (p.method !== 'cash') trAmt += p.amount; else cashAmt += p.amount; }); var netCash = (d.cash_tendered || 0) ? ((d.cash_tendered || 0) - (d.change_given || 0)) : cashAmt; var recvAmt = (d.cash_tendered || 0) ? ((d.cash_tendered || 0) + trAmt) : (cashAmt + trAmt); var rfmt = function(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }; var h = '<div style="text-align:center;margin-bottom:6px"><img src="data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAoHBwgHBgoICAgLCgoLDhgQDg0NDh0VFhEYIx8lJCIfIiEmKzcvJik0KSEiMEExNDk7Pj4+JS5ESUM8SDc9Pjv/2wBDAQoLCw4NDhwQEBw7KCIoOzs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozs7Ozv/wAARCAA8ADwDASIAAhEBAxEB/8QAGgAAAwEBAQEAAAAAAAAAAAAAAAQGBQIHA//EAC8QAAEDAwIFAgYBBQAAAAAAAAECAwQABRESMQYhQVFhE4EUFSIycZFCB2Kh0fD/xAAZAQACAwEAAAAAAAAAAAAAAAACAwABBAX/xAAhEQADAAMAAQQDAAAAAAAAAAAAAQIDESEEEhMxQXGx8P/aAAwDAQACEQMRAD8A9loooqECiijaoQXlTo0JIVIdCM7Dcn2rmJcok4kMOhShukjBqOmylzJbjyznJ5eB0FcxXlx5TTrZwpKhTvb4P9rhe0UUUkQFYkviH0Jamm2AtKDgkqxk9cVt1M3SzSRKW9HbLjbh1YG6TRwpb6ZfJrJMp4ygiSm5kdL7ROlXQ7g9q+1TtqutstrBjybgwl5SySkKyE+CRyrWm3ONCt5mqV6jeBoDf1FwnYJxvmqctMZhyLJK70l7la34UlYDalNE5QtIyMUxZrQ9IkoeebKGUHV9QxqPYUlOmcaT8ux4bsRn+KG9IVjznnWVE4uvlslFEp1T4ScLZfTg/vcGnpU1zR0VNudJrZ6dRSttuDF0gNTI5OhwbHdJ6g01Wb4MjWgqZ44nvRLW2wyop+IWUrUN9IHMe9U1Y/E1pTdrSpoLSh1tWptSjgZ2xnznFHDSpNmbypusFTHzoxLNwtEcRpkNJdWlILqlk4SSM6UgEbDqa2IMNFnLkaIl1xLhCmWXAcIV1IV228/ukeHbsoumLIQW5iAEPMq5KVpGAsd+W496qCoBOokADmSaK6remJ8PHhUKoXV/dEPljroK5E58unb0laEp/A/3UZxm0FxIUtzBk63GFrAx6gSeR/7vV0/IQYheQ+htnBKnieSR3Fed3F13iq9MwbY2fh2RobJ6DP1LV+avFvezrYNuvV9IpP6fBwWF0qzoMhWj9DP+aqaVtsBq2W9mGz9jScZ7nqfc01S6e6bF3XqpsK4daQ80pp1AWhYwpJHIiu6KEAlLxanY2FuxnLhEb+x1pWJMceD/ADA886W+e2dqKl6Vc5V0WOTcZadJB/uGxPk5q0pdNvhpkmSmIyH1buBA1H3pivnQfbxOvVU9/f5I9yDxBxa4kyk/LreDlLZHM+25P5wKqbTZ4dmjehEbxn71nmpZ7k0/RVVba19Datta+gooooAD/9k=" style="width:80px;height:auto" alt="Logo"></div>'; h += '<div style="border-bottom:1px dashed #e2e1de;padding-bottom:6px;margin-bottom:6px">'; h += '<div class="rl"><span>Invoice/Receipt No:</span><span>' + d.receipt + '</span></div>'; h += '<div class="rl"><span>Customer Name:</span><span>' + (d.customer_name || 'Walk In') + '</span></div>'; h += '<div class="rl"><span>Mobile/Phone No:</span><span>' + (d.customer_phone || '-') + '</span></div>'; var dt = d.created_at ? (function(s){ var p=s.split(/[\s:-]/); var d=new Date(Date.UTC(+p[0],+p[1]-1,+p[2],+p[3],+p[4],+p[5]||0)); return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+d.getFullYear()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); })(d.created_at) : ''; h += '<div class="rl"><span>Date & Time:</span><span>' + dt + '</span></div></div>'; h += '<div style="display:grid;grid-template-columns:25px 25px 1fr 70px 70px;column-gap:0px;font-size:13px;border-bottom:1px dashed #e2e1de;padding-bottom:4px;margin-bottom:-3px">'; h += '<span style="text-align:center;background:#000;color:#fff;font-weight:700;padding:2px 4px;white-space:nowrap">S.</span><span style="text-align:center;background:#000;color:#fff;font-weight:700;padding:2px 4px;white-space:nowrap">Q.</span><span style="background:#000;color:#fff;font-weight:700;padding:2px 4px;white-space:nowrap">Description</span><span style="text-align:right;background:#000;color:#fff;font-weight:700;padding:2px 4px;white-space:nowrap">Price</span><span style="text-align:right;background:#000;color:#fff;font-weight:700;padding:2px 4px;white-space:nowrap">Total</span></div>'; h += '<div style="display:grid;grid-template-columns:25px 25px 1fr 70px 70px;column-gap:0px;font-size:13px;padding-block:10px;row-gap:15px">'; d.items.forEach(function (i) { h += '<span style="text-align:center;font-size:11px">' + (i.employee_nickname || '') + '</span>'; h += '<span style="text-align:center">' + Math.abs(i.quantity) + '</span>'; h += '<span>' + i.product_name + (i.variant_label ? ' (' + i.variant_label + ')' : '') + '<br><span style="font-size:11px;color:#000">' + (i.sku || '') + '</span></span>'; h += '<span style="text-align:right">' + rfmt(i.price) + '</span>'; h += '<span style="text-align:right">' + rfmt(i.total) + '</span>'; }); h += '</div>'; h += '<div class="rl"><span>Items: ' + d.items.length + '</span><span>Qty: ' + totQty + '</span></div>'; h += '<div class="rl" style="margin-bottom:6px"><span>Status/Tag:</span><span style="font-weight:600">' + (d.is_return ? 'Return' : d.status) + '</span></div>'; h += '<div style="border-top:1px dashed #e2e1de;padding-top:6px">'; h += '<div class="rl"><span>Sub Total:</span><span>Rs ' + fmt(d.subtotal) + '</span></div>'; h += '<div class="rl"><span>Addons:</span><span>Rs ' + fmt(d.discount) + '</span></div>'; h += '<div class="rl" style="font-weight:700;font-size:17px"><span>Total:</span><span>Rs ' + fmt(d.total) + '</span></div>'; h += '<div class="rl"><span>Credit:</span><span>Rs ' + fmt(crAmt) + '</span></div>'; h += '<div class="rl"><span>Cash:</span><span>Rs ' + fmt(netCash) + '</span></div>'; h += '<div class="rl"><span>Transfered:</span><span>Rs ' + fmt(trAmt) + '</span></div>'; h += '<div class="rl" style="font-weight:700;font-size:14px"><span>Change:</span><span>Rs ' + fmt(d.change_given || 0) + '</span></div>'; h += '<div class="rl" style="font-weight:700;font-size:14px"><span>Amount Received:</span><span>Rs ' + fmt(recvAmt) + '</span></div></div>'; h += '<div style="margin-top:10px;padding-top:8px;border-top:1px dashed #e2e1de;text-align:center;font-size:13px;color:#000;line-height:1.3">'; h += '<div style="font-size:15px;font-weight:600">Thanks for Shopping</div>'; h += 'Please check items, cash, and receipt before leaving.<br>'; h += 'Exchange within 10 days with receipt & barcode tag. Toys, personal care, undergarments & sale items non-exchangeable.<br>'; h += 'Imported items carry no guarantee. <strong>NO CASH Refund Allowed</strong><br>'; h += '<img src="https://barcode.tec-it.com/barcode.ashx?data=' + encodeURIComponent(d.receipt) + '&code=Code128&translate-esc=true&dpi=96&imagetype=png" style="width:180px;height:40px;margin:6px 0" alt="' + d.receipt + '"><br>'; document.getElementById('rc').innerHTML = h; document.getElementById('rm').classList.add('show'); }
        function printReceiptModal() {
            const receiptContent = document.getElementById('rc').innerHTML;
            let printIframe = document.getElementById('receipt-print-iframe');
            if (!printIframe) {
                printIframe = document.createElement('iframe');
                printIframe.id = 'receipt-print-iframe';
                printIframe.style.position = 'absolute';
                printIframe.style.width = '0px';
                printIframe.style.height = '0px';
                printIframe.style.border = 'none';
                document.body.appendChild(printIframe);
            }
            const iframeDoc = printIframe.contentWindow.document;
            iframeDoc.open();
            iframeDoc.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>Receipt Print</title>
                    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
                    <style>
                        * { print-color-adjust: exact; -webkit-print-color-adjust: exact; }
                        @page { 
                            size: 80mm auto; 
                            margin: 0; 
                        }
                        body { 
                            margin: 0; 
                            padding: 0;
                            font-family: Roboto, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
                        }
                        .rec { 
                            width: 76mm; 
                            margin: 0 auto; 
                            padding: 2mm;
                            box-sizing: border-box;
                            font-size: 13px;
                            color: #000;
                        }
                        .rec .rh { text-align: center; margin-bottom: 8px; }
                        .rec .rh h3 { font-size: 16px; margin: 0; }
                        .rec .ri { border-top: 1px dashed #000; border-bottom: 1px dashed #000; padding: 6px 0; margin: 6px 0; }
                        .rec .rl { display: flex; justify-content: space-between; padding: 1px 0; font-size: 13px; }
                    </style>
                </head>
                <body>
                    <div class="rec">
                        ${receiptContent}
                    </div>
                    <script>
                        window.onload = function() {
                            window.focus();
                            window.print();
                        };
                    <\/script>
                </body>
                </html>
            `);
            iframeDoc.close();
        }
        load();
        function printTable() { document.body.classList.add('printing'); window.print(); }
        window.addEventListener('afterprint', function () { document.body.classList.remove('printing'); });
    </script>
</body>

</html>
