<!DOCTYPE html>
<html><head><title>JITM · Staff</title><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/static/style.css"></head><body>
{{sidebar|safe}}
<div class="main">
    <div class="topbar"><h2>Staff</h2><div class="actions">{% if role == 'manager' %}<button class="btn btn-p btn-sm" onclick="showAdd()">+ Add Staff</button>{% endif %}<span class="text-muted">{{name}}</span></div></div>
    <div class="content"><div class="sg" id="sg"></div></div>
</div>
<div class="modal" id="fm"><div class="mc"><button class="mx" onclick="cl('fm')">&times;</button><h2 id="ft">Staff</h2>
<form onsubmit="save(event)"><label>Name</label><input id="sn" required><label>Username</label><input id="su" required>
<label>Password</label><input id="sp" type="password" placeholder="Leave blank to keep"><label>Role</label>
<select id="sr"><option value="staff">Staff</option><option value="manager">Manager</option></select>
<label><input type="checkbox" id="sa" checked> Active</label>
<button class="btn btn-p" type="submit">Save</button></form></div></div>
<div class="modal" id="am"><div class="mc" style="max-width:700px"><button class="mx" onclick="cl('am')">&times;</button><div id="ac"></div></div></div>
<script>
var editing=null;
load();
function load(){fetch('/api/staff').then(r=>r.json()).then(d=>render(d));}
function render(l){document.getElementById('sg').innerHTML=l.map(s=>'<div class="sc"><div class="sh"><h3>'+s.name+'</h3><span class="bdg bdg-'+(s.role==='manager'?'info':'ok')+'">'+s.role+'</span>'+(s.active?'':'<span class="bdg bdg-err">Inactive</span>')+'</div><div class="sm">@'+s.username+'</div>'+
'<div class="sa">{% if role=="manager" %}<button class="btn btn-xs btn-ghost" onclick="analytics('+s.id+')">Analytics</button> <button class="btn btn-xs" onclick="edit('+s.id+')">Edit</button>{% endif %}</div></div>').join('');}
function showAdd(){editing=null;document.getElementById('ft').textContent='Add Staff';document.getElementById('sn').value='';document.getElementById('su').value='';document.getElementById('sp').value='';document.getElementById('sr').value='staff';document.getElementById('sa').checked=true;document.getElementById('fm').classList.add('show');}
function edit(id){fetch('/api/staff').then(r=>r.json()).then(all=>{const s=all.find(x=>x.id===id);if(!s)return;editing=id;document.getElementById('ft').textContent=s.name;
document.getElementById('sn').value=s.name;document.getElementById('su').value=s.username;document.getElementById('sp').value='';document.getElementById('sr').value=s.role;document.getElementById('sa').checked=s.active;document.getElementById('fm').classList.add('show');});}
function save(e){e.preventDefault();const data={name:document.getElementById('sn').value,username:document.getElementById('su').value,password:document.getElementById('sp').value,role:document.getElementById('sr').value,active:document.getElementById('sa').checked?1:0};
fetch(editing?'/api/staff/'+editing:'/api/staff',{method:editing?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}).then(r=>r.json()).then(()=>{cl('fm');load();});}
function analytics(id){fetch('/api/staff/'+id+'/analytics').then(r=>r.json()).then(d=>{const s=d.staff;
let h='<h2>'+s.name+' <span class="bdg bdg-info">'+s.role+'</span></h2><div class="stats" style="margin-top:12px">'+
'<div class="stat"><div class="val">'+d.today_sales+'</div><div class="lbl">Today</div></div>'+
'<div class="stat"><div class="val">$'+d.today_revenue.toFixed(2)+'</div><div class="lbl">Today Revenue</div></div>'+
'<div class="stat"><div class="val">'+d.total_sales+'</div><div class="lbl">Total Sales</div></div>'+
'<div class="stat"><div class="val">$'+d.total_revenue.toFixed(2)+'</div><div class="lbl">Total Revenue</div></div>'+
'<div class="stat"><div class="val">$'+d.total_returns.toFixed(2)+'</div><div class="lbl">Returns</div></div></div>'+
'<h3 style="font-size:14px;margin:12px 0 8px">Recent Sales</h3>';
if(d.recent_sales&&d.recent_sales.length)h+='<table><tr><th>Receipt</th><th>Date</th><th class="text-right">Total</th><th>Payment</th><th>Status</th></tr>'+d.recent_sales.map(s=>'<tr><td>'+s.receipt+'</td><td>'+(s.created_at||'').slice(0,16)+'</td><td class="text-right">$'+s.total.toFixed(2)+'</td><td>'+s.payment+'</td><td><span class="bdg bdg-'+(s.status==='completed'?'ok':'err')+'">'+s.status+'</span></td></tr>').join('')+'</table>';
else h+='<p class="text-muted" style="font-size:13px">No sales yet</p>';
document.getElementById('ac').innerHTML=h;document.getElementById('am').classList.add('show');});}
function cl(id){document.getElementById(id).classList.remove('show');}
window.onclick=function(e){document.querySelectorAll('.modal').forEach(m=>{if(e.target===m)m.classList.remove('show');});};
</script></body></html>
