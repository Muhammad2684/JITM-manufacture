<!DOCTYPE html>
<html>
<head>
    <title>JITM · Staff</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    {{sidebar|safe}}
    <div class="main">
        <div class="topbar">
            <h2>Staff</h2>
            <div class="actions">
                {% if role == 'manager' or role == 'owner' %}
                    <button class="btn btn-p btn-sm" onclick="showAdd()">+ Add Account</button>
                {% endif %}
                <span class="text-muted">{{name}}</span>
            </div>
        </div>
        <div class="content">
            <div class="sg" id="sg"></div>
            <div class="pagination" id="pagination-top"></div>
            <div class="pagination" id="pagination"></div>
        </div>
    </div>
    
    <div class="modal" id="fm">
        <div class="mc">
            <button class="mx" onclick="cl('fm')">&times;</button>
            <h2 id="ft">Account</h2>
            <form onsubmit="save(event)">
                <label>Name</label>
                <input id="sn" required>
                <label>Username</label>
                <input id="su" required>
                <label>Nick Name</label>
                <input id="nn">
                <label>Password</label>
                <input id="sp" type="password" placeholder="Leave blank to keep">
                <label>Role</label>
                <select id="sr">
                    <option value="staff">Staff</option>
                    <option value="manager">Manager</option>
                    <option value="owner">Owner</option>
                </select>
                <label>Permissions</label>
                <div id="permissions-container" style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px">
                    <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" value="dashboard" class="perm-cb"> Dashboard
                    </label>
                    <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" value="pos" class="perm-cb"> POS
                    </label>
                    <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" value="purchase" class="perm-cb"> Purchase
                    </label>
                    <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" value="sales" class="perm-cb"> Sales
                    </label>
                    <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" value="inventory" class="perm-cb"> Inventory
                    </label>
                    <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" value="accounts" class="perm-cb"> Cash & Bank
                    </label>
                    <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" value="staff" class="perm-cb"> Staff
                    </label>
                    <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" value="summary" class="perm-cb"> Summary
                    </label>
                    <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" value="payroll" class="perm-cb"> Payroll
                    </label>
                    <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" value="reports" class="perm-cb"> Reports
                    </label>
                    <label style="font-size:12px;font-weight:normal;display:flex;align-items:center;gap:4px">
                        <input type="checkbox" value="settings" class="perm-cb"> Settings
                    </label>
                </div>
                <label>
                    <input type="checkbox" id="sa" checked> Active
                </label>
                <button class="btn btn-p" type="submit">Save</button>
            </form>
        </div>
    </div>
    
    <div class="modal" id="am">
        <div class="mc" style="max-width:700px">
            <button class="mx" onclick="cl('am')">&times;</button>
            <div id="ac"></div>
        </div>
    </div>
    
    <script>
        var editing = null;
        var currentPage = 1, totalPages = 1, perPage = 50;
        
        load();
        
        function load(page) {
            if (page) currentPage = page;
            fetch('/api/staff?page=' + currentPage + '&per_page=' + perPage)
                .then(r => r.json())
                .then(d => {
                    var staffList = d.items || d;
                    totalPages = d.total_pages || 1;
                    render(staffList);
                    renderPagination();
                });
        }
        
        function goToPage(p) {
            p = parseInt(p);
            if (p >= 1 && p <= totalPages) load(p);
        }
        function renderPagination() {
            var pag = document.getElementById('pagination');
            if (totalPages <= 1) {
                pag.innerHTML = '';
                document.getElementById('pagination-top').innerHTML = '';
                return;
            }
            
            var html = '<div class="pagination-controls">';
            html += '<button class="btn btn-sm" onclick="load(1)"' + (currentPage === 1 ? ' disabled' : '') + '>« First</button>';
            html += '<button class="btn btn-sm" onclick="load(' + (currentPage - 1) + ')"' + (currentPage === 1 ? ' disabled' : '') + '>‹ Prev</button>';
            html += '<input type="number" id="pg" value="' + currentPage + '" min="1" max="' + totalPages + '" onchange="goToPage(this.value)" style="width:50px;text-align:center;padding:2px 4px;font-size:13px;border:1px solid #ddd;border-radius:4px">';
            html += '<span style="margin:0 4px;color:#6b7280;font-size:13px">/ ' + totalPages + '</span>';
            html += '<button class="btn btn-sm" onclick="load(' + (currentPage + 1) + ')"' + (currentPage === totalPages ? ' disabled' : '') + '>Next ›</button>';
            html += '<button class="btn btn-sm" onclick="load(' + totalPages + ')"' + (currentPage === totalPages ? ' disabled' : '') + '>Last »</button>';
            html += '</div>';
            pag.innerHTML = html;
            document.getElementById('pagination-top').innerHTML = html;
        }
        
        function render(l) {
            var currentUserId = {{ session.get('user_id', 0) if session else 0 }};
            document.getElementById('sg').innerHTML = l.map(s => {
                var perms = [];
                try { perms = JSON.parse(s.permissions || '[]'); } catch(e) {}
                var permStr = perms.length ? perms.join(', ') : 'None';
                
                var deleteBtn = '';
                {% if role == 'manager' or role == 'owner' %}
                if (s.id !== currentUserId) {
                    deleteBtn = '<button class="btn btn-xs btn-ghost" onclick="del(' + s.id + ')" style="color:#dc2626">Delete</button>';
                }
                {% endif %}
                
                return '<div class="sc">' +
                '<div class="sh">' +
                '<h3>' + s.name + '</h3>' +
                '<span class="bdg bdg-' + (s.role === 'manager' || s.role === 'owner' ? 'info' : 'ok') + '">' + s.role + '</span>' +
                (s.active ? '' : '<span class="bdg bdg-err">Inactive</span>') +
                '</div>' +
                '<div class="sm">@' + s.username + (s.nick_name ? ' (' + s.nick_name + ')' : '') + '</div>' +
                '<div class="sm" style="font-size:11px;color:#6b7280">Permissions: ' + permStr + '</div>' +
                '<div class="sa">' +
                '{% if role == "manager" or role == "owner" %}' +
                '<button class="btn btn-xs btn-ghost" onclick="analytics(' + s.id + ')">Analytics</button> ' +
                '<button class="btn btn-xs" onclick="edit(' + s.id + ')">Edit</button> ' +
                deleteBtn +
                '{% endif %}' +
                '</div>' +
                '</div>';
            }).join('');
        }
        
        function showAdd() {
            editing = null;
            document.getElementById('ft').textContent = 'Add Account';
            document.getElementById('sn').value = '';
            document.getElementById('su').value = '';
            document.getElementById('nn').value = '';
            document.getElementById('sp').value = '';
            document.getElementById('sr').value = 'staff';
            document.getElementById('sa').checked = true;
            document.querySelectorAll('.perm-cb').forEach(cb => cb.checked = false);
            document.getElementById('fm').classList.add('show');
        }
        
        function edit(id) {
            fetch('/api/staff?per_page=10000')
                .then(r => r.json())
                .then(d => {
                    var all = d.items || d;
                    const s = all.find(x => x.id === id);
                    if (!s) return;
                    editing = id;
                    document.getElementById('ft').textContent = s.name;
                    document.getElementById('sn').value = s.name;
                    document.getElementById('su').value = s.username;
                    document.getElementById('nn').value = s.nick_name || '';
                    document.getElementById('sp').value = '';
                    document.getElementById('sr').value = s.role;
                    document.getElementById('sa').checked = s.active;
                    
                    var perms = [];
                    try { perms = JSON.parse(s.permissions || '[]'); } catch(e) {}
                    document.querySelectorAll('.perm-cb').forEach(cb => {
                        cb.checked = perms.includes(cb.value);
                    });
                    
                    document.getElementById('fm').classList.add('show');
                });
        }
        
        function save(e) {
            e.preventDefault();
            var perms = [];
            document.querySelectorAll('.perm-cb:checked').forEach(cb => perms.push(cb.value));
            
            const data = {
                name: document.getElementById('sn').value,
                username: document.getElementById('su').value,
                nick_name: document.getElementById('nn').value,
                password: document.getElementById('sp').value,
                role: document.getElementById('sr').value,
                permissions: JSON.stringify(perms),
                active: document.getElementById('sa').checked ? 1 : 0
            };
            
            fetch(editing ? '/api/staff/' + editing : '/api/staff', {
                method: editing ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            })
            .then(r => r.json())
            .then(() => { cl('fm'); load(); });
        }
        
        function analytics(id) {
            fetch('/api/staff/' + id + '/analytics')
                .then(r => r.json())
                .then(d => {
                    const s = d.staff;
                    let h = '<h2>' + s.name + ' <span class="bdg bdg-info">' + s.role + '</span></h2>' +
                        '<div class="stats" style="margin-top:12px">' +
                        '<div class="stat"><div class="val">' + d.today_sales + '</div><div class="lbl">Today</div></div>' +
                        '<div class="stat"><div class="val">Rs ' + d.today_revenue.toFixed(2) + '</div><div class="lbl">Today Revenue</div></div>' +
                        '<div class="stat"><div class="val">' + d.total_sales + '</div><div class="lbl">Total Sales</div></div>' +
                        '<div class="stat"><div class="val">Rs ' + d.total_revenue.toFixed(2) + '</div><div class="lbl">Total Revenue</div></div>' +
                        '<div class="stat"><div class="val">Rs ' + d.total_returns.toFixed(2) + '</div><div class="lbl">Returns</div></div>' +
                        '</div>' +
                        '<h3 style="font-size:14px;margin:12px 0 8px">Recent Sales</h3>';
                    
                    if (d.recent_sales && d.recent_sales.length) {
                        h += '<table><tr><th>Receipt</th><th>Date</th><th class="text-right">Total</th><th>Payment</th><th>Status</th></tr>' +
                            d.recent_sales.map(s => 
                                '<tr>' +
                                '<td>' + s.receipt + '</td>' +
                                '<td>' + (s.created_at || '').slice(0, 16) + '</td>' +
                                '<td class="text-right">Rs ' + s.total.toFixed(2) + '</td>' +
                                '<td>' + s.payment + '</td>' +
                                '<td><span class="bdg bdg-' + (s.status === 'completed' ? 'ok' : 'err') + '">' + s.status + '</span></td>' +
                                '</tr>'
                            ).join('') +
                            '</table>';
                    } else {
                        h += '<p class="text-muted" style="font-size:13px">No sales yet</p>';
                    }
                    
                    document.getElementById('ac').innerHTML = h;
                    document.getElementById('am').classList.add('show');
                });
        }
        
        function del(id) {
            if (!confirm('Are you sure you want to delete this account? This action cannot be undone.')) return;
            
            fetch('/api/staff/' + id, {
                method: 'DELETE'
            })
            .then(r => r.json())
            .then(d => {
                if (d.error) {
                    alert(d.error);
                    return;
                }
                load();
            });
        }
        
        function cl(id) {
            document.getElementById(id).classList.remove('show');
        }
        
    </script>
</body>
</html>
