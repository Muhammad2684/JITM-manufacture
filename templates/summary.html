<!DOCTYPE html>
<html>
<head>
    <title>JITM · Financial Summary</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f6f8;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
        }
        
        .sidebar {
            width: 230px;
            min-height: 100vh;
            background: #1a1c2e;
            color: #9ca3af;
            display: flex;
            flex-direction: column;
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            z-index: 100;
        }
        .sidebar .brand {
            padding: 20px 20px 12px;
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            letter-spacing: -.3px;
            border-bottom: 1px solid #2a2c3e;
            margin-bottom: 8px;
        }
        .sidebar .brand span { color: #818cf8; }
        .sidebar a {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 20px;
            color: #9ca3af;
            text-decoration: none;
            font-size: 13px;
            font-weight: 500;
            transition: .1s;
            border-left: 3px solid transparent;
        }
        .sidebar a:hover { color: #e2e8f0; background: #222438; }
        .sidebar a.active { color: #fff; background: #222438; border-left-color: #818cf8; }
        .sidebar .sec {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: .08em;
            color: #4b5563;
            padding: 16px 20px 6px;
            font-weight: 700;
        }
        .sidebar .spacer { flex: 1; }
        .sidebar .user {
            padding: 12px 20px;
            border-top: 1px solid #2a2c3e;
            font-size: 12px;
            color: #6b7280;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar .user .role {
            background: #222438;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 10px;
            color: #818cf8;
        }
        .main {
            margin-left: 230px;
            flex: 1;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .topbar {
            background: #fff;
            border-bottom: 1px solid #e5e7eb;
            padding: 0 24px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar h2 { font-size: 16px; font-weight: 600; color: #111827; }
        .topbar .actions { display: flex; gap: 8px; align-items: center; }
        
        .content { padding: 32px 40px; flex: 1; }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            max-width: 1100px;
            margin: 0 auto;
        }
        .grid-column { display: flex; flex-direction: column; gap: 22px; }
        
        .manager-card {
            background: #fcfbf8;
            border: 1px solid #e2e1de;
            border-radius: 10px;
            overflow: hidden;
        }
        .manager-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 20px;
            border-bottom: 1px solid #e2e1de;
        }
        .manager-card .card-header span:first-child {
            font-size: 13px;
            font-weight: 600;
            color: #1e293b;
            text-transform: uppercase;
            letter-spacing: .04em;
        }
        .manager-card .card-header span:last-child {
            font-size: 15px;
            font-weight: 700;
            color: #1e293b;
        }
        .manager-card .card-body { padding: 8px 20px 14px; }
        .card-body-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 7px 0;
            font-size: 13px;
        }
        .card-body-row span:first-child { color: #6b7280; }
        .card-body-row .value-active { font-weight: 600; color: #3b4fe2; cursor: pointer; transition: all 0.2s; }
        .card-body-row .value-active:hover { color: #2d3ab8; text-decoration: underline; }
        .card-body-row .value-null { color: #d1d5db; font-weight: 500; }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .modal-content {
            background: #fff;
            border-radius: 12px;
            max-width: 900px;
            width: 90%;
            max-height: 85vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid #e2e1de;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-header h3 {
            font-size: 18px;
            font-weight: 600;
            color: #1e293b;
            margin: 0;
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: #6b7280;
            cursor: pointer;
            padding: 0;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        .modal-close:hover { background: #f3f4f6; color: #1e293b; }
        .modal-body {
            padding: 24px;
            overflow-y: auto;
            flex: 1;
        }
        .modal-footer {
            padding: 16px 24px;
            border-top: 2px solid #e2e1de;
            background: #fff;
            flex-shrink: 0;
        }
        .detail-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .detail-table th {
            background: #f8f7f4;
            padding: 10px 12px;
            text-align: left;
            font-weight: 600;
            color: #6b7280;
            border-bottom: 2px solid #e2e1de;
        }
        .detail-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #f0efec;
            color: #374151;
        }
        .detail-table tr:hover td { background: #f8f7f4; }
        .detail-table .text-right { text-align: right; }
        .no-data {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>
<body>
    {{sidebar|safe}}
    <div class="main">
        <div class="topbar">
            <h2>Financial Summary</h2>
            <div class="actions">
                <span class="text-muted" style="font-size:12px;color:#9ca3af">{{name}}</span>
            </div>
        </div>
        <div class="content">
            <div class="dashboard-grid">
                <div class="grid-column">
                    <h3 style="font-size:14px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px">Balance Sheet</h3>
                    <div class="manager-card">
                        <div class="card-header">
                            <span>Assets</span>
                            <span id="assets-total">0.00</span>
                        </div>
                        <div class="card-body" id="assets"></div>
                    </div>
                    <div class="manager-card">
                        <div class="card-header">
                            <span>Liabilities</span>
                            <span id="liabilities-total">0.00</span>
                        </div>
                        <div class="card-body" id="liabilities"></div>
                    </div>
                    <div class="manager-card">
                        <div class="card-header">
                            <span>Equity</span>
                            <span id="equity-total">0.00</span>
                        </div>
                        <div class="card-body" id="equity"></div>
                    </div>
                </div>
                <div class="grid-column">
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
                        <h3 style="font-size:14px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.04em;margin:0">Income Statement</h3>
                        <div style="display:flex;gap:8px;align-items:center">
                            <label style="margin:0;font-size:12px">From</label>
                            <input type="date" id="df" style="width:140px" onchange="loadIncomeStatement()">
                            <label style="margin:0;font-size:12px">To</label>
                            <input type="date" id="dt" style="width:140px" onchange="loadIncomeStatement()">
                            <button class="btn btn-sm" onclick="clearDates()" style="margin:0">Clear</button>
                        </div>
                    </div>
                    <div class="manager-card">
                        <div class="card-header">
                            <span>Net profit (loss)</span>
                            <span id="pnl-total">0.00</span>
                        </div>
                        <div class="card-body" id="pnl-items"></div>
                    </div>
                    <div class="manager-card">
                        <div class="card-header">
                            <span>Drawings</span>
                            <span id="drawings-total">0.00</span>
                        </div>
                        <div class="card-body" id="drawings-items"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal" id="detailModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Details</h3>
                <button class="modal-close" onclick="closeModal()">&times;</button>
            </div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer" id="modalFooter"></div>
        </div>
    </div>
    
    <script>
        function fmt(n) {
            return n.toLocaleString('en', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }
        
        function activeRow(label, amount, detailType) {
            return '<div class="card-body-row"><span>' + label + '</span><span class="value-active" onclick="showDetails(\'' + detailType + '\')">' + fmt(amount) + '</span></div>';
        }
        
        function nullRow(label) {
            return '<div class="card-body-row"><span>' + label + '</span><span class="value-null">&ndash;</span></div>';
        }
        
        function loadBalanceSheet() {
            fetch('/api/summary?section=balance_sheet')
                .then(r => r.json())
                .then(d => {
                    const bs = d.balance_sheet;
                    
                    document.getElementById('assets').innerHTML = bs.assets.map(a => {
                        let type = '';
                        if (a.label === 'Cash / Bank') type = 'cash_bank';
                        else if (a.label === 'Inventory Value') type = 'inventory';
                        else if (a.label === 'Customer Receivables') type = 'customer_receivables';
                        return activeRow(a.label, a.amount, type);
                    }).join('');
                    document.getElementById('assets-total').textContent = fmt(bs.total_assets);
                    
                    document.getElementById('liabilities').innerHTML = bs.liabilities.map(l => {
                        let type = '';
                        if (l.label === 'Supplier Payables') type = 'supplier_payables';
                        return activeRow(l.label, l.amount, type);
                    }).join('');
                    document.getElementById('liabilities-total').textContent = fmt(bs.total_liabilities);
                    
                    document.getElementById('equity').innerHTML = bs.equity.map(e => activeRow(e.label, e.amount, '')).join('');
                    document.getElementById('equity-total').textContent = fmt(bs.total_equity);
                });
        }
        
        function loadIncomeStatement() {
            var df = document.getElementById('df').value;
            var dt = document.getElementById('dt').value;
            var url = '/api/summary?section=income_statement';
            if (df) url += '&date_from=' + df;
            if (dt) url += '&date_to=' + dt;
            
            fetch(url)
                .then(r => r.json())
                .then(d => {
                    const pnl = d.pnl;
                    let h = '';
                    h += '<div style="font-size:11px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em;padding:10px 0 4px">Income</div>';
                    h += activeRow('Total Revenue', pnl.income[0].amount, 'total_revenue');
                    h += activeRow('Less Returns', pnl.income[1].amount, 'returns');
                    h += activeRow('Net Revenue', pnl.income[2].amount, '');
                    h += '<div style="font-size:11px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em;padding:10px 0 4px">Cost of Sales</div>';
                    h += activeRow('Cost of Goods Sold', pnl.expenses[0].amount, 'cogs');
                    h += activeRow('Discounts Given', pnl.expenses[1].amount, 'discounts');
                    h += '<div style="font-size:11px;font-weight:600;color:#9ca3af;text-transform:uppercase;letter-spacing:.04em;padding:10px 0 4px">Expenses</div>';
                    h += pnl.expenses_detail.map(e => {
                        const type = 'expense_' + e.label.toLowerCase().replace(/ /g, '_');
                        return activeRow(e.label, e.amount, type);
                    }).join('');
                    h += activeRow('Total Expenses', pnl.total_expenses, 'total_expenses');
                    
                    document.getElementById('pnl-items').innerHTML = h;
                    document.getElementById('pnl-total').textContent = fmt(pnl.net_profit);
                    
                    var dw = pnl.drawings || {};
                    document.getElementById('drawings-total').textContent = fmt((dw.p1 || 0) + (dw.p2 || 0));
                    document.getElementById('drawings-items').innerHTML =
                        activeRow('P1', dw.p1 || 0, 'drawing_p1') +
                        activeRow('P2', dw.p2 || 0, 'drawing_p2');
                });
        }
        
        function loadSummary() {
            loadBalanceSheet();
            loadIncomeStatement();
        }
        
        function clearDates() {
            document.getElementById('df').value = '';
            document.getElementById('dt').value = '';
            loadIncomeStatement();
        }
        
        function showDetails(type) {
            // Redirect to actual pages for balance sheet items (no date filtering)
            const redirects = {
                'cash_bank': '/accounts',
                'inventory': '/inventory',
                'customer_receivables': '/customers',
                'supplier_payables': '/suppliers'
            };
            
            if (redirects[type]) {
                window.location.href = redirects[type];
                return;
            }
            
            // For income statement items, apply date filtering
            var df = document.getElementById('df').value;
            var dt = document.getElementById('dt').value;
            var url = '/api/summary/details/' + type + '?';
            if (df) url += 'date_from=' + df + '&';
            if (dt) url += 'date_to=' + dt;
            
            fetch(url)
                .then(r => r.json())
                .then(d => {
                    document.getElementById('modalTitle').textContent = d.title;
                    
                    if (!d.rows || d.rows.length === 0) {
                        document.getElementById('modalBody').innerHTML = '<div class="no-data">No transactions found</div>';
                        document.getElementById('modalFooter').innerHTML = '';
                    } else {
                        let html = '<table class="detail-table"><thead><tr>';
                        d.columns.forEach(col => {
                            html += '<th>' + col + '</th>';
                        });
                        html += '</tr></thead><tbody>';
                        
                        d.rows.forEach(row => {
                            html += '<tr>';
                            row.forEach((cell, idx) => {
                                const isAmount = cell.startsWith('Rs ');
                                html += '<td' + (isAmount ? ' class="text-right"' : '') + '>' + cell + '</td>';
                            });
                            html += '</tr>';
                        });
                        
                        html += '</tbody></table>';
                        document.getElementById('modalBody').innerHTML = html;
                        
                        // Calculate totals for amount columns
                        let totals = new Array(d.columns.length).fill(0);
                        let hasAmounts = false;
                        d.rows.forEach(row => {
                            row.forEach((cell, idx) => {
                                if (cell.startsWith('Rs ')) {
                                    const amount = parseFloat(cell.replace('Rs ', '').replace(',', ''));
                                    if (!isNaN(amount)) {
                                        totals[idx] += amount;
                                        hasAmounts = true;
                                    }
                                }
                            });
                        });
                        
                        if (hasAmounts) {
                            let footerHtml = '<table class="detail-table"><tr style="font-weight:700;background:#f8f7f4;">';
                            totals.forEach((total, idx) => {
                                if (total > 0) {
                                    footerHtml += '<td class="text-right">Rs ' + fmt(total) + '</td>';
                                } else {
                                    footerHtml += '<td></td>';
                                }
                            });
                            footerHtml += '</tr></table>';
                            document.getElementById('modalFooter').innerHTML = footerHtml;
                        } else {
                            document.getElementById('modalFooter').innerHTML = '';
                        }
                    }
                    
                    document.getElementById('detailModal').classList.add('show');
                })
                .catch(err => {
                    console.error('Error fetching details:', err);
                    document.getElementById('modalTitle').textContent = 'Error';
                    document.getElementById('modalBody').innerHTML = '<div class="no-data">Failed to load details</div>';
                    document.getElementById('modalFooter').innerHTML = '';
                    document.getElementById('detailModal').classList.add('show');
                });
        }
        
        function closeModal() {
            document.getElementById('detailModal').classList.remove('show');
        }
        
        document.getElementById('detailModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });
        
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeModal();
            }
        });
        
        loadSummary();
    </script>
</body>
</html>
