<!DOCTYPE html>
<html>
<head>
    <title>JITM · Inter Account Transfers</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="/static/style.css">
    <style>
        .text-right { text-align: right; }
        .text-muted { color: #888; font-size: 13px; }
        .actions { display: flex; gap: 8px; align-items: center; }
        .btn-xs { padding: 4px 10px; font-size: 12px; }
        .btn-ghost {
            background: none;
            border: 1px solid #ddd;
            cursor: pointer;
            border-radius: 6px;
        }
        .btn-ghost:hover { background: #f0f0f0; }
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .3);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }
        .modal.show { display: flex; }
        .mc {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            width: 420px;
            max-width: 90vw;
            position: relative;
        }
        .mx {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            font-size: 22px;
            cursor: pointer;
        }
        .mc label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-top: 12px;
            margin-bottom: 4px;
        }
        .mc input, .mc select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            box-sizing: border-box;
        }
        .mc .btn { margin-top: 16px; width: 100%; }
        .search { max-width: 300px; margin-bottom: 12px; }
        .search input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .bdg {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }
        .bdg-out { background: #f8d7da; color: #721c24; }
        .bdg-in { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    {{sidebar|safe}}
    <div class="main">
        <div class="topbar">
            <h2>Inter Account Transfers</h2>
            <div class="actions">
                {% if role == 'manager' %}
                    <button class="btn btn-p btn-sm" onclick="showAdd()">+ New Transfer</button>
                {% endif %}
                <span class="text-muted">{{name}}</span>
            </div>
        </div>
        <div class="content">
            <div class="search">
                <input id="s" placeholder="Search transfers..." oninput="currentPage=1;load()">
            </div>
            <div class="pagination" id="pagination-top"></div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th onclick="sortCol(0)" style="cursor:pointer;user-select:none"># <span id="si0"></span></th>
                            <th onclick="sortCol(1)" style="cursor:pointer;user-select:none">Date <span id="si1"></span></th>
                            <th onclick="sortCol(2)" style="cursor:pointer;user-select:none">From <span id="si2"></span></th>
                            <th onclick="sortCol(3)" style="cursor:pointer;user-select:none">To <span id="si3"></span></th>
                            <th onclick="sortCol(4)" class="text-right" style="cursor:pointer;user-select:none">Amount <span id="si4"></span></th>
                            <th onclick="sortCol(5)" style="cursor:pointer;user-select:none">Note <span id="si5"></span></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody id="tb"></tbody>
                </table>
            </div>
            <div class="pagination" id="pagination"></div>
            <div style="margin-top:12px;text-align:right">
                <button class="btn btn-sm btn-print" onclick="printTable()">Print</button>
            </div>
        </div>
    </div>
    
    <div class="modal" id="am">
        <div class="mc">
            <button class="mx" onclick="cl('am')">&times;</button>
            <h2>New Transfer</h2>
            <form onsubmit="save(event)">
                <label>Date</label>
                <input id="ad" type="date">
                <label>From Account</label>
                <select id="afa"></select>
                <label>To Account</label>
                <select id="ata"></select>
                <label>Amount (Rs)</label>
                <input id="aam" type="number" step="0.01" min="0" required>
                <label>Note</label>
                <input id="ano" placeholder="Optional">
                <button class="btn btn-p" type="submit">Transfer</button>
            </form>
        </div>
    </div>
    
    <div class="modal" id="em">
        <div class="mc">
            <button class="mx" onclick="cl('em')">&times;</button>
            <h2>Edit Transfer</h2>
            <form onsubmit="saveEdit(event)">
                <label>Date</label>
                <input id="ed" type="date">
                <label>From Account</label>
                <select id="efa"></select>
                <label>To Account</label>
                <select id="eta"></select>
                <label>Amount (Rs)</label>
                <input id="eam" type="number" step="0.01" min="0" required>
                <label>Note</label>
                <input id="eno" placeholder="Optional">
                <button class="btn btn-p" type="submit">Update</button>
            </form>
        </div>
    </div>
    
    <script>
        var list = [], sortIdx = -1, sortDir = 1, editId = null, accts = [];
        var currentPage = 1, totalPages = 1, perPage = 50, showAll = false;
        
        function load(page) {
            if (page) currentPage = page;
            var q = document.getElementById('s').value.toLowerCase();
            var limit = showAll ? 100000 : perPage;
            fetch('/api/account-transfers?page=' + currentPage + '&per_page=' + limit)
                .then(r => r.json())
                .then(d => {
                    list = d.items || d;
                    totalPages = d.total_pages || 1;
                    render(list.filter(function(x) {
                        return !q || 
                            (x.date || '').includes(q) ||
                            (x.from_name || '').toLowerCase().includes(q) ||
                            (x.to_name || '').toLowerCase().includes(q) ||
                            (x.note || '').toLowerCase().includes(q);
                    }));
                    renderPagination();
                });
        }
        
        function toggleShowAll() {
            showAll = !showAll;
            currentPage = 1;
            load();
        }
        function goToPage(p) {
            p = parseInt(p);
            if (p >= 1 && p <= totalPages) load(p);
        }
        function renderPagination() {
            var pag = document.getElementById('pagination');
            if (totalPages <= 1) {
                var sa = '<button class="btn btn-sm" onclick="toggleShowAll()">' + (showAll ? 'Paginated' : 'Show All') + '</button>';
                pag.innerHTML = sa;
                document.getElementById('pagination-top').innerHTML = sa;
                return;
            }
            
            var html = '<div class="pagination-controls">';
            html += '<button class="btn btn-sm" onclick="load(1)"' + (currentPage === 1 ? ' disabled' : '') + '>« First</button>';
            html += '<button class="btn btn-sm" onclick="load(' + (currentPage - 1) + ')"' + (currentPage === 1 ? ' disabled' : '') + '>‹ Prev</button>';
            html += '<input type="number" id="pg" value="' + currentPage + '" min="1" max="' + totalPages + '" onchange="goToPage(this.value)" style="width:50px;text-align:center;padding:2px 4px;font-size:13px;border:1px solid #ddd;border-radius:4px">';
            html += '<span style="margin:0 4px;color:#6b7280;font-size:13px">/ ' + totalPages + '</span>';
            html += '<button class="btn btn-sm" onclick="load(' + (currentPage + 1) + ')"' + (currentPage === totalPages ? ' disabled' : '') + '>Next ›</button>';
            html += '<button class="btn btn-sm" onclick="load(' + totalPages + ')"' + (currentPage === totalPages ? ' disabled' : '') + '>Last »</button>';
            html += '</div>';
            html += ' <button class="btn btn-sm" onclick="toggleShowAll()">' + (showAll ? 'Paginated' : 'Show All') + '</button>';
            pag.innerHTML = html;
            document.getElementById('pagination-top').innerHTML = html;
        }
        
        function render(l) {
            document.getElementById('tb').innerHTML = l.map(function(x, i) {
                return '<tr>' +
                    '<td style="color:#6b7280;font-size:12px">' + ((currentPage - 1) * perPage + i + 1) + '</td>' +
                    '<td>' + x.date + '</td>' +
                    '<td><span class="bdg bdg-out">' + x.from_name + '</span></td>' +
                    '<td><span class="bdg bdg-in">' + x.to_name + '</span></td>' +
                    '<td class="text-right">Rs ' + x.amount.toFixed(2) + '</td>' +
                    '<td>' + (x.note || '') + '</td>' +
                    '<td>' + ({{role|tojson}} == 'manager' ? 
                        '<button class="btn btn-xs btn-ghost" onclick="showEdit(' + x.id + ')">Edit</button> ' +
                        '<button class="btn btn-xs btn-ghost" onclick="del(' + x.id + ')">Delete</button>' : '') +
                    '</td>' +
                    '</tr>';
            }).join('');
        }
        
        function sortCol(i) {
            if (sortIdx === i) { sortDir *= -1; } else { sortIdx = i; sortDir = 1; }
            for (let j = 0; j < 6; j++) document.getElementById('si' + j).textContent = '';
            document.getElementById('si' + i).textContent = sortDir === 1 ? ' ▲' : ' ▼';
            
            const vals = [
                () => 0,
                x => x.date,
                x => (x.from_name || '').toLowerCase(),
                x => (x.to_name || '').toLowerCase(),
                x => x.amount || 0,
                x => (x.note || '').toLowerCase()
            ];
            
            list.sort((a, b) => {
                var va = vals[i](a), vb = vals[i](b);
                return va < vb ? -sortDir : va > vb ? sortDir : 0;
            });
            
            var q = document.getElementById('s').value.toLowerCase();
            currentPage = 1;
            render(list.filter(function(x) {
                return !q || 
                    (x.date || '').includes(q) ||
                    (x.from_name || '').toLowerCase().includes(q) ||
                    (x.to_name || '').toLowerCase().includes(q) ||
                    (x.note || '').toLowerCase().includes(q);
            }));
            renderPagination();
        }
        
        function loadAccts() {
            fetch('/api/accounts?per_page=10000')
                .then(r => r.json())
                .then(d => {
                    accts = d.items || d;
                    var o = accts.map(function(a) {
                        return '<option value="' + a.id + '">' + a.name + ' (Rs ' + a.balance.toFixed(2) + ')</option>';
                    }).join('');
                    document.getElementById('afa').innerHTML = o;
                    document.getElementById('ata').innerHTML = o;
                    document.getElementById('efa').innerHTML = o;
                    document.getElementById('eta').innerHTML = o;
                });
        }
        
        function showAdd() {
            document.getElementById('am').classList.add('show');
            document.getElementById('ad').value = new Date().toISOString().slice(0, 10);
            document.getElementById('aam').value = '';
            document.getElementById('ano').value = '';
        }
        
        function showEdit(id) {
            var x = list.find(function(o) { return o.id === id; });
            if (!x) return;
            editId = id;
            document.getElementById('ed').value = x.date;
            document.getElementById('efa').value = x.from_account_id;
            document.getElementById('eta').value = x.to_account_id;
            document.getElementById('eam').value = x.amount;
            document.getElementById('eno').value = x.note || '';
            document.getElementById('em').classList.add('show');
        }
        
        function save(e) {
            e.preventDefault();
            var fa = parseInt(document.getElementById('afa').value);
            var ta = parseInt(document.getElementById('ata').value);
            var amt = parseFloat(document.getElementById('aam').value);
            
            if (!amt || amt <= 0) return alert('Amount must be positive');
            if (fa === ta) return alert('From and To accounts must be different');
            
            fetch('/api/account-transfers', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    from_account_id: fa,
                    to_account_id: ta,
                    amount: amt,
                    note: document.getElementById('ano').value,
                    date: document.getElementById('ad').value
                })
            })
            .then(r => r.json())
            .then(function(d) {
                if (d.error) { alert(d.error); return; }
                cl('am');
                load();
                loadAccts();
            });
        }
        
        function saveEdit(e) {
            e.preventDefault();
            var fa = parseInt(document.getElementById('efa').value);
            var ta = parseInt(document.getElementById('eta').value);
            var amt = parseFloat(document.getElementById('eam').value);
            
            if (!amt || amt <= 0) return alert('Amount must be positive');
            if (fa === ta) return alert('From and To accounts must be different');
            
            fetch('/api/account-transfers/' + editId, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    from_account_id: fa,
                    to_account_id: ta,
                    amount: amt,
                    note: document.getElementById('eno').value,
                    date: document.getElementById('ed').value
                })
            })
            .then(r => r.json())
            .then(function(d) {
                if (d.error) { alert(d.error); return; }
                cl('em');
                load();
                loadAccts();
            });
        }
        
        function del(id) {
            if (!confirm('Delete this transfer? Balances will be reversed.')) return;
            fetch('/api/account-transfers/' + id, { method: 'DELETE' })
                .then(r => r.json())
                .then(function(d) {
                    if (d.error) { alert(d.error); return; }
                    load();
                    loadAccts();
                });
        }
        
        function cl(id) {
            document.getElementById(id).classList.remove('show');
        }
        
        window.onclick = function(e) {
            document.querySelectorAll('.modal').forEach(m => {
                if (e.target === m) m.classList.remove('show');
            });
        };
        
        load();
        loadAccts();
        
        function printTable() {
            document.body.classList.add('printing');
            window.print();
        }
        
        window.addEventListener('afterprint', function() {
            document.body.classList.remove('printing');
        });
    </script>
</body>
</html>
